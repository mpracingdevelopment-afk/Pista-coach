<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pista Coach</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b0e;color:#f4f5f7;font-family:Arial,Helvetica,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
.layout{min-height:100vh}.sidebar{width:230px;background:#0f1216;border-right:1px solid #292f36;padding:20px;position:fixed;inset:0 auto 0 0}.logo{font-weight:800;font-size:20px;margin:5px 8px 30px}.logo span{color:#7f8994}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:#aeb5bd;text-align:left;padding:12px;border-radius:8px}.nav button.active,.nav button:hover{background:#1c2229;color:#fff}
.content{margin-left:230px;width:calc(100% - 230px);padding:28px;max-width:1550px}.header{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}.title{font-size:28px;font-weight:800}.subtitle{color:#8f98a3;margin-top:5px}.buttons{display:flex;gap:8px;flex-wrap:wrap}.btn{background:#171c22;color:#fff;border:1px solid #303740;border-radius:8px;padding:10px 14px}.btn.primary{background:#fff;color:#090b0e;border-color:#fff;font-weight:700}.btn.danger{color:#ff9696}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#12171c;border:1px solid #293038;border-radius:12px;padding:17px}.number{font-size:30px;font-weight:800;margin-top:6px}.muted{color:#929ba5}.list{display:grid;gap:9px;margin-top:12px}.row{background:#12171c;border:1px solid #293038;border-radius:11px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:15px}.identity{display:flex;align-items:center;gap:11px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#262d35;font-weight:800}.empty{border:1px dashed #303740;border-radius:11px;padding:35px;text-align:center;color:#929ba5}.section{margin-top:24px}.section h2{font-size:17px;margin:0 0 10px}
.modal-bg{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal{width:min(780px,100%);max-height:92vh;overflow:auto;background:#12171c;border:1px solid #303740;border-radius:14px;padding:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#aeb5bd}.field input,.field select{background:#0b0e12;color:#fff;border:1px solid #303740;border-radius:7px;padding:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.editor{display:grid;grid-template-columns:280px 1fr;gap:14px}.editor-tools{display:grid;gap:12px;align-content:start}.toolgroup{background:#12171c;border:1px solid #293038;border-radius:12px;padding:14px}.toolgroup h3{font-size:14px;margin:0 0 10px}.toolgroup .btn{width:100%;margin-bottom:7px}.toolgroup .btn:last-child{margin-bottom:0}.canvas-wrap{background:#0b0e12;border:1px solid #293038;border-radius:12px;overflow:hidden}.canvas-head{padding:13px 15px;border-bottom:1px solid #293038;display:flex;justify-content:space-between;gap:10px}.canvas{position:relative;height:min(70vh,680px);min-height:480px;overflow:hidden;background:#151a20}.canvas svg{width:100%;height:100%;display:block}.editor-bg{opacity:.28;pointer-events:none}.road{fill:none;stroke:#3d4650;stroke-width:42;stroke-linecap:round;stroke-linejoin:round}.road2{fill:none;stroke:#0b0f13;stroke-width:28;stroke-linecap:round;stroke-linejoin:round}.centre{fill:none;stroke:#f1f3f4;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round;stroke-linejoin:round}.editpoint{fill:#fff;stroke:#090b0e;stroke-width:2;cursor:grab}.editpoint.selected{fill:#ffd166}.handle{stroke:#ffd166;stroke-width:1.5;stroke-dasharray:4 4}.curve-label{font-size:12px;font-weight:800;text-anchor:middle;dominant-baseline:middle;pointer-events:none;fill:#111}.start-line{stroke:#fff;stroke-width:5}.info{font-size:12px;color:#9ba4ad;line-height:1.5}.check{display:flex;align-items:center;gap:8px;margin:8px 0;color:#c8ced5}.check input{accent-color:#fff}.track-preview{border:1px solid #293038;border-radius:12px;overflow:hidden;background:#0b0e12}.track-preview svg{width:100%;height:480px;display:block}.badge{font-size:12px;border:1px solid #303740;border-radius:999px;padding:5px 8px;color:#bcc4cc}
.toast{position:fixed;right:18px;bottom:18px;background:#fff;color:#111;padding:12px 15px;border-radius:8px;font-weight:700;z-index:40}
@media(max-width:950px){.sidebar{width:68px;padding:15px 8px}.logo{font-size:0;text-align:center}.logo:after{content:"PC";font-size:18px}.nav button{font-size:0;text-align:center}.content{margin-left:68px;width:calc(100% - 68px);padding:18px}.editor{grid-template-columns:220px 1fr}.cards{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.content{padding:12px}.header{align-items:flex-start;flex-direction:column}.editor{grid-template-columns:1fr}.canvas{height:60vh;min-height:380px}.fields{grid-template-columns:1fr}.track-preview svg{height:360px}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar"><div class="logo">PISTA <span>COACH</span></div><div class="nav">
<button data-nav="dashboard">Dashboard</button><button data-nav="drivers">Pilotos</button><button data-nav="tracks" class="active">Pistas</button><button data-nav="sessions">Sessões</button>
</div></aside>
<main class="content" id="content"></main>
</div><div id="overlay"></div>

<script>
(function(){
'use strict';
const KEY='pista_coach_v3';
const W=1000,H=650;
const base=[
[120,130],[260,85],[470,100],[700,145],[820,260],[770,410],[600,500],[390,470],
[220,520],[100,420],[110,300],[190,245],[300,275],[390,225],[520,255],[650,205]
];
const initial={drivers:[],tracks:[{id:1,name:'Portimão',variant:'Karting',corners:16,points:base,background:'',showRoad:true}],sessions:[]};
let db=load();
let state={page:'tracks',editorId:null,selectedPoint:0,drag:null};

function load(){try{let x=localStorage.getItem(KEY);return x?JSON.parse(x):initial}catch(e){return initial}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Não foi possível guardar. A imagem pode ser demasiado grande.');return false}}
function byId(a,id){return a.find(x=>String(x.id)===String(id))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(m){let x=document.createElement('div');x.className='toast';x.textContent=m;document.body.appendChild(x);setTimeout(()=>x.remove(),1600)}
function header(t,s,a){return '<div class="header"><div><div class="title">'+esc(t)+'</div><div class="subtitle">'+esc(s||'')+'</div></div><div>'+a+'</div></div>'}

function dashboard(){
return header('Dashboard','Coaching e análise em pista','<button class="btn primary" data-action="new-session">+ Nova sessão</button>')+
'<div class="cards"><div class="card"><div class="muted">Pilotos</div><div class="number">'+db.drivers.length+'</div></div><div class="card"><div class="muted">Pistas</div><div class="number">'+db.tracks.length+'</div></div><div class="card"><div class="muted">Sessões</div><div class="number">'+db.sessions.length+'</div></div><div class="card"><div class="muted">Editor</div><div class="number">V3</div></div></div>';
}
function drivers(){
return header('Pilotos','Pilotos acompanhados','<button class="btn primary" data-action="new-driver">+ Adicionar piloto</button>')+'<div class="list">'+(db.drivers.map(d=>'<div class="row"><div class="identity"><div class="avatar">'+esc(d.name[0])+'</div><div><b>'+esc(d.name)+'</b><div class="muted">'+esc(d.category||'Karting')+(d.number?' · #'+esc(d.number):'')+'</div></div></div><button class="btn danger" data-action="delete-driver" data-id="'+d.id+'">Apagar</button></div>').join('')||'<div class="empty">Adiciona o primeiro piloto.</div>')+'</div>';
}
function tracks(){
return header('Pistas','Criar e editar os layouts diretamente no browser','<button class="btn primary" data-action="new-track">+ Nova pista</button>')+'<div class="list">'+db.tracks.map(t=>'<div class="row"><div><b>'+esc(t.name)+'</b><div class="muted">'+esc(t.variant)+' · '+t.corners+' curvas'+(t.background?' · imagem de fundo':'')+'</div></div><div class="buttons"><button class="btn" data-action="edit-track" data-id="'+t.id+'">Editar layout</button><button class="btn" data-action="preview-track" data-id="'+t.id+'">Pré-visualizar</button><button class="btn danger" data-action="delete-track" data-id="'+t.id+'">Apagar</button></div></div>').join('')+'</div>';
}
function sessions(){
return header('Sessões','Histórico de coaching','<button class="btn primary" data-action="new-session">+ Nova sessão</button>')+'<div class="empty">A análise de sessões continua disponível na V2. Nesta versão o foco é o Editor de Pistas.</div>';
}

function pointsFor(t){return (t.points||base).map(p=>[Number(p[0]),Number(p[1])])}
function path(points){return points.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ')}
function editorSvg(t){
let p=pointsFor(t),d=path(p);
let marks=p.map((a,i)=>'<g data-point="'+i+'"><circle class="editpoint'+(state.selectedPoint===i?' selected':'')+'" cx="'+a[0]+'" cy="'+a[1]+'" r="10"></circle><text class="curve-label" x="'+a[0]+'" y="'+a[1]+'">'+(i+1)+'</text></g>').join('');
let bg=t.background?'<image class="editor-bg" href="'+t.background+'" x="0" y="0" width="'+W+'" height="'+H+'" preserveAspectRatio="xMidYMid slice"></image>':'';
let road=t.showRoad!==false?'<path class="road" d="'+d+'"></path><path class="road2" d="'+d+'"></path><path class="centre" d="'+d+'"></path>':'<path class="centre" d="'+d+'"></path>';
return '<svg id="editor-svg" viewBox="0 0 '+W+' '+H+'">'+bg+road+marks+'</svg>';
}
function editor(){
let t=byId(db.tracks,state.editorId),p=pointsFor(t),sel=p[state.selectedPoint]||p[0];
return '<div style="margin-bottom:12px"><button class="btn" data-action="back-tracks">← Voltar às pistas</button></div>'+
header('Editor · '+t.name,'Desenha e corrige o traçado diretamente no browser','<div class="buttons"><button class="btn" data-action="save-track">Guardar pista</button></div>')+
'<div class="editor"><div class="editor-tools">'+
'<div class="toolgroup"><h3>Traçado</h3><button class="btn" data-action="add-point">+ Adicionar ponto</button><button class="btn" data-action="delete-point">Apagar ponto selecionado</button><button class="btn" data-action="undo">Desfazer</button><div class="info">Arrasta os pontos brancos para moldar o traçado. A numeração acompanha a ordem dos pontos.</div></div>'+
'<div class="toolgroup"><h3>Imagem de fundo</h3><button class="btn" data-action="upload-bg">Importar imagem</button><button class="btn" data-action="remove-bg">Remover imagem</button><label class="check"><input id="show-road" type="checkbox" '+(t.showRoad!==false?'checked':'')+'> Mostrar pista/linha</label><div class="info">Usa uma imagem aérea ou um layout como referência e desenha por cima.</div><input id="bg-file" type="file" accept="image/*" hidden></div>'+
'<div class="toolgroup"><h3>Ponto selecionado</h3><div class="info">Ponto/curva: <b>'+ (state.selectedPoint+1) +'</b><br>X: '+Math.round(sel[0])+'<br>Y: '+Math.round(sel[1])+'</div><div style="margin-top:10px" class="field"><label>Número de curva</label><input id="corner-num" type="number" min="1" max="'+p.length+'" value="'+(state.selectedPoint+1)+'"></div></div>'+
'<div class="toolgroup"><h3>Meta</h3><button class="btn" data-action="set-start">Definir ponto selecionado como meta</button><div class="info">Meta atual: '+(t.startPoint!=null?'Curva/ponto '+(t.startPoint+1):'não definida')+'</div></div>'+
'</div><div class="canvas-wrap"><div class="canvas-head"><div><b>'+esc(t.name)+'</b><div class="muted">Clica num ponto para selecionar · arrasta para alterar o ângulo/linha</div></div><span class="badge">'+p.length+' pontos</span></div><div class="canvas" id="canvas">'+editorSvg(t)+'</div></div></div>';
}

function render(){
let c=document.getElementById('content');
if(state.page==='dashboard')c.innerHTML=dashboard();
else if(state.page==='drivers')c.innerHTML=drivers();
else if(state.page==='tracks')c.innerHTML=tracks();
else if(state.page==='editor')c.innerHTML=editor();
else c.innerHTML=sessions();
document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.page));
bindEditor();
}
function modal(html){document.getElementById('overlay').innerHTML='<div class="modal-bg" data-close="1"><div class="modal">'+html+'</div></div>'}
function closeModal(){document.getElementById('overlay').innerHTML=''}

function newTrack(){modal('<h2>Nova pista</h2><div class="fields"><div class="field"><label>Nome</label><input id="new-name"></div><div class="field"><label>Variante</label><input id="new-variant" value="Karting"></div><div class="field"><label>Número inicial de pontos/curvas</label><input id="new-corners" type="number" min="4" max="40" value="16"></div></div><p class="muted">Depois podes mover, adicionar e apagar pontos no editor.</p><div class="modal-actions"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="create-track">Criar</button></div>')}
function createTrack(){let name=document.getElementById('new-name').value.trim();if(!name)return;let n=Math.max(4,Math.min(40,Number(document.getElementById('new-corners').value)||16));let pts=[];for(let i=0;i<n;i++){let a=(Math.PI*2*i/n)-Math.PI/2;pts.push([500+330*Math.cos(a),325+230*Math.sin(a)])}let t={id:Date.now(),name,variant:document.getElementById('new-variant').value.trim()||'Karting',corners:n,points:pts,background:'',showRoad:true};db.tracks.push(t);save();closeModal();state.editorId=t.id;state.selectedPoint=0;state.page='editor';render()}
function editTrack(id){state.editorId=id;state.selectedPoint=0;state.page='editor';render()}
function deleteTrack(id){if(confirm('Apagar esta pista?')){db.tracks=db.tracks.filter(t=>String(t.id)!==String(id));save();render()}}
function previewTrack(id){let t=byId(db.tracks,id);modal('<h2>'+esc(t.name)+'</h2><div class="track-preview">'+editorSvg(t)+'</div><div class="modal-actions"><button class="btn" data-action="close">Fechar</button></div>')}

function newDriver(){modal('<h2>Novo piloto</h2><div class="fields"><div class="field"><label>Nome</label><input id="dn"></div><div class="field"><label>Número</label><input id="dnum"></div><div class="field full"><label>Categoria</label><input id="dcat" value="Karting"></div></div><div class="modal-actions"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="create-driver">Criar</button></div>')}
function createDriver(){let n=document.getElementById('dn').value.trim();if(!n)return;db.drivers.push({id:Date.now(),name:n,number:document.getElementById('dnum').value.trim(),category:document.getElementById('dcat').value.trim()||'Karting'});save();closeModal();render()}

function bindEditor(){
if(state.page!=='editor')return;
const svg=document.getElementById('editor-svg'),canvas=document.getElementById('canvas'),t=byId(db.tracks,state.editorId);
if(!svg||!canvas||!t)return;
svg.querySelectorAll('[data-point]').forEach(g=>{
g.addEventListener('pointerdown',e=>{e.preventDefault();state.selectedPoint=Number(g.dataset.point);state.drag={index:state.selectedPoint};g.setPointerCapture&&g.setPointerCapture(e.pointerId);render();});
});
svg.addEventListener('pointermove',e=>{
if(!state.drag)return;
const rect=svg.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*W,y=(e.clientY-rect.top)/rect.height*H;
let p=t.points[state.drag.index];if(p){p[0]=Math.max(10,Math.min(W-10,x));p[1]=Math.max(10,Math.min(H-10,y));renderEditorOnly();}
});
svg.addEventListener('pointerup',()=>{state.drag=null;save()});
svg.addEventListener('pointerleave',()=>{state.drag=null});
const file=document.getElementById('bg-file'); if(file)file.onchange=()=>{const f=file.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{t.background=reader.result;save();render()};reader.readAsDataURL(f)};
const show=document.getElementById('show-road');if(show)show.onchange=()=>{t.showRoad=show.checked;save();renderEditorOnly()};
const cn=document.getElementById('corner-num');if(cn)cn.onchange=()=>{let n=Math.max(1,Math.min(t.points.length,Number(cn.value)||1));if(n-1!==state.selectedPoint){state.selectedPoint=n-1;render()}};
}
function renderEditorOnly(){const wrap=document.getElementById('canvas');if(wrap){let t=byId(db.tracks,state.editorId);wrap.innerHTML=editorSvg(t)}document.querySelectorAll('[data-point]').forEach(g=>g.classList.toggle('selected',Number(g.dataset.point)===state.selectedPoint))}
function addPoint(){
let t=byId(db.tracks,state.editorId),p=t.points;
let i=Math.min(state.selectedPoint+1,p.length),a=p[state.selectedPoint]||[500,325],b=p[(state.selectedPoint+1)%p.length]||a;
p.splice(i,0,[(a[0]+b[0])/2,(a[1]+b[1])/2]);state.selectedPoint=i;save();render()
}
function deletePoint(){let t=byId(db.tracks,state.editorId);if(t.points.length<=4){toast('A pista precisa de pelo menos 4 pontos');return}t.points.splice(state.selectedPoint,1);state.selectedPoint=Math.max(0,Math.min(state.selectedPoint,t.points.length-1));t.corners=t.points.length;save();render()}
function uploadBg(){document.getElementById('bg-file').click()}
function removeBg(){let t=byId(db.tracks,state.editorId);t.background='';save();render()}
function setStart(){let t=byId(db.tracks,state.editorId);t.startPoint=state.selectedPoint;save();render();toast('Meta definida')}
function undo(){toast('O desfazer completo será adicionado na próxima iteração');}

document.addEventListener('click',e=>{
const nav=e.target.closest('[data-nav]');if(nav){state.page=nav.dataset.nav;state.editorId=null;render();return}
const a=e.target.closest('[data-action]');if(!a)return;const x=a.dataset.action;
if(x==='close'){closeModal();return}
if(x==='new-track'){newTrack();return}
if(x==='create-track'){createTrack();return}
if(x==='edit-track'){editTrack(Number(a.dataset.id));return}
if(x==='preview-track'){previewTrack(Number(a.dataset.id));return}
if(x==='delete-track'){deleteTrack(Number(a.dataset.id));return}
if(x==='back-tracks'){state.page='tracks';state.editorId=null;render();return}
if(x==='save-track'){save();toast('Pista guardada');return}
if(x==='add-point'){addPoint();return}
if(x==='delete-point'){deletePoint();return}
if(x==='upload-bg'){uploadBg();return}
if(x==='remove-bg'){removeBg();return}
if(x==='set-start'){setStart();return}
if(x==='undo'){undo();return}
if(x==='new-driver'){newDriver();return}
if(x==='create-driver'){createDriver();return}
if(x==='delete-driver'){if(confirm('Apagar este piloto?')){db.drivers=db.drivers.filter(d=>String(d.id)!==String(a.dataset.id));save();render()}return}
});
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.dataset.close)closeModal()});
render();
})();
</script>
</body>
</html>
