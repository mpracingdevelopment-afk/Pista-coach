<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pista Coach V10</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d10;color:#f5f6f7;font-family:Arial,Helvetica,sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}
.sidebar{position:fixed;inset:0 auto 0 0;width:220px;background:#111419;border-right:1px solid #292e35;padding:22px 16px;z-index:20}
.logo{font-size:20px;font-weight:800;margin:4px 8px 30px}.logo span{color:#87909a}
.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aeb5bd;text-align:left;padding:12px;border-radius:8px}
.nav button.active,.nav button:hover{background:#20252c;color:#fff}
main{margin-left:220px;padding:28px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}
.title{font-size:28px;font-weight:800}.sub,.muted{color:#8e97a1}
.btn{background:#171b21;color:#fff;border:1px solid #303740;border-radius:8px;padding:10px 14px}
.btn.primary{background:#fff;color:#111;border-color:#fff;font-weight:700}.btn.danger{color:#ff9999}
.buttons{display:flex;gap:8px;flex-wrap:wrap}
.list{display:grid;gap:9px}.row{background:#13171c;border:1px solid #292f36;border-radius:11px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:15px}
.empty{padding:40px;text-align:center;border:1px dashed #303740;border-radius:12px;color:#8e97a1}
.editor{display:grid;grid-template-columns:250px 1fr;gap:12px}
.panel{display:grid;gap:10px;align-content:start}.card{background:#13171c;border:1px solid #292f36;border-radius:11px;padding:13px}
.card h3{font-size:14px;margin:0 0 10px}.card .btn{width:100%;margin-bottom:7px}
.help{font-size:12px;color:#8e97a1;line-height:1.5}.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mode .btn.selected{background:#fff;color:#111}
.stagebox{background:#0e1115;border:1px solid #292f36;border-radius:11px;overflow:hidden}
.stagehead{padding:12px 14px;border-bottom:1px solid #292f36;display:flex;justify-content:space-between}
.stage{height:calc(100vh - 165px);min-height:520px;position:relative;overflow:hidden;background:#0e1115;touch-action:none}
.image-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.track-image{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none;pointer-events:none}
.point{position:absolute;width:32px;height:32px;border-radius:50%;transform:translate(-50%,-50%);background:#fff;color:#111;border:3px solid #111;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;z-index:5;box-shadow:0 2px 6px #0008}
.point.selected{background:#ffd05a}.point.added{cursor:pointer}
.click-layer{position:absolute;inset:0;z-index:2}
.comments{position:absolute;right:12px;top:12px;width:290px;max-height:calc(100% - 24px);overflow:auto;background:#171b20ee;border:1px solid #3b424a;border-radius:10px;padding:12px;z-index:10}
.comments h3{margin:0 0 10px}.field{display:grid;gap:5px;margin-bottom:8px}.field label{font-size:12px;color:#aeb5bd}
.field input,.field textarea{width:100%;background:#0b0e12;color:#fff;border:1px solid #303740;border-radius:7px;padding:8px}.field textarea{min-height:65px;resize:vertical}
.modalbg{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:20px;z-index:40}
.modal{background:#14181d;border:1px solid #343b44;border-radius:13px;padding:20px;width:min(600px,100%)}
.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
@media(max-width:850px){.sidebar{width:65px;padding:14px 7px}.logo{font-size:0;text-align:center}.logo:after{content:"PC";font-size:18px}.nav button{font-size:0;text-align:center}main{margin-left:65px;padding:16px}.editor{grid-template-columns:1fr}.stage{height:65vh;min-height:430px}.comments{left:12px;right:12px;width:auto}}
</style>
</head>
<body>
<aside class="sidebar">
<div class="logo">PISTA <span>COACH</span></div>
<div class="nav">
<button data-page="dashboard">Dashboard</button>
<button data-page="drivers">Pilotos</button>
<button data-page="tracks" class="active">Pistas</button>
<button data-page="sessions">Sessões</button>
</div>
</aside>
<main id="app"></main><div id="modal"></div>

<script>
'use strict';

const KEY='pista_coach_v9';
const LEGACY=['pista_coach_v8','pista_coach_v7','pista_coach_v6','pista_coach_v5','pista_coach_v4_1','pista_coach_v4','pista_coach_v3','pista_coach_v2','pista_coach_v1'];

let db=load();
let ui={page:'tracks',editor:null,mode:'add',selected:null};

function normalize(raw){
  raw=raw||{};
  const tracks=Array.isArray(raw.tracks)?raw.tracks.map((t,i)=>{
    const source=Array.isArray(t.points)?t.points:[];
    const points=source.map((p,j)=>({
      id:p.id||('p'+Date.now()+j),
      x:Number(p.x!=null?p.x:p[0])||0,
      y:Number(p.y!=null?p.y:p[1])||0,
      comment:p.comment||'',
      braking:p.braking||'',
      entry:p.entry||'',
      apex:p.apex||'',
      exit:p.exit||'',
      trajectory:p.trajectory||'',
      error:p.error||'',
      correction:p.correction||''
    }));
    return {
      id:t.id||Date.now()+i,
      name:t.name||('Pista '+(i+1)),
      variant:t.variant||'Karting',
      image:t.image||t.background||'',
      points
    };
  }):[];
  return {
    tracks,
    drivers:Array.isArray(raw.drivers)?raw.drivers:[],
    sessions:Array.isArray(raw.sessions)?raw.sessions:[]
  };
}

function load(){
  for(const key of [KEY,...LEGACY]){
    try{
      const raw=localStorage.getItem(key);
      if(raw){
        const data=normalize(JSON.parse(raw));
        localStorage.setItem(KEY,JSON.stringify(data));
        return data;
      }
    }catch(e){}
  }
  return normalize({});
}

function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db));return true}
  catch(e){toast('Não foi possível guardar os dados.');return false}
}

function esc(v){
  return String(v??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function toast(text){
  const el=document.createElement('div');
  el.textContent=text;
  el.style.cssText='position:fixed;right:18px;bottom:18px;background:#fff;color:#111;padding:11px 14px;border-radius:8px;font-weight:700;z-index:100';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1600);
}

function header(title,sub,actions=''){
  return `<div class="header"><div><div class="title">${esc(title)}</div><div class="sub">${esc(sub)}</div></div><div>${actions}</div></div>`;
}

function tracksPage(){
  return header('Pistas','Imagem + pontos de coaching.',
    '<button class="btn primary" data-action="new-track">+ Nova pista</button>')+
    `<div class="list">${
      db.tracks.map(t=>`<div class="row">
        <div><b>${esc(t.name)}</b><div class="muted">${esc(t.variant)} · ${t.points.length} curvas</div></div>
        <div class="buttons">
          <button class="btn" data-action="edit" data-id="${t.id}">Editar pista</button>
          <button class="btn danger" data-action="delete" data-id="${t.id}">Apagar</button>
        </div>
      </div>`).join('') ||
      '<div class="empty">Ainda não tens pistas.</div>'
    }</div>`;
}

function dashboard(){
  return header('Dashboard','Visão geral.','<button class="btn primary" data-action="new-track">+ Nova pista</button>')+
  `<div class="list">
    <div class="row"><b>Pistas</b><span class="muted">${db.tracks.length}</span></div>
    <div class="row"><b>Pilotos</b><span class="muted">${db.drivers.length}</span></div>
  </div>`;
}

function drivers(){
  return header('Pilotos','Pilotos.','<button class="btn primary" data-action="new-driver">+ Adicionar piloto</button>')+
  `<div class="list">${db.drivers.map(d=>`<div class="row"><b>${esc(d.name)}</b></div>`).join('')||'<div class="empty">Ainda não tens pilotos.</div>'}</div>`;
}

function sessions(){
  return header('Sessões','Sessões de coaching.','')+
  '<div class="empty">Aqui vamos ligar piloto + pista + sessão + análise.</div>';
}

function editor(){
  const t=db.tracks.find(x=>String(x.id)===String(ui.editor));
  if(!t){ui.page='tracks';return tracksPage()}

  const selected=ui.selected!=null?t.points[ui.selected]:null;

  const points=t.points.map((p,i)=>`
    <button class="point ${ui.selected===i?'selected':''}" data-point="${i}"
      style="left:${p.x}%;top:${p.y}%" title="Curva ${i+1}">${i+1}</button>`).join('');

  const comments=selected?`
    <div class="comments">
      <h3>Curva ${ui.selected+1}</h3>
      <div class="field"><label>Comentário geral</label><textarea id="comment">${esc(selected.comment)}</textarea></div>
      <div class="field"><label>Travagem</label><textarea id="braking">${esc(selected.braking)}</textarea></div>
      <div class="field"><label>Entrada</label><textarea id="entry">${esc(selected.entry)}</textarea></div>
      <div class="field"><label>Apex</label><textarea id="apex">${esc(selected.apex)}</textarea></div>
      <div class="field"><label>Saída</label><textarea id="exit">${esc(selected.exit)}</textarea></div>
      <div class="field"><label>Trajetória</label><textarea id="trajectory">${esc(selected.trajectory)}</textarea></div>
      <div class="field"><label>Erro</label><textarea id="error">${esc(selected.error)}</textarea></div>
      <div class="field"><label>Correção</label><textarea id="correction">${esc(selected.correction)}</textarea></div>
      <button class="btn primary" data-action="save-comment">Guardar comentário</button>
    </div>`:'';

  return `
    <div style="margin-bottom:12px"><button class="btn" data-action="back">← Pistas</button></div>
    ${header('Editar · '+t.name,'Coloca um ponto em cada curva que queres analisar.',
      '<button class="btn primary" data-action="save">Guardar pista</button>')}
    <div class="editor">
      <div class="panel">
        <div class="card">
          <h3>Imagem da pista</h3>
          <button class="btn" data-action="image">Carregar imagem</button>
          <input id="file" type="file" accept="image/*" hidden>
          <div class="help">A imagem é apenas a referência visual. É automaticamente centrada e dimensionada.</div>
        </div>
        <div class="card">
          <h3>Pontos</h3>
          <div class="mode">
            <button class="btn ${ui.mode==='add'?'selected':''}" data-mode="add">Adicionar</button>
            <button class="btn ${ui.mode==='select'?'selected':''}" data-mode="select">Selecionar</button>
          </div>
          <button class="btn danger" data-action="remove">Apagar selecionado</button>
          <div class="help">Adicionar: clica diretamente na imagem. Cada clique cria uma nova curva.</div>
        </div>
        <div class="card">
          <h3>Estado</h3>
          <div><b>${t.points.length}</b> curvas</div>
          <div class="help">Seleciona uma curva para editar os comentários.</div>
        </div>
      </div>

      <div class="stagebox">
        <div class="stagehead">
          <div><b>${esc(t.name)}</b><div class="muted">${ui.mode==='add'?'Modo adicionar: clica na imagem':'Modo selecionar: clica numa curva'}</div></div>
          <span class="muted">${t.points.length} curvas</span>
        </div>

        <div class="stage" id="stage">
          <div class="image-wrap" id="imageWrap">
            ${t.image
              ? `<img id="trackImage" class="track-image" src="${t.image}" alt="">`
              : '<div class="empty" style="margin:auto">Carrega uma imagem da pista</div>'}
          </div>
          <div class="click-layer" id="clickLayer"></div>
          ${points}
          ${comments}
        </div>
      </div>
    </div>`;
}

function render(){
  const app=document.getElementById('app');
  app.innerHTML=ui.page==='editor'?editor():
    ui.page==='dashboard'?dashboard():
    ui.page==='drivers'?drivers():
    ui.page==='sessions'?sessions():tracksPage();

  document.querySelectorAll('[data-page]').forEach(b=>
    b.classList.toggle('active',b.dataset.page===ui.page)
  );

  if(ui.page==='editor')bindEditor();
}

function modal(content){
  document.getElementById('modal').innerHTML=`<div class="modalbg"><div class="modal">${content}</div></div>`;
}
function closeModal(){document.getElementById('modal').innerHTML=''}

function newTrack(){
  modal(`<h2>Nova pista</h2>
    <div class="field"><label>Nome</label><input id="trackName" placeholder="Ex.: Viana"></div>
    <div class="field"><label>Variante</label><input id="trackVariant" value="Karting"></div>
    <div class="modalactions"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="create-track">Criar</button></div>`);
}

function createTrack(){
  const name=document.getElementById('trackName').value.trim();
  if(!name)return;
  const t={
    id:Date.now(),
    name,
    variant:document.getElementById('trackVariant').value.trim()||'Karting',
    image:'',
    points:[]
  };
  db.tracks.push(t);save();closeModal();
  ui.page='editor';ui.editor=t.id;ui.mode='add';ui.selected=null;render();
}

function newDriver(){
  modal(`<h2>Novo piloto</h2>
    <div class="field"><label>Nome</label><input id="driverName"></div>
    <div class="modalactions"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="create-driver">Criar</button></div>`);
}

function createDriver(){
  const name=document.getElementById('driverName').value.trim();
  if(!name)return;
  db.drivers.push({id:Date.now(),name});save();closeModal();render();
}

function bindEditor(){
  const t=db.tracks.find(x=>String(x.id)===String(ui.editor));
  const stage=document.getElementById('stage');
  const layer=document.getElementById('clickLayer');
  const image=document.getElementById('trackImage');
  if(!t||!stage||!layer)return;

  const file=document.getElementById('file');
  if(file){
    file.onchange=()=>{
      const f=file.files[0];
      if(!f)return;
      const reader=new FileReader();
      reader.onload=()=>{
        t.image=reader.result;
        save();
        render();
        toast('Imagem carregada');
      };
      reader.readAsDataURL(f);
    };
  }

  layer.onclick=(event)=>{
    if(ui.mode!=='add')return;
    if(!image){
      toast('Carrega primeiro uma imagem.');
      return;
    }

    const imageRect=image.getBoundingClientRect();
    const stageRect=stage.getBoundingClientRect();

    // Only accept clicks inside the visible image.
    if(event.clientX<imageRect.left || event.clientX>imageRect.right ||
       event.clientY<imageRect.top || event.clientY>imageRect.bottom)return;

    // Points are positioned relative to the whole stage, so calculate
    // their coordinates from the stage, not from the image.
    const x=((event.clientX-stageRect.left)/stageRect.width)*100;
    const y=((event.clientY-stageRect.top)/stageRect.height)*100;

    t.points.push({
      id:'p'+Date.now(),
      x,y,
      comment:'',braking:'',entry:'',apex:'',exit:'',
      trajectory:'',error:'',correction:''
    });

    ui.selected=t.points.length-1;
    save();
    render();
  };

  // Make image itself non-interactive; points are separate buttons.
  if(image)image.draggable=false;
}

document.addEventListener('click',event=>{
  const page=event.target.closest('[data-page]');
  if(page){
    ui.page=page.dataset.page;ui.editor=null;ui.selected=null;render();return;
  }

  const mode=event.target.closest('[data-mode]');
  if(mode){ui.mode=mode.dataset.mode;render();return;}

  const point=event.target.closest('[data-point]');
  if(point){
    ui.selected=Number(point.dataset.point);
    ui.mode='select';
    render();
    return;
  }

  const action=event.target.closest('[data-action]');
  if(!action)return;

  switch(action.dataset.action){
    case 'new-track':newTrack();break;
    case 'create-track':createTrack();break;
    case 'new-driver':newDriver();break;
    case 'create-driver':createDriver();break;
    case 'close':closeModal();break;
    case 'edit':
      ui.page='editor';ui.editor=action.dataset.id;ui.mode='add';ui.selected=null;render();break;
    case 'back':
      ui.page='tracks';ui.editor=null;ui.selected=null;render();break;
    case 'image':
      document.getElementById('file').click();break;
    case 'save':
      save();toast('Pista guardada');break;
    case 'remove':{
      const t=db.tracks.find(x=>String(x.id)===String(ui.editor));
      if(ui.selected==null){toast('Seleciona primeiro uma curva');break;}
      t.points.splice(ui.selected,1);
      ui.selected=t.points.length?Math.min(ui.selected,t.points.length-1):null;
      save();render();break;
    }
    case 'delete':
      if(confirm('Apagar esta pista?')){
        db.tracks=db.tracks.filter(t=>String(t.id)!==String(action.dataset.id));
        save();render();
      }
      break;
    case 'save-comment':{
      const t=db.tracks.find(x=>String(x.id)===String(ui.editor));
      const p=t?.points?.[ui.selected];
      if(!p)break;
      p.comment=document.getElementById('comment').value;
      p.braking=document.getElementById('braking').value;
      p.entry=document.getElementById('entry').value;
      p.apex=document.getElementById('apex').value;
      p.exit=document.getElementById('exit').value;
      p.trajectory=document.getElementById('trajectory').value;
      p.error=document.getElementById('error').value;
      p.correction=document.getElementById('correction').value;
      save();toast('Comentário guardado');break;
    }
  }
});

render();
</script>
</body>
</html>
