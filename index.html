<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pista Coach</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f5f6f7;font-family:Arial,Helvetica,sans-serif}button,input,textarea{font:inherit}
button{cursor:pointer}.sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background:#111419;border-right:1px solid #292e35;padding:22px 16px;z-index:10}.logo{font-weight:800;font-size:20px;margin:4px 8px 30px}.logo span{color:#87909a}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aeb5bd;text-align:left;padding:12px;border-radius:8px}.nav button.active,.nav button:hover{background:#20252c;color:#fff}
main{margin-left:220px;padding:28px;min-height:100vh}.header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.title{font-size:28px;font-weight:800}.sub{color:#8e97a1;margin-top:4px}.btn{background:#171b21;color:#fff;border:1px solid #303740;border-radius:8px;padding:10px 14px}.btn.primary{background:#fff;color:#111;border-color:#fff;font-weight:700}.btn.danger{color:#ff9999}.buttons{display:flex;gap:8px;flex-wrap:wrap}
.list{display:grid;gap:9px}.row{background:#13171c;border:1px solid #292f36;border-radius:11px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:15px}.muted{color:#8e97a1;font-size:13px}.empty{padding:40px;text-align:center;border:1px dashed #303740;border-radius:12px;color:#8e97a1}
.editor{display:grid;grid-template-columns:260px 1fr;gap:12px}.panel{display:grid;gap:10px;align-content:start}.card{background:#13171c;border:1px solid #292f36;border-radius:11px;padding:13px}.card h3{font-size:14px;margin:0 0 10px}.card .btn{width:100%;margin-bottom:7px}.card .btn:last-child{margin-bottom:0}.help{font-size:12px;color:#8e97a1;line-height:1.5}.stagebox{background:#0e1115;border:1px solid #292f36;border-radius:11px;overflow:hidden}.stagehead{padding:12px 14px;border-bottom:1px solid #292f36;display:flex;justify-content:space-between}.stage{height:calc(100vh - 165px);min-height:520px;position:relative;overflow:hidden;background:#191d22;touch-action:none}.stage svg{width:100%;height:100%;display:block;touch-action:none}.bg{pointer-events:none}.point{fill:#fff;stroke:#111;stroke-width:3;cursor:pointer}.point.selected{fill:#ffcf5a}.pointtext{font-size:12px;font-weight:800;fill:#111;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.marker{fill:none;stroke:#fff;stroke-width:2;stroke-dasharray:7 7;opacity:.7}.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px}.mode .btn.selected{background:#fff;color:#111}.field{display:grid;gap:6px;margin-bottom:9px}.field label{font-size:12px;color:#aeb5bd}.field input,.field textarea{width:100%;background:#0c0f13;color:#fff;border:1px solid #303740;border-radius:7px;padding:9px}.field textarea{min-height:80px;resize:vertical}.comments{position:absolute;right:12px;top:12px;width:290px;background:#11151acc;border:1px solid #3a424c;border-radius:10px;padding:12px;backdrop-filter:blur(5px);z-index:3}.comments h3{margin:0 0 10px}.comments .field{margin-bottom:8px}.comments.hidden{display:none}.corner-badge{font-weight:800}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.modalbg{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:20px;z-index:30}.modal{background:#14181d;border:1px solid #343b44;border-radius:13px;padding:20px;width:min(600px,100%)}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
@media(max-width:850px){.sidebar{width:65px;padding:14px 7px}.logo{font-size:0;text-align:center}.logo:after{content:"PC";font-size:18px}.nav button{font-size:0;text-align:center}main{margin-left:65px;padding:16px}.editor{grid-template-columns:1fr}.stage{height:65vh;min-height:430px}.comments{position:absolute;left:12px;right:12px;width:auto}}
</style>
</head>
<body>
<aside class="sidebar"><div class="logo">PISTA <span>COACH</span></div><div class="nav">
<button data-page="dashboard">Dashboard</button><button data-page="drivers">Pilotos</button><button data-page="tracks" class="active">Pistas</button><button data-page="sessions">Sessões</button>
</div></aside>
<main id="app"></main><div id="modal"></div>
<script>
'use strict';
const KEY='pista_coach_v6';
const oldKeys=['pista_coach_v5','pista_coach_v4','pista_coach_v4_1','pista_coach_v3','pista_coach_v2','pista_coach_v1'];
const W=1000,H=650;
let db=load(), ui={page:'tracks',editor:null,mode:'points',selected:null};
function norm(raw){
 raw=raw||{};
 const tracks=Array.isArray(raw.tracks)?raw.tracks.map((t,i)=>{
   let pts=Array.isArray(t.points)?t.points.map((p,j)=>({
     id:p.id||('p'+Date.now()+j),x:Number(p.x!=null?p.x:p[0])||0,y:Number(p.y!=null?p.y:p[1])||0,
     name:p.name||('Curva '+(j+1)),comment:p.comment||'',braking:p.braking||'',entry:p.entry||'',apex:p.apex||'',exit:p.exit||'',trajectory:p.trajectory||'',error:p.error||'',correction:p.correction||''
   })):[],
   // V5/V4 data may contain technical points; convert them into simple coaching points.
   points=pts.length?pts:[];
   return {id:t.id||Date.now()+i,name:t.name||('Pista '+(i+1)),variant:t.variant||'Karting',image:t.image||t.background||'',imageOpacity:t.imageOpacity==null?.45:Number(t.imageOpacity),points};
 }):[];
 return {tracks,drivers:Array.isArray(raw.drivers)?raw.drivers:[],sessions:Array.isArray(raw.sessions)?raw.sessions:[]};
}
function load(){
 for(const k of [KEY,...oldKeys]){try{let s=localStorage.getItem(k);if(s){let d=norm(JSON.parse(s));localStorage.setItem(KEY,JSON.stringify(d));return d}}catch(e){}}
 return norm({});
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('Não foi possível guardar. A imagem pode ser demasiado grande.');return false}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let d=document.createElement('div');d.textContent=s;d.style.cssText='position:fixed;right:18px;bottom:18px;background:#fff;color:#111;padding:11px 14px;border-radius:8px;font-weight:700;z-index:99';document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}
function header(title,sub,actions=''){return '<div class="header"><div><div class="title">'+esc(title)+'</div><div class="sub">'+esc(sub)+'</div></div><div>'+actions+'</div></div>'}
function tracksPage(){return header('Pistas','Cada pista usa uma imagem e pontos de coaching.','<button class="btn primary" data-action="new-track">+ Nova pista</button>')+'<div class="list">'+(db.tracks.map(t=>'<div class="row"><div><b>'+esc(t.name)+'</b><div class="muted">'+esc(t.variant)+' · '+t.points.length+' pontos/curvas</div></div><div class="buttons"><button class="btn" data-action="edit" data-id="'+t.id+'">Editar pista</button><button class="btn danger" data-action="delete" data-id="'+t.id+'">Apagar</button></div></div>').join('')||'<div class="empty">Ainda não tens pistas. Cria uma e carrega a imagem do layout.</div>')+'</div>'}
function dashboard(){return header('Dashboard','Visão geral','<button class="btn primary" data-action="new-track">+ Nova pista</button>')+'<div class="list"><div class="row"><div><b>Pistas</b><div class="muted">'+db.tracks.length+' configuradas</div></div></div><div class="row"><div><b>Pilotos</b><div class="muted">'+db.drivers.length+' configurados</div></div></div></div>'}
function drivers(){return header('Pilotos','Pilotos','<button class="btn primary" data-action="new-driver">+ Adicionar piloto</button>')+'<div class="list">'+(db.drivers.map(d=>'<div class="row"><b>'+esc(d.name)+'</b></div>').join('')||'<div class="empty">Ainda não tens pilotos.</div>')+'</div>'}
function sessions(){return header('Sessões','As sessões vão usar os pontos criados em cada pista.','')+'<div class="empty">Próxima etapa: ligar cada sessão e piloto às curvas desta pista.</div>'}
function svg(t){
 const bg=t.image?'<image class="bg" href="'+t.image+'" x="0" y="0" width="'+W+'" height="'+H+'" opacity="'+t.imageOpacity+'" preserveAspectRatio="none"></image>':'';
 const pts=t.points.map((p,i)=>'<g data-point="'+i+'"><circle class="point '+(ui.selected===i?'selected':'')+'" cx="'+p.x+'" cy="'+p.y+'" r="13"></circle><text class="pointtext" x="'+p.x+'" y="'+p.y+'">'+(i+1)+'</text></g>').join('');
 const line=t.points.length>1?'<polyline class="marker" points="'+t.points.map(p=>p.x+','+p.y).join(' ')+'"></polyline>':'';
 return '<svg id="map" viewBox="0 0 '+W+' '+H+'">'+bg+line+pts+'</svg>';
}
function editor(){
 const t=db.tracks.find(x=>String(x.id)===String(ui.editor)); if(!t){ui.page='tracks';return tracksPage()}
 const p=ui.selected!=null?t.points[ui.selected]:null;
 const comment=p?'<div class="comments"><h3>Curva <span class="corner-badge">'+(ui.selected+1)+'</span></h3><div class="field"><label>Comentário geral</label><textarea id="c-comment">'+esc(p.comment)+'</textarea></div><div class="field"><label>Travagem</label><textarea id="c-braking">'+esc(p.braking)+'</textarea></div><div class="field"><label>Entrada</label><textarea id="c-entry">'+esc(p.entry)+'</textarea></div><div class="field"><label>Apex</label><textarea id="c-apex">'+esc(p.apex)+'</textarea></div><div class="field"><label>Saída</label><textarea id="c-exit">'+esc(p.exit)+'</textarea></div><div class="field"><label>Trajetória / erro / correção</label><textarea id="c-extra">'+esc((p.trajectory?'Trajetória: '+p.trajectory+'\\n':'')+(p.error?'Erro: '+p.error+'\\n':'')+(p.correction?'Correção: '+p.correction:''))+'</textarea></div><button class="btn primary" data-action="save-comment">Guardar comentário</button></div>':'';
 return '<div style="margin-bottom:12px"><button class="btn" data-action="back">← Pistas</button></div>'+
 header('Editar · '+t.name,'Coloca um ponto em cada curva que queres analisar. A aplicação conta-os automaticamente.','<div class="buttons"><button class="btn primary" data-action="save">Guardar pista</button></div>')+
 '<div class="editor"><div class="panel">'+
 '<div class="card"><h3>Imagem da pista</h3><button class="btn" data-action="image">Carregar imagem</button><input id="file" type="file" accept="image/*" hidden><label class="help">A imagem é apenas o fundo. Não precisas de desenhar a pista.</label><label class="help">Opacidade <input id="opacity" type="range" min=".1" max="1" step=".05" value="'+t.imageOpacity+'"></label></div>'+
 '<div class="card"><h3>Pontos de coaching</h3><div class="mode"><button class="btn '+(ui.mode==='points'?'selected':'')+'" data-mode="points">Adicionar</button><button class="btn '+(ui.mode==='select'?'selected':'')+'" data-mode="select">Selecionar</button></div><button class="btn danger" data-action="remove">Apagar ponto selecionado</button><div class="help">Modo Adicionar: clica na imagem para criar Curva 1, Curva 2, etc. O número de pontos é automático.</div></div>'+
 '<div class="card"><h3>Estado</h3><div><b>'+t.points.length+'</b> curvas configuradas</div><div class="help" style="margin-top:7px">Seleciona uma curva para abrir os comentários dessa curva.</div></div>'+
 '</div><div class="stagebox"><div class="stagehead"><div><b>'+esc(t.name)+'</b><div class="muted">'+(ui.mode==='points'?'Clica onde queres criar uma curva.':'Clica numa curva para editar.')+'</div></div><span class="muted">'+t.points.length+' curvas</span></div><div class="stage">'+svg(t)+comment+'</div></div></div>';
}
function render(){let a=document.getElementById('app');a.innerHTML=ui.page==='editor'?editor():ui.page==='dashboard'?dashboard():ui.page==='drivers'?drivers():ui.page==='sessions'?sessions():tracksPage();document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===ui.page));if(ui.page==='editor')bind()}
function modal(s){document.getElementById('modal').innerHTML='<div class="modalbg"><div class="modal">'+s+'</div></div>'}
function closeModal(){document.getElementById('modal').innerHTML=''}
function newTrack(){modal('<h2>Nova pista</h2><div class="field"><label>Nome da pista</label><input id="tn" placeholder="Ex.: Portimão"></div><div class="field"><label>Variante</label><input id="tv" value="Karting"></div><div class="modalactions"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="create">Criar</button></div>')}
function create(){let n=document.getElementById('tn').value.trim();if(!n)return;let t={id:Date.now(),name:n,variant:document.getElementById('tv').value.trim()||'Karting',image:'',imageOpacity:.45,points:[]};db.tracks.push(t);save();closeModal();ui.page='editor';ui.editor=t.id;ui.selected=null;ui.mode='points';render()}
function newDriver(){modal('<h2>Novo piloto</h2><div class="field"><label>Nome</label><input id="dn"></div><div class="modalactions"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="create-driver">Criar</button></div>')}
function createDriver(){let n=document.getElementById('dn').value.trim();if(!n)return;db.drivers.push({id:Date.now(),name:n});save();closeModal();render()}
function bind(){
 const t=db.tracks.find(x=>String(x.id)===String(ui.editor)),svgEl=document.getElementById('map');if(!svgEl)return;
 const file=document.getElementById('file');file.onchange=()=>{let f=file.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{t.image=r.result;save();render();toast('Imagem carregada')};r.readAsDataURL(f)};
 document.getElementById('opacity').oninput=e=>{t.imageOpacity=Number(e.target.value);save();let im=svgEl.querySelector('.bg');if(im)im.setAttribute('opacity',t.imageOpacity)};
 svgEl.addEventListener('click',e=>{
   let g=e.target.closest('[data-point]');
   if(ui.mode==='points' && !g && e.target===svgEl){let r=svgEl.getBoundingClientRect();let x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;t.points.push({id:'p'+Date.now(),x,y,name:'Curva '+(t.points.length+1),comment:'',braking:'',entry:'',apex:'',exit:'',trajectory:'',error:'',correction:''});ui.selected=t.points.length-1;save();render();return}
   if(g){ui.selected=Number(g.dataset.point);ui.mode='select';render()}
 });
}
document.addEventListener('click',e=>{
 let pg=e.target.closest('[data-page]');if(pg){ui.page=pg.dataset.page;ui.editor=null;render();return}
 let m=e.target.closest('[data-mode]');if(m){ui.mode=m.dataset.mode;render();return}
 let a=e.target.closest('[data-action]');if(!a)return;let x=a.dataset.action;
 if(x==='new-track'){newTrack();return}if(x==='create'){create();return}if(x==='new-driver'){newDriver();return}if(x==='create-driver'){createDriver();return}if(x==='close'){closeModal();return}
 if(x==='edit'){ui.page='editor';ui.editor=a.dataset.id;ui.selected=null;ui.mode='points';render();return}
 if(x==='back'){ui.page='tracks';ui.editor=null;render();return}
 if(x==='image'){document.getElementById('file').click();return}
 if(x==='save'){save();toast('Pista guardada');return}
 if(x==='remove'){let t=db.tracks.find(x=>String(x.id)===String(ui.editor));if(ui.selected==null){toast('Seleciona primeiro uma curva');return}t.points.splice(ui.selected,1);ui.selected=t.points.length?Math.min(ui.selected,t.points.length-1):null;save();render();return}
 if(x==='delete'){if(confirm('Apagar esta pista?')){db.tracks=db.tracks.filter(t=>String(t.id)!==String(a.dataset.id));save();render()}return}
 if(x==='save-comment'){let t=db.tracks.find(x=>String(x.id)===String(ui.editor)),p=t.points[ui.selected];if(!p)return;p.comment=document.getElementById('c-comment').value;p.braking=document.getElementById('c-braking').value;p.entry=document.getElementById('c-entry').value;p.apex=document.getElementById('c-apex').value;p.exit=document.getElementById('c-exit').value;let ex=document.getElementById('c-extra').value.split('\\n');p.trajectory=(ex.find(s=>s.startsWith('Trajetória:'))||'').replace('Trajetória: ','');p.error=(ex.find(s=>s.startsWith('Erro:'))||'').replace('Erro: ','');p.correction=(ex.find(s=>s.startsWith('Correção:'))||'').replace('Correção: ','');save();toast('Comentário guardado');return}
});
render();
</script>
</body>
</html>
