<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pista Coach</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b0e;color:#f4f5f7;font-family:Arial,Helvetica,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
.sidebar{position:fixed;inset:0 auto 0 0;width:230px;background:#0f1216;border-right:1px solid #292f36;padding:20px;z-index:5}.logo{font-weight:800;font-size:20px;margin:5px 8px 30px}.logo span{color:#7f8994}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aeb5bd;text-align:left;padding:12px;border-radius:8px}.nav button.active,.nav button:hover{background:#1c2229;color:#fff}
.content{margin-left:230px;padding:28px;min-height:100vh}.header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.title{font-size:28px;font-weight:800}.subtitle,.muted{color:#929ba5}.buttons{display:flex;gap:8px;flex-wrap:wrap}.btn{background:#171c22;color:#fff;border:1px solid #303740;border-radius:8px;padding:10px 14px}.btn.primary{background:#fff;color:#090b0e;border-color:#fff;font-weight:700}.btn.danger{color:#ff9696}.list{display:grid;gap:9px}.row{background:#12171c;border:1px solid #293038;border-radius:11px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:15px}.empty{border:1px dashed #303740;border-radius:11px;padding:35px;text-align:center;color:#929ba5}
.modal-bg{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal{width:min(650px,100%);background:#12171c;border:1px solid #303740;border-radius:14px;padding:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#aeb5bd}.field input{background:#0b0e12;color:#fff;border:1px solid #303740;border-radius:7px;padding:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.editor-shell{display:grid;grid-template-columns:245px 1fr;gap:12px}.tools{display:grid;gap:10px;align-content:start}.tool{background:#12171c;border:1px solid #293038;border-radius:12px;padding:12px}.tool h3{font-size:14px;margin:0 0 9px}.tool .btn{width:100%;margin-bottom:7px}.tool .btn:last-child{margin-bottom:0}.tool input[type=range]{width:100%}.info{font-size:12px;color:#929ba5;line-height:1.5}.stage-wrap{background:#0b0e12;border:1px solid #293038;border-radius:12px;overflow:hidden}.stage-head{padding:12px 14px;border-bottom:1px solid #293038;display:flex;justify-content:space-between}.stage{height:calc(100vh - 170px);min-height:500px;position:relative;overflow:hidden;touch-action:none;background:#151a20}.stage svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.map-image{pointer-events:none}.track-line{fill:none;stroke:#f2f4f5;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 8}.point{fill:#fff;stroke:#090b0e;stroke-width:2;cursor:grab}.point.selected{fill:#ffd166}.handle{stroke:#ffd166;stroke-width:2;stroke-dasharray:5 5}.handle-dot{fill:#ffd166;stroke:#111;stroke-width:2;cursor:grab}.label{font-size:12px;font-weight:800;text-anchor:middle;dominant-baseline:middle;pointer-events:none;fill:#111}.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px}.mode .btn.selected{background:#fff;color:#111}.toast{position:fixed;right:18px;bottom:18px;background:#fff;color:#111;padding:12px 15px;border-radius:8px;font-weight:700;z-index:50}
@media(max-width:850px){.sidebar{width:68px;padding:15px 8px}.logo{font-size:0;text-align:center}.logo:after{content:"PC";font-size:18px}.nav button{font-size:0;text-align:center}.content{margin-left:68px;padding:16px}.editor-shell{grid-template-columns:1fr}.stage{height:65vh;min-height:430px}.tools{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<aside class="sidebar"><div class="logo">PISTA <span>COACH</span></div><div class="nav">
<button data-page="dashboard">Dashboard</button><button data-page="drivers">Pilotos</button><button data-page="tracks" class="active">Pistas</button><button data-page="sessions">Sessões</button>
</div></aside>
<main class="content" id="app"></main><div id="modal"></div>

<script>
'use strict';
const KEY='pista_coach_v5';
const OLD=['pista_coach_v4','pista_coach_v4_1','pista_coach_v3','pista_coach_v2','pista_coach_v1'];
const VW=1000,VH=650;
const defaultPoints=[[100,130],[220,90],[390,105],[560,135],[730,190],[820,310],[750,440],[590,510],[420,470],[260,520],[110,420],[120,300],[210,250],[330,275],[430,225],[600,250]];
const blank={drivers:[],tracks:[],sessions:[]};
let db=readData();
let ui={page:'tracks',editor:null,point:0,mode:'move',drag:null,history:[]};

function normalize(raw){
 raw=raw||blank;
 let tracks=Array.isArray(raw.tracks)?raw.tracks:[];
 tracks=tracks.map((t,i)=>({
  id:t.id||Date.now()+i,name:t.name||('Pista '+(i+1)),variant:t.variant||'Karting',
  corners:Number(t.corners)||((t.points||[]).length)||16,
  points:Array.isArray(t.points)&&t.points.length>=4?t.points.map(p=>[Number(p[0])||0,Number(p[1])||0]):defaultPoints.map(p=>p.slice()),
  image:t.image||t.background||'',imageX:Number(t.imageX)||0,imageY:Number(t.imageY)||0,imageScale:Number(t.imageScale)||1,imageOpacity:t.imageOpacity==null?.28:Number(t.imageOpacity),showLine:t.showLine!==false
 }));
 return {drivers:Array.isArray(raw.drivers)?raw.drivers:[],tracks,sessions:Array.isArray(raw.sessions)?raw.sessions:[]};
}
function readData(){
 try{let x=localStorage.getItem(KEY);if(x)return normalize(JSON.parse(x));}catch(e){}
 for(const k of OLD){try{let x=localStorage.getItem(k);if(x){let d=normalize(JSON.parse(x));localStorage.setItem(KEY,JSON.stringify(d));return d}}catch(e){}}
 return normalize(blank);
}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getTrack(){return db.tracks.find(t=>String(t.id)===String(ui.editor))}
function toast(s){let x=document.createElement('div');x.className='toast';x.textContent=s;document.body.appendChild(x);setTimeout(()=>x.remove(),1500)}
function header(a,b,c){return '<div class="header"><div><div class="title">'+esc(a)+'</div><div class="subtitle">'+esc(b)+'</div></div><div>'+c+'</div></div>'}

function tracksPage(){
 return header('Pistas','Cria e edita os teus próprios layouts','<button class="btn primary" data-action="new-track">+ Nova pista</button>')+
 '<div class="list">'+(db.tracks.map(t=>'<div class="row"><div><b>'+esc(t.name)+'</b><div class="muted">'+esc(t.variant)+' · '+t.points.length+' pontos'+(t.image?' · imagem':'')+'</div></div><div class="buttons"><button class="btn" data-action="edit" data-id="'+t.id+'">Editar layout</button><button class="btn" data-action="preview" data-id="'+t.id+'">Ver</button><button class="btn danger" data-action="delete" data-id="'+t.id+'">Apagar</button></div></div>').join('')||'<div class="empty">Cria a primeira pista para começar.</div>')+'</div>';
}
function dashboard(){return header('Dashboard','Pista Coach','<button class="btn primary" data-action="new-track">+ Nova pista</button>')+'<div class="empty">Editor de pistas ativo.</div>'}
function drivers(){return header('Pilotos','Pilotos','<button class="btn primary" data-action="new-driver">+ Adicionar</button>')+'<div class="empty">Área de pilotos disponível.</div>'}
function sessions(){return header('Sessões','Sessões de coaching','')+'<div class="empty">A análise de sessões será ligada aos layouts na próxima etapa.</div>'}

function stageSvg(t){
 const p=t.points, d=p.map((q,i)=>(i?'L':'M')+q[0]+' '+q[1]).join(' ');
 const img=t.image?'<image class="map-image" href="'+t.image+'" x="'+t.imageX+'" y="'+t.imageY+'" width="'+VW+'" height="'+VH+'" opacity="'+t.imageOpacity+'" transform="translate('+(VW/2)+' '+(VH/2)+') scale('+t.imageScale+') translate('+(-VW/2)+' '+(-VH/2)+')" preserveAspectRatio="none"></image>':'';
 const line=t.showLine?'<path class="track-line" d="'+d+'"></path>':'';
 let marks=p.map((q,i)=>'<g data-point="'+i+'"><circle class="point'+(ui.point===i?' selected':'')+'" cx="'+q[0]+'" cy="'+q[1]+'" r="9"></circle><text class="label" x="'+q[0]+'" y="'+q[1]+'">'+(i+1)+'</text></g>').join('');
 let handles='';
 if(ui.mode==='edit' && p[ui.point]){
   const q=p[ui.point], prev=p[(ui.point-1+p.length)%p.length], next=p[(ui.point+1)%p.length];
   const hx1=q[0]+(prev[0]-q[0])*.32,hy1=q[1]+(prev[1]-q[1])*.32;
   const hx2=q[0]+(next[0]-q[0])*.32,hy2=q[1]+(next[1]-q[1])*.32;
   handles='<line class="handle" x1="'+q[0]+'" y1="'+q[1]+'" x2="'+hx1+'" y2="'+hy1+'"></line><circle class="handle-dot" data-handle="-1" cx="'+hx1+'" cy="'+hy1+'" r="7"></circle><line class="handle" x1="'+q[0]+'" y1="'+q[1]+'" x2="'+hx2+'" y2="'+hy2+'"></line><circle class="handle-dot" data-handle="1" cx="'+hx2+'" cy="'+hy2+'" r="7"></circle>';
 }
 return '<svg id="stage-svg" viewBox="0 0 '+VW+' '+VH+'">'+img+line+handles+marks+'</svg>';
}
function editor(){
 const t=getTrack(),p=t.points,q=p[ui.point]||p[0];
 return '<div style="margin-bottom:12px"><button class="btn" data-action="back">← Pistas</button></div>'+
 header('Editor · '+t.name,'Primeiro posiciona a imagem. Depois adiciona os pontos e ajusta as curvas.','<div class="buttons"><button class="btn primary" data-action="save">Guardar</button></div>')+
 '<div class="editor-shell"><div class="tools">'+
 '<div class="tool"><h3>1 · Imagem</h3><button class="btn" data-action="image">Carregar imagem</button><input id="image-file" type="file" accept="image/*" hidden><div class="mode"><button class="btn '+(ui.mode==='move'?'selected':'')+'" data-mode="move">Mover</button><button class="btn '+(ui.mode==='zoom'?'selected':'')+'" data-mode="zoom">Zoom</button></div><label class="info">Opacidade <input id="opacity" type="range" min=".05" max="1" step=".05" value="'+t.imageOpacity+'"></label><div class="info" style="margin-top:6px">Arrasta a imagem no modo Mover. Usa a roda do rato no modo Zoom.</div></div>'+
 '<div class="tool"><h3>2 · Traçado</h3><div class="mode"><button class="btn '+(ui.mode==='add'?'selected':'')+'" data-mode="add">Adicionar pontos</button><button class="btn '+(ui.mode==='edit'?'selected':'')+'" data-mode="edit">Editar curvas</button></div><button class="btn" data-action="add-between">Adicionar no ponto</button><button class="btn danger" data-action="remove-point">Apagar ponto selecionado</button></div>'+
 '<div class="tool"><h3>3 · Ponto '+(ui.point+1)+'</h3><div class="info">X: '+Math.round(q[0])+'<br>Y: '+Math.round(q[1])+'<br>Pontos: '+p.length+'</div><button class="btn" data-action="start">Definir como meta</button></div>'+
 '<div class="tool"><h3>Controlo</h3><button class="btn" data-action="undo">Desfazer</button><button class="btn" data-action="reset-image">Reposicionar imagem</button></div>'+
 '</div><div class="stage-wrap"><div class="stage-head"><div><b>'+esc(t.name)+'</b><div class="muted">'+esc(ui.mode==='move'?'Move a imagem':'Clica e arrasta pontos')+'</div></div><span class="muted">'+p.length+' pontos</span></div><div class="stage" id="stage">'+stageSvg(t)+'</div></div></div>';
}
function render(){
 const app=document.getElementById('app');
 app.innerHTML=ui.page==='editor'?editor():ui.page==='dashboard'?dashboard():ui.page==='drivers'?drivers():ui.page==='sessions'?sessions():tracksPage();
 document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===ui.page));
 if(ui.page==='editor')bindStage();
}
function modal(s){document.getElementById('modal').innerHTML='<div class="modal-bg" data-close><div class="modal">'+s+'</div></div>'}
function closeModal(){document.getElementById('modal').innerHTML=''}

function newTrack(){modal('<h2>Nova pista</h2><div class="fields"><div class="field"><label>Nome</label><input id="tn"></div><div class="field"><label>Variante</label><input id="tv" value="Karting"></div></div><div class="modal-actions"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="create-track">Criar</button></div>')}
function createTrack(){let n=document.getElementById('tn').value.trim();if(!n)return;let t={id:Date.now(),name:n,variant:document.getElementById('tv').value.trim()||'Karting',corners:16,points:defaultPoints.map(p=>p.slice()),image:'',imageX:0,imageY:0,imageScale:1,imageOpacity:.28,showLine:true};db.tracks.push(t);save();closeModal();ui.editor=t.id;ui.page='editor';ui.point=0;ui.mode='move';render()}
function newDriver(){modal('<h2>Novo piloto</h2><div class="field"><label>Nome</label><input id="dn"></div><div class="modal-actions"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="create-driver">Criar</button></div>')}
function createDriver(){let n=document.getElementById('dn').value.trim();if(!n)return;db.drivers.push({id:Date.now(),name:n});save();closeModal();render()}

function svgPoint(e,svg){let r=svg.getBoundingClientRect();return [(e.clientX-r.left)/r.width*VW,(e.clientY-r.top)/r.height*VH]}
function pushHistory(){const t=getTrack();ui.history.push(JSON.stringify(t));if(ui.history.length>20)ui.history.shift()}
function bindStage(){
 const t=getTrack(),stage=document.getElementById('stage'),svg=document.getElementById('stage-svg');
 if(!stage||!svg)return;
 const file=document.getElementById('image-file');file.onchange=()=>{let f=file.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{pushHistory();t.image=rd.result;t.imageX=0;t.imageY=0;t.imageScale=1;save();render()};rd.readAsDataURL(f)};
 document.getElementById('opacity').oninput=e=>{t.imageOpacity=Number(e.target.value);save();let im=svg.querySelector('.map-image');if(im)im.setAttribute('opacity',t.imageOpacity)};
 svg.addEventListener('wheel',e=>{if(ui.mode!=='zoom'||!t.image)return;e.preventDefault();pushHistory();t.imageScale=Math.max(.25,Math.min(3,t.imageScale*(e.deltaY<0?1.06:.94)));save();render()}, {passive:false});
 svg.addEventListener('pointerdown',e=>{
   const g=e.target.closest('[data-point]'), h=e.target.closest('[data-handle]');
   if(ui.mode==='add' && e.target===svg){pushHistory();let q=svgPoint(e,svg);t.points.push(q);ui.point=t.points.length-1;save();render();return}
   if(ui.mode==='move' && t.image && (e.target===svg || e.target.classList.contains('map-image'))){ui.drag={kind:'image',x:e.clientX,y:e.clientY,ix:t.imageX,iy:t.imageY};return}
   if(ui.mode==='zoom')return;
   if(h){ui.drag={kind:'handle',dir:Number(h.dataset.handle),x:e.clientX,y:e.clientY};return}
   if(g){ui.point=Number(g.dataset.point);if(ui.mode==='edit'){render();}else {render();}const ng=document.getElementById('stage-svg');ng&&ng.setPointerCapture&&ng.setPointerCapture(e.pointerId)}
 });
 svg.addEventListener('pointermove',e=>{
   if(!ui.drag)return;
   if(ui.drag.kind==='image'){t.imageX=ui.drag.ix+(e.clientX-ui.drag.x)/svg.getBoundingClientRect().width*VW;t.imageY=ui.drag.iy+(e.clientY-ui.drag.y)/svg.getBoundingClientRect().height*VH;renderStage();return}
   if(ui.drag.kind==='point'){let q=svgPoint(e,svg);t.points[ui.point]=q;renderStage();return}
 });
 svg.addEventListener('pointerup',()=>{if(ui.drag){save();ui.drag=null;render()}});
 svg.addEventListener('pointercancel',()=>{ui.drag=null});
 // bind point dragging separately after render
 svg.querySelectorAll('[data-point]').forEach(g=>g.addEventListener('pointerdown',e=>{
   if(ui.mode==='edit'){ui.point=Number(g.dataset.point);ui.drag={kind:'point',x:e.clientX,y:e.clientY};g.setPointerCapture&&g.setPointerCapture(e.pointerId);e.stopPropagation()}
 }));
}
function renderStage(){let s=document.getElementById('stage');if(s)s.innerHTML=stageSvg(getTrack())}
function addBetween(){let t=getTrack(),i=ui.point,a=t.points[i],b=t.points[(i+1)%t.points.length];pushHistory();t.points.splice(i+1,0,[(a[0]+b[0])/2,(a[1]+b[1])/2]);ui.point=i+1;save();render()}
function removePoint(){let t=getTrack();if(t.points.length<=4){toast('Mínimo de 4 pontos');return}pushHistory();t.points.splice(ui.point,1);ui.point=Math.max(0,Math.min(ui.point,t.points.length-1));save();render()}
function undo(){if(!ui.history.length){toast('Nada para desfazer');return}let t=ui.history.pop();let old=JSON.parse(t),idx=db.tracks.findIndex(x=>String(x.id)===String(ui.editor));db.tracks[idx]=old;save();render()}
function resetImage(){let t=getTrack();if(!t.image)return;pushHistory();t.imageX=0;t.imageY=0;t.imageScale=1;save();render()}
function preview(id){let t=db.tracks.find(x=>String(x.id)===String(id));modal('<h2>'+esc(t.name)+'</h2><div class="stage" style="height:500px">'+stageSvg(t)+'</div><div class="modal-actions"><button class="btn" data-action="close">Fechar</button></div>')}

document.addEventListener('click',e=>{
 const p=e.target.closest('[data-page]');if(p){ui.page=p.dataset.page;ui.editor=null;render();return}
 const mode=e.target.closest('[data-mode]');if(mode){ui.mode=mode.dataset.mode;render();return}
 const a=e.target.closest('[data-action]');if(!a)return;let x=a.dataset.action;
 if(x==='close'){closeModal();return} if(x==='new-track'){newTrack();return} if(x==='create-track'){createTrack();return}
 if(x==='new-driver'){newDriver();return} if(x==='create-driver'){createDriver();return}
 if(x==='edit'){ui.editor=Number(a.dataset.id);ui.point=0;ui.mode='move';ui.history=[];render();return}
 if(x==='preview'){preview(Number(a.dataset.id));return}
 if(x==='delete'){if(confirm('Apagar esta pista?')){db.tracks=db.tracks.filter(t=>String(t.id)!==String(a.dataset.id));save();render()}return}
 if(x==='back'){ui.page='tracks';ui.editor=null;render();return}
 if(x==='save'){save();toast('Pista guardada');return}
 if(x==='image'){document.getElementById('image-file').click();return}
 if(x==='add-between'){addBetween();return}
 if(x==='remove-point'){removePoint();return}
 if(x==='undo'){undo();return}
 if(x==='reset-image'){resetImage();return}
 if(x==='start'){let t=getTrack();t.startPoint=ui.point;save();toast('Meta definida');return}
});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.dataset.close)closeModal()});
render();
</script>
</body>
</html>
