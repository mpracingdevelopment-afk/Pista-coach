let currentUser=null;

const PILOT_CATEGORIES=['Cadete','Mini','Junior','Sénior','DD2','Shifter'];
function validPilotCategory(v){return PILOT_CATEGORIES.includes(String(v||''));}
function categoryName(v){return validPilotCategory(v)?String(v):'Sem categoria';}
function groupedDriversByCategory(drivers){
  const groups={};
  PILOT_CATEGORIES.forEach(c=>groups[c]=[]);
  groups['Sem categoria']=[];
  (drivers||[]).forEach(d=>{
    const u=(profileCache||[]).find(x=>String(x.id)===String(d.userId));
    const p=u?.profile||d;
    groups[categoryName(p.category||d.category)].push(d);
  });
  return groups;
}
function groupedDriverSections(drivers){
  const groups=groupedDriversByCategory(drivers);
  return Object.entries(groups).filter(([,items])=>items.length).map(([cat,items])=>
    `<div class="sectiontitle category-title">${esc(cat)} <span class="muted" style="font-size:11px;font-weight:600">${items.length}</span></div><div class="list">${items.map(driverCard).join('')}</div>`
  ).join('');
}
let cloudReady=false;
let cloudStateExists=false;

function normalizeProfile(row){
  if(!row)return null;
  const p=row.profile||{};
  return {id:row.id,name:row.name||p.name||row.email?.split('@')[0]||'Utilizador',email:(row.email||'').toLowerCase(),role:row.role||'pilot',pilotId:row.pilot_id||null,profile:p};
}
function users(){return profileCache.slice()}
function isAdmin(){return currentUser?.role==='admin'}
function freshCurrentUser(){return currentUser}
function currentPilotId(){return freshCurrentUser()?.pilotId||null}
function calculateAge(dateStr){ if(!dateStr) return ''; const d=new Date(dateStr+'T00:00:00'); if(Number.isNaN(d.getTime())) return ''; const now=new Date(); let age=now.getFullYear()-d.getFullYear(); const m=now.getMonth()-d.getMonth(); if(m<0 || (m===0 && now.getDate()<d.getDate())) age--; return age>=0?age:''; }
function profileComplete(u){return !!(u&&u.role==='pilot'&&u.profile&&u.profile.name&&u.profile.birthDate&&u.profile.kartingStartYear!==''&&validPilotCategory(u.profile.category))}

function requestedChampionshipIds(u){return Array.isArray(u?.profile?.requestedChampionships)?u.profile.requestedChampionships.map(String):[]}
function approvedChampionshipIds(u){return Array.isArray(u?.profile?.championshipAccess)?u.profile.championshipAccess.map(String):[]}
function hasChampionshipAccess(champId,u=currentUser){return approvedChampionshipIds(u).includes(String(champId))}
function championshipRequestsForAdmin(){
  const out=[];
  (profileCache||[]).filter(u=>u.role==='pilot').forEach(u=>requestedChampionshipIds(u).forEach(cid=>{
    if(!hasChampionshipAccess(cid,u)) out.push({user:u,championship:db.championships.find(c=>String(c.id)===String(cid)),championshipId:String(cid)});
  }));
  return out.filter(x=>x.championship);
}
async function syncAccessRequestsFromAuth(){
  if(!currentUser||currentUser.role!=='pilot')return;
  const own=currentUser.profile||{};
  const meta=sb.auth?.getUser?null:null;
  // The auth metadata is copied into the profile once, preserving any later admin decisions.
  try{
    const {data}=await sb.auth.getUser();
    const ids=Array.isArray(data?.user?.user_metadata?.requestedChampionships)?data.user.user_metadata.requestedChampionships.map(String):[];
    const metaBirth=data?.user?.user_metadata?.birthDate||'';
    if(metaBirth && !currentUser.profile?.birthDate){ const profile={...(currentUser.profile||{}),birthDate:metaBirth,age:calculateAge(metaBirth)}; await sb.from('profiles').update({profile,updated_at:new Date().toISOString()}).eq('id',currentUser.id); currentUser.profile=profile; }
    if(!ids.length)return;
    const current=requestedChampionshipIds(currentUser);
    const merged=[...new Set([...current,...ids])];
    if(JSON.stringify(merged.sort())!==JSON.stringify(current.sort())){
      const profile={...own,requestedChampionships:merged};
      const {error}=await sb.from('profiles').update({profile,updated_at:new Date().toISOString()}).eq('id',currentUser.id);
      if(!error){currentUser.profile=profile;await loadProfiles();}
    }
  }catch(e){console.warn('access request sync failed',e)}
}
async function requestChampionshipAccess(champId){
  if(!currentUser||currentUser.role!=='pilot')return;
  const ids=[...new Set([...requestedChampionshipIds(currentUser),String(champId)])];
  const profile={...(currentUser.profile||{}),requestedChampionships:ids};
  const {error}=await sb.from('profiles').update({profile,updated_at:new Date().toISOString()}).eq('id',currentUser.id);
  if(error){console.error(error);toast('Não foi possível enviar o pedido.');return;}
  currentUser.profile=profile;await loadProfiles();render();toast('Pedido de acesso enviado ao administrador.');
}
async function decideChampionshipAccess(userId,champId,approve){
  if(!isAdmin())return;
  const u=(profileCache||[]).find(x=>String(x.id)===String(userId));
  if(!u)return;
  const requested=requestedChampionshipIds(u).filter(id=>String(id)!==String(champId));
  const access=new Set(approvedChampionshipIds(u));
  if(approve)access.add(String(champId));else access.delete(String(champId));
  const profile={...(u.profile||{}),requestedChampionships:requested,championshipAccess:[...access]};
  const {error}=await sb.from('profiles').update({profile,updated_at:new Date().toISOString()}).eq('id',u.id);
  if(error){console.error(error);toast('Não foi possível atualizar o acesso.');return;}
  await loadProfiles();render();toast(approve?'Acesso concedido.':'Pedido recusado.');
}

const TRACK_BACKUP_KEY='mpracingdevelopment_track_assets_v1';
function backupTrackAssets(){
  try{
    const assets=(db.tracks||[]).filter(t=>t.image).map(t=>({id:t.id,name:t.name,image:t.image,points:t.points||[],pointSpace:t.pointSpace||'image'}));
    if(assets.length) localStorage.setItem(TRACK_BACKUP_KEY,JSON.stringify({updated_at:new Date().toISOString(),assets}));
  }catch(e){console.warn('track backup failed',e)}
}
function recoverTrackAssets(){
  try{
    const sources=[];
    const current=localStorage.getItem(TRACK_BACKUP_KEY); if(current) sources.push(JSON.parse(current));
    const currentDb=localStorage.getItem(KEY); if(currentDb) sources.push({assets:normalize(JSON.parse(currentDb)).tracks||[]});
    for(const key of ['mpracingdevelopment_v25','pista_coach_v24','pista_coach_v23','pista_coach_v22','pista_coach_v21','pista_coach_v20']){
      const raw=localStorage.getItem(key); if(raw){try{sources.push({assets:normalize(JSON.parse(raw)).tracks||[]})}catch(e){}}
    }
    const byName=new Map();
    for(const src of sources){for(const t of (src.assets||[])){if(t?.name) byName.set(String(t.name).trim().toLowerCase(),t)}}
    let changed=false;
    for(const t of (db.tracks||[])){
      const old=byName.get(String(t.name||'').trim().toLowerCase());
      if(!old) continue;
      if(!t.image && old.image){t.image=old.image;t.imageId=t.imageId||old.imageId||('img_'+t.id);changed=true;}
      if((!t.points||!t.points.length) && old.points?.length){t.points=old.points;t.pointSpace='image';changed=true;}
      if(t.image && t.points?.length && t.pointSpace!=='image'){t.pointSpace='image';changed=true;}
    }
    return changed;
  }catch(e){console.warn('track recovery failed',e);return false}
}
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader(); reader.onerror=()=>reject(new Error('Falha a ler a imagem'));
    reader.onload=()=>{
      const img=new Image(); img.onerror=()=>reject(new Error('Imagem inválida'));
      img.onload=()=>{
        const max=1600, scale=Math.min(1,max/Math.max(img.width,img.height));
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(img.width*scale)); canvas.height=Math.max(1,Math.round(img.height*scale));
        const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.72));
      }; img.src=reader.result;
    }; reader.readAsDataURL(file);
  });
}

async function loadCloudState(){
  const {data,error}=await sb.from('app_state').select('data').eq('id','main').maybeSingle();
  if(error){console.error(error);toast('Erro a carregar os dados online. Verifica a configuração do Supabase.');return false;}
  cloudStateExists=!!data;
  db=normalize(data?.data||{});

}
async function loadProfiles(){
  if(!currentUser)return false;
  // First load the authenticated user's own profile so the real role is known.
  const own=await sb.from('profiles').select('*').eq('id',currentUser.id).maybeSingle();
  if(own.error){console.error(own.error);toast('Erro a carregar a conta.');return false;}
  const ownProfile=normalizeProfile(own.data);
  if(ownProfile){
    currentUser=ownProfile;
    profileCache=[ownProfile];
  }
  // Once the real role is known, an admin can load all pilot accounts.
  if(currentUser?.role==='admin'){
    const all=await sb.from('profiles').select('*').order('created_at',{ascending:true});
    if(all.error){console.error(all.error);toast('Erro a carregar as contas de piloto.');return false;}
    profileCache=(Array.isArray(all.data)?all.data:[]).map(normalizeProfile).filter(Boolean);
    currentUser=profileCache.find(x=>String(x.id)===String(currentUser.id))||currentUser;
  }
  return true;
}
async function save(){
  if(!isAdmin())return false;
  try{
    backupTrackAssets();
    const payload=JSON.parse(JSON.stringify(db));
    const {error}=await sb.from('app_state').upsert({id:'main',data:payload,updated_at:new Date().toISOString()});
    if(error){console.error(error);toast('Não foi possível guardar os dados online.');return false;}
    cloudStateExists=true;
    return true;
  }catch(e){console.error(e);toast('Não foi possível guardar os dados online.');return false;}
}

  const savedContext={championship:ui.championship,race:ui.race,day:ui.day,session:ui.session,sessionPilot:ui.sessionPilot,sessionPoint:ui.sessionPoint,editor:ui.editor};

function subscribeAuth(){
  sb.auth.onAuthStateChange(async (event,session)=>{
    if(event==='SIGNED_OUT'){cleanAuthUrl();currentUser=null;profileCache=[];db=normalize({});ui.page='login';render();return;}
    if(session?.user && ['INITIAL_SESSION','SIGNED_IN','TOKEN_REFRESHED','USER_UPDATED'].includes(event)){
      cleanAuthUrl();
      currentUser={id:session.user.id,email:session.user.email||'',role:'pilot',name:session.user.user_metadata?.name||session.user.email||'Piloto',pilotId:null,profile:null};
      await loadProfiles();
      await syncAccessRequestsFromAuth();
      await loadCloudState();
      await importLegacyIfNeeded();
      await autoLinkPilot();
      const saved=loadUiState()||{};
      if(profileComplete(currentUser) || isAdmin()){
        if(saved.page && !['login','register'].includes(saved.page)) ui=Object.assign(ui,saved);
        else ui.page=isAdmin()?'dashboard':'my-events';
      }else ui.page='profile';
      render();
    }
  });
}

function normalize(raw){
  raw=raw||{};
  const tracks=Array.isArray(raw.tracks)?raw.tracks.map((t,i)=>{
    const source=Array.isArray(t.points)?t.points:[];
    const points=source.map((p,j)=>({id:p.id||('p'+Date.now()+j),x:Number(p.x!=null?p.x:p[0])||0,y:Number(p.y!=null?p.y:p[1])||0,comment:p.comment||'',braking:p.braking||'',entry:p.entry||'',apex:p.apex||'',exit:p.exit||'',trajectory:p.trajectory||'',error:p.error||'',correction:p.correction||''}));
    return {id:t.id||Date.now()+i,name:t.name||('Pista '+(i+1)),variant:t.variant||'Karting',imageId:t.imageId||null,image:t.image||t.background||'',pointSpace:t.pointSpace||'stage',points};
  }):[];
  const championships=Array.isArray(raw.championships)?raw.championships.map((c,i)=>({
    id:c.id||Date.now()+i,name:c.name||('Campeonato '+(i+1)),season:c.season||'',
    races:Array.isArray(c.races)?c.races.map((r,j)=>({
      id:r.id||Date.now()+j,name:r.name||('Corrida '+(j+1)),location:r.location||'',date:r.date||'',
      links:{timing:r.links?.timing||'',results:r.links?.results||'',schedule:r.links?.schedule||''},
      days:Array.isArray(r.days)?r.days.map((d,k)=>({
        id:d.id||Date.now()+k,name:d.name||('Dia '+(k+1)),date:d.date||'',sessions:Array.isArray(d.sessions)?d.sessions.map(s=>({...s,pilotIds:Array.isArray(s.pilotIds)?s.pilotIds:[],analyses:s.analyses||{}})):[]
      })):[],pilotIds:Array.isArray(r.pilotIds)?r.pilotIds:[]
    })):[],
  })):[];

  return {
    tracks,
    drivers:Array.isArray(raw.drivers)?raw.drivers.map(d=>({...d,id:d.id||Date.now(),name:d.name||'Piloto',userId:d.userId||null,age:d.age||'',birthDate:d.birthDate||'',kartingStartYear:d.kartingStartYear||'',category:d.category||'',team:d.team||'',number:d.number||''})):[],
    championships,
    calendarEvents:Array.isArray(raw.calendarEvents)?raw.calendarEvents.map((e,i)=>({...e,id:e.id||Date.now()+i,title:e.title||'Prova',date:e.date||'',time:e.time||'',location:e.location||'',championship:e.championship||'',description:e.description||''})):[],
    sessions:Array.isArray(raw.sessions)?raw.sessions:[],
    sessionTemplates:Array.isArray(raw.sessionTemplates)&&raw.sessionTemplates.length?raw.sessionTemplates.map(x=>String(x).trim()).filter(Boolean):['Treino 1','Treino 2','Treino 3','Qualificação','Corrida']
  };
}
function load(){
  try{
    const existing=localStorage.getItem(KEY);
    if(existing) return normalize(JSON.parse(existing));
  }catch(e){}

  // V26 migration: use V25 as the primary state, and only use older versions
  // to restore missing point/image data for tracks that still exist. Never
  // resurrect tracks that were deleted from the current state.
  const sources=['mpracingdevelopment_v25','pista_coach_v24','pista_coach_v23','pista_coach_v22','pista_coach_v21','pista_coach_v20','pista_coach_v19','pista_coach_v16'];
  let base=null;
  for(const key of sources){
    try{const raw=localStorage.getItem(key);if(raw){base=normalize(JSON.parse(raw));break;}}catch(e){}
  }
  if(!base) base=normalize({});

  // Recover points/images for tracks that exist in the current base. Do not
  // re-add missing tracks: absence is treated as an intentional deletion.
  const byName=new Map();
  for(const key of sources.slice(1)){
    try{
      const raw=localStorage.getItem(key); if(!raw) continue;
      const old=normalize(JSON.parse(raw));
      for(const t of old.tracks||[]) byName.set(String(t.name).trim().toLowerCase(),t);
    }catch(e){}
  }
  base.tracks=(base.tracks||[]).map(t=>{
    const old=byName.get(String(t.name||'').trim().toLowerCase());
    if(old){
      if((!t.points||!t.points.length) && old.points?.length) t.points=old.points;
      if(!t.imageId && old.imageId) t.imageId=old.imageId;
      if((!t.image||t.image.length<100) && old.image) t.image=old.image;
      if(old.pointSpace==='image') t.pointSpace='image';
    }
    return t;
  });
  base.tracks.forEach(t=>{ if(t.points?.length) t.pointSpace='image'; });
  try{ const deleted=JSON.parse(localStorage.getItem(DELETED_TRACKS_KEY)||'[]'); const ids=new Set(deleted.map(x=>String(x.id))); base.tracks=base.tracks.filter(t=>!ids.has(String(t.id))); }catch(e){}
  try{localStorage.setItem(KEY,JSON.stringify(base));localStorage.setItem(DELETED_TRACKS_KEY,'[]');}catch(e){}
  return base;
}

function calculateAge(dateStr){ if(!dateStr) return ''; const d=new Date(dateStr+'T00:00:00'); if(Number.isNaN(d.getTime())) return ''; const now=new Date(); let age=now.getFullYear()-d.getFullYear(); const m=now.getMonth()-d.getMonth(); if(m<0 || (m===0 && now.getDate()<d.getDate())) age--; return age>=0?age:''; }
function profileComplete(u){return !!(u&&u.role==='pilot'&&u.profile&&u.profile.name&&u.profile.birthDate&&u.profile.kartingStartYear!==''&&validPilotCategory(u.profile.category))}

function requestedChampionshipIds(u){return Array.isArray(u?.profile?.requestedChampionships)?u.profile.requestedChampionships.map(String):[]}
function approvedChampionshipIds(u){return Array.isArray(u?.profile?.championshipAccess)?u.profile.championshipAccess.map(String):[]}

function championshipRequestsForAdmin(){

  }));
  return out.filter(x=>x.championship);
}
async function syncAccessRequestsFromAuth(){
  if(!currentUser||currentUser.role!=='pilot')return;
  const own=currentUser.profile||{};
  const meta=sb.auth?.getUser?null:null;
  // The auth metadata is copied into the profile once, preserving any later admin decisions.
  try{
    const {data}=await sb.auth.getUser();
    const ids=Array.isArray(data?.user?.user_metadata?.requestedChampionships)?data.user.user_metadata.requestedChampionships.map(String):[];
    const metaBirth=data?.user?.user_metadata?.birthDate||'';
    if(metaBirth && !currentUser.profile?.birthDate){ const profile={...(currentUser.profile||{}),birthDate:metaBirth,age:calculateAge(metaBirth)}; await sb.from('profiles').update({profile,updated_at:new Date().toISOString()}).eq('id',currentUser.id); currentUser.profile=profile; }
    if(!ids.length)return;
    const current=requestedChampionshipIds(currentUser);
    const merged=[...new Set([...current,...ids])];
    if(JSON.stringify(merged.sort())!==JSON.stringify(current.sort())){
      const profile={...own,requestedChampionships:merged};
      const {error}=await sb.from('profiles').update({profile,updated_at:new Date().toISOString()}).eq('id',currentUser.id);
      if(!error){currentUser.profile=profile;await loadProfiles();}
    }
  }catch(e){console.warn('access request sync failed',e)}
}

async function decideChampionshipAccess(userId,champId,approve){
  if(!isAdmin())return;
  const u=(profileCache||[]).find(x=>String(x.id)===String(userId));
  if(!u)return;
  const requested=requestedChampionshipIds(u).filter(id=>String(id)!==String(champId));
  const access=new Set(approvedChampionshipIds(u));
  if(approve)access.add(String(champId));else access.delete(String(champId));
  const profile={...(u.profile||{}),requestedChampionships:requested,championshipAccess:[...access]};

}

  try{localStorage.setItem('mpracingdevelopment_pending_registration_championships',JSON.stringify(requestedChampionships));}catch(e){}
  const status=document.getElementById('registerStatus');
  const setStatus=(msg,ok=false)=>{if(status){status.style.display='block';status.textContent=msg;status.style.borderLeft='3px solid '+(ok?'#8ef0a7':'#fff');status.style.padding='10px 12px';status.style.background='#2a2a2a';}};

  if(!birthDate){setStatus('Indica a tua data de nascimento.');document.getElementById('regBirthDate')?.focus();return}
  if(calculateAge(birthDate)==='' || calculateAge(birthDate)<5){setStatus('Indica uma data de nascimento válida.');document.getElementById('regBirthDate')?.focus();return}
  if(password.length<6){setStatus('A password tem de ter pelo menos 6 caracteres.');document.getElementById('regPassword')?.focus();return}
  const button=document.querySelector('[data-action=register-pilot]');
  if(button){button.disabled=true;button.textContent='A criar conta…'}
  setStatus('A criar conta…');
  try{
    const {data,error}=await sb.auth.signUp({email,password,options:{data:{name,birthDate,requestedChampionships},emailRedirectTo:AUTH_REDIRECT_URL}});
    if(error){
      console.error('Supabase signUp error:',error);
      setStatus('Não foi possível criar a conta: '+(error.message||'erro desconhecido'));
      return;
    }
    if(data?.user && Array.isArray(data.user.identities) && data.user.identities.length===0){
      setStatus('Este email já está registado. Usa o Login em vez de criar outra conta.');
      return;
    }
    if(!data?.user){setStatus('O Supabase não devolveu uma conta. Tenta novamente.');return;}
    if(!data.session){
      ui.page='login';
      render();
      toast('Conta criada. Confirma o email recebido e depois entra na plataforma.');
      return;
    }
    currentUser={id:data.user.id,email:data.user.email||email,role:'pilot',name:name,pilotId:null,profile:{requestedChampionships,birthDate,age:calculateAge(birthDate)}};
    await loadProfiles();
    await syncAccessRequestsFromAuth();
    await loadCloudState();
    await autoLinkPilot();
    try{localStorage.removeItem('mpracingdevelopment_pending_registration_championships')}catch(e){}
    ui.page='profile';
    render();
    toast('Conta criada. Completa agora o teu perfil.');
  }catch(e){
    console.error('Registration error:',e);
    setStatus('Erro ao criar a conta: '+(e?.message||String(e)));
  }finally{
    if(button){button.disabled=false;button.textContent='Criar conta'}
  }
}

async function resizeProfilePhoto(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('Falha a ler a fotografia'));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('Fotografia inválida'));
      img.onload=()=>{
        const max=700;
        const scale=Math.min(1,max/Math.max(img.width,img.height));
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(img.width*scale));
        canvas.height=Math.max(1,Math.round(img.height*scale));
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.78));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

const SCORE_WEIGHTS={rotation:22,braking:18,inTrajectory:14,midTrajectory:14,outTrajectory:12,insertion:12,acceleration:8};
function analysisFor(s,pid,index){return s.analyses?.[pid]?.[index]||{}}
function setAnalysis(s,pid,index,data){if(!s.analyses||Array.isArray(s.analyses))s.analyses={};if(!s.analyses[pid])s.analyses[pid]={};s.analyses[pid][index]={...(s.analyses[pid][index]||{}),...data}}
function metricScore(v){const n=Number(v);return Number.isFinite(n)?Math.max(0,10-Math.abs(Math.max(-10,Math.min(10,n)))):null}
function curveScore(a){
  if(!a)return null;
  const vals=[
    ['rotation',metricScore(a.rotation),SCORE_WEIGHTS.rotation],
    ['braking',metricScore(a.braking),SCORE_WEIGHTS.braking],
    ['inTrajectory',Number(a.inTrajectory),SCORE_WEIGHTS.inTrajectory],
    ['midTrajectory',Number(a.midTrajectory),SCORE_WEIGHTS.midTrajectory],
    ['outTrajectory',Number(a.outTrajectory),SCORE_WEIGHTS.outTrajectory],
    ['insertion',metricScore(a.insertion),SCORE_WEIGHTS.insertion],
    ['acceleration',metricScore(a.acceleration),SCORE_WEIGHTS.acceleration]
  ].filter(x=>Number.isFinite(x[1]));
  if(!vals.length)return null;
  const weight=vals.reduce((n,x)=>n+x[2],0);
  return weight?vals.reduce((n,x)=>n+x[1]*x[2],0)/weight:null;
}
function sessionScore(s,pid){
  const entries=Object.values(s.analyses?.[pid]||{}).map(curveScore).filter(v=>v!=null);
  return entries.length?entries.reduce((a,b)=>a+b,0)/entries.length:null;
}

function positionMapPoints(){
  const stage=document.getElementById('stage');
  const image=document.getElementById('trackImage');
  if(!stage||!image)return;
  const track=db.tracks.find(x=>String(x.id)===String(ui.editor));
  const s=getSession();
  const trackForSession=ui.page==='session'&&s?db.tracks.find(t=>String(t.id)===String(s.trackId)):null;
  const pilotSession=getSession();
  const trackForPilot=ui.page==='pilot-session'&&pilotSession?db.tracks.find(t=>String(t.id)===String(pilotSession.trackId)):null;
  const t=track||trackForSession||trackForPilot||db.tracks.find(x=>x.points?.length&&x.image);
  if(!t||!t.points?.length)return;
  // Points are stored as percentages of the ORIGINAL rendered image, never of the stage.
  // Calculate their position from the image's actual bounding box so Admin and Pilot use
  // exactly the same reference rectangle even when the image is resized/centered.
  const ir=image.getBoundingClientRect(),sr=stage.getBoundingClientRect();
  if(!ir.width||!ir.height)return;
  const ox=ir.left-sr.left,oy=ir.top-sr.top;
  const place=(el,p)=>{
    const x=ox+(Number(p.x)||0)/100*ir.width;
    const y=oy+(Number(p.y)||0)/100*ir.height;
    el.style.left=`${x}px`;
    el.style.top=`${y}px`;
  };
  stage.querySelectorAll('[data-map-point]').forEach((el,i)=>{ if(t.points[i])place(el,t.points[i]); });
}

function migrateLegacyTrackPoints(t){
  if(!t||t.pointSpace==='image')return false;
  const stage=document.getElementById('stage'),image=document.getElementById('trackImage');
  if(!stage||!image||!image.complete)return false;
  const ir=image.getBoundingClientRect(),sr=stage.getBoundingClientRect();
  if(!ir.width||!ir.height)return false;
  t.points.forEach(p=>{p.x=Math.max(0,Math.min(100,((Number(p.x)/100*sr.width-(ir.left-sr.left))/ir.width)*100));p.y=Math.max(0,Math.min(100,((Number(p.y)/100*sr.height-(ir.top-sr.top))/ir.height)*100));});
  t.pointSpace='image';save();return true;
}

async function createSession(){
  const champId=document.getElementById('sessionChamp').value,raceId=document.getElementById('sessionRace').value,dayId=document.getElementById('sessionDay').value,n=document.getElementById('sessionName').value.trim();
  if(!champId||!raceId||!dayId||!n){toast('Seleciona campeonato, prova, dia e nome da sessão');return}
  const c=db.championships.find(x=>String(x.id)===String(champId)),r=c?.races.find(x=>String(x.id)===String(raceId)),d=r?.days.find(x=>String(x.id)===String(dayId));
  if(!d){toast('Não foi possível encontrar o dia');return}

  const s={id:Date.now(),name:n,date:document.getElementById('sessionDate').value||d.date||r.date||'',time:document.getElementById('sessionTime').value||'09:00',description:document.getElementById('sessionDescription').value.trim(),trackId:document.getElementById('sessionTrack').value||null,pilotIds,analyses:{}};
  d.sessions.push(s);

  r.pilotIds=[...racePilotIds];
  await save();closeModal();ui.championship=c.id;ui.race=r.id;ui.day=d.id;ui.session=s.id;ui.page='session';render();

async function deleteSession(){

}
async function deleteSessionByIds(sessionId,champId,raceId,dayId){
  if(!isAdmin()){toast('Acesso reservado ao administrador');return;}
  const c=db.championships.find(x=>String(x.id)===String(champId));
  const r=c?.races?.find(x=>String(x.id)===String(raceId));
  const d=r?.days?.find(x=>String(x.id)===String(dayId));
  const s=d?.sessions?.find(x=>String(x.id)===String(sessionId));
  if(!d||!s){toast('Sessão não encontrada');return;}

  if(String(ui.session)===String(sessionId)){ui.session=null;ui.sessionPoint=0;ui.sessionPilot=null;ui.page='sessions';}
  await save();render();
}

function render(){
  persistUi();
  const app=document.getElementById('app');
  if(currentUser && currentUser.role==='pilot' && !profileComplete(currentUser) && !['profile','register','championships','championship'].includes(ui.page))ui.page='profile';
  if(!currentUser){
    if(!cloudReady){
      app.innerHTML='<div style="min-height:70vh;display:grid;place-items:center;padding:24px"><div class="card" style="max-width:420px;width:100%;text-align:center"><div class="kpi" style="font-size:28px">MPRacingDevelopment</div><div class="muted" style="margin-top:8px">A recuperar a sessão…</div></div></div>';
      return;
    }
    app.innerHTML=(ui.page==='register'?registerPage():loginPage());
    document.querySelectorAll('[data-page]').forEach(b=>b.classList.remove('active'));
    return;
  }
  if(ui.page==='editor')app.innerHTML=editor();
  else if(ui.page==='dashboard')app.innerHTML=dashboard();
  else if(ui.page==='my-events')app.innerHTML=myEventsPage();
  else if(ui.page==='profile')app.innerHTML=profilePage();
  else if(ui.page==='register')app.innerHTML=registerPage();
  else if(ui.page==='drivers')app.innerHTML=drivers();
  else if(ui.page==='sessions')app.innerHTML=sessions();
  else if(ui.page==='calendar')app.innerHTML=calendarPage();
  else if(ui.page==='tracks')app.innerHTML=tracksPage();
  else if(ui.page==='championships')app.innerHTML=championshipsPage();
  else if(ui.page==='championship')app.innerHTML=championshipPage();
  else if(ui.page==='race')app.innerHTML=racePage();
  else if(ui.page==='day')app.innerHTML=dayPage();
  else if(ui.page==='session')app.innerHTML=sessionPage();
  else if(ui.page==='pilot-race')app.innerHTML=pilotRacePage();
  else if(ui.page==='pilot-day')app.innerHTML=pilotDayPage();
  else if(ui.page==='pilot-session')app.innerHTML=pilotSessionPage();
  if(currentUser){
    const role=currentUser.role==='admin'?'ADMIN':'PILOTO';
    app.insertAdjacentHTML('afterbegin',`<div class="userbar" style="justify-content:flex-end;margin-bottom:12px"><span>${esc(currentUser.name)}</span><span class="rolebadge">${role}</span><button class="btn" data-action="logout">Sair</button></div>`);
  }
  document.querySelectorAll('[data-page]').forEach(b=>{
    b.classList.toggle('active',b.dataset.page===ui.page);
    const adminOnly=['dashboard','tracks','drivers','sessions'].includes(b.dataset.page);
    if(isAdmin() && b.dataset.page==='profile') b.style.display='none';
    else b.style.display=(!isAdmin()&&adminOnly)?'none':'';
  });
  const side=document.querySelector('.nav');
  if(side && !isAdmin() && !side.querySelector('[data-page="my-events"]')){
    const b=document.createElement('button');b.dataset.page='my-events';b.textContent='Os meus eventos';side.prepend(b);
  }
  if(side && isAdmin()){
    const b=side.querySelector('[data-page="my-events"]');if(b)b.remove();
  }
  if(ui.page==='editor')bindEditor();
  if(ui.page==='session'||ui.page==='pilot-session'||ui.page==='editor'){
    const img=document.getElementById('trackImage');
    if(img){
      const p=()=>{positionMapPoints();requestAnimationFrame(()=>positionMapPoints());};
      if(img.complete)p();else img.onload=p;
      if(window._mpResizeObserver)window._mpResizeObserver.disconnect();
      window._mpResizeObserver=new ResizeObserver(()=>positionMapPoints());
      window._mpResizeObserver.observe(img);
      window._mpResizeObserver.observe(document.getElementById('stage'));
    }
  }
  persistUi();
}
function modal(content){
  document.getElementById('modal').innerHTML=`<div class="modalbg"><div class="modal">${content}</div></div>`;
}
function closeModal(){document.getElementById('modal').innerHTML=''}

function newTrack(){
  modal(`<h2>Nova pista</h2>
    <div class="field"><label>Nome</label><input id="trackName" placeholder="Ex.: Viana"></div>
    <div class="field"><label>Variante</label><input id="trackVariant" value="Karting"></div>
    <div class="modalactions"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="create-track">Criar</button></div>`);
}

async function createTrack(){
  const name=document.getElementById('trackName').value.trim();
  if(!name)return;
  const t={
    id:Date.now(),
    name,
    variant:document.getElementById('trackVariant').value.trim()||'Karting',
    image:'',
    pointSpace:'image',
    points:[]
  };
  db.tracks.push(t);await save();closeModal();
  ui.page='editor';ui.editor=t.id;ui.mode='add';ui.selected=null;render();
}

function bindEditor(){
  const t=db.tracks.find(x=>String(x.id)===String(ui.editor));
  const stage=document.getElementById('stage'),layer=document.getElementById('clickLayer'),image=document.getElementById('trackImage');
  if(!t||!stage||!layer)return;
  const file=document.getElementById('file');
  if(file){
    file.onchange=async()=>{
      const f=file.files?.[0];
      if(!f)return;
      if(!f.type.startsWith('image/')){toast('Escolhe um ficheiro de imagem');file.value='';return;}
      try{
        toast('A processar imagem…');
        const data=await compressImage(f);
        const ok=await persistTrackImage(t,data);
        if(ok){t.pointSpace='image';render();toast('Imagem carregada e guardada');}
        else toast('A imagem foi lida, mas não foi possível guardá-la online.');
      }catch(e){console.error(e);toast('Não foi possível ler a imagem.');}
      finally{file.value='';}
    };
  }
  const position=()=>{if(image){if(!migrateLegacyTrackPoints(t)){positionMapPoints();}else{render();return;}}};
  if(image){if(image.complete)position();else image.onload=position;}
  layer.onclick=event=>{
    if(ui.mode!=='add'||!image){if(!image)toast('Carrega primeiro uma imagem.');return;}
    const ir=image.getBoundingClientRect(),sr=stage.getBoundingClientRect();
    if(event.clientX<ir.left||event.clientX>ir.right||event.clientY<ir.top||event.clientY>ir.bottom)return;
    const x=((event.clientX-ir.left)/ir.width)*100,y=((event.clientY-ir.top)/ir.height)*100;
    t.pointSpace='image';t.points.push({id:'p'+Date.now(),x,y,comment:'',braking:'',trail:'',insertion:'',inTrajectory:10,midTrajectory:10,outTrajectory:10,acceleration:'',rotation:''});
    ui.selected=t.points.length-1;save();render();
  };
}

document.addEventListener('change',event=>{
  if(event.target.id==='activePilot'){ui.sessionPilot=event.target.value;ui.sessionPoint=0;render();}
  if(event.target.id==='profileBirthDate'){const age=calculateAge(event.target.value);const el=document.getElementById('profileAge');if(el)el.value=age||'';}
});
document.addEventListener('click',async event=>{

  const page=event.target.closest('[data-page]');
  if(page){
    ui.page=page.dataset.page;
    profileEditing=false;ui.editor=null;ui.selected=null;persistUi();render();return;
  }

  const mode=event.target.closest('[data-mode]');
  if(mode){ui.mode=mode.dataset.mode;render();return;}

  const sessionPoint=event.target.closest('[data-session-point]');
  if(sessionPoint){ui.sessionPoint=Number(sessionPoint.dataset.sessionPoint);render();return;}
  const point=event.target.closest('[data-point]');
  if(point){
    ui.selected=Number(point.dataset.point);
    ui.mode='select';
    render();
    return;
  }

  const action=event.target.closest('[data-action]');
  if(!action)return;
  const protectedActions=['new-track','create-track','delete','add-registered-pilot','new-championship','create-championship','new-race','create-race','new-day','create-day','new-session','create-session','configure-session','save-session','manage-session-templates','add-session-template','delete-session-template','delete-session','delete-pilot-account','delete-orphan-pilot','new-calendar-event','create-calendar-event','delete-calendar-event','save-calendar-event','approve-championship-access','reject-championship-access','edit','image','remove'];
  if(!isAdmin()&&protectedActions.includes(action.dataset.action)){toast('Acesso reservado ao administrador');return;}

  switch(action.dataset.action){
    case 'login':login();break;
    case 'go-back':goBackPage();break;
    case 'go-register':ui.page='register';render();break;
    case 'request-championship-access':requestChampionshipAccess(action.dataset.id);break;
    case 'approve-championship-access':decideChampionshipAccess(action.dataset.userId,action.dataset.champId,true);break;
    case 'reject-championship-access':decideChampionshipAccess(action.dataset.userId,action.dataset.champId,false);break;
    case 'back-login':ui.page='login';render();break;
    case 'register-pilot':registerPilot();break;
    case 'save-profile':saveProfile();break;
    case 'edit-profile':profileEditing=true;render();break;
    case 'cancel-profile-edit':profileEditing=false;render();break;
    case 'save-analysis':{
      const s=getSession(),pid=ui.sessionPilot||document.getElementById('activePilot')?.value;
      if(!pid){toast('Seleciona um piloto');break}
      setAnalysis(s,pid,ui.sessionPoint||0,{comment:document.getElementById('analysisComment').value,braking:document.getElementById('analysisBraking').value,insertion:document.getElementById('analysisInsertion').value,inTrajectory:document.getElementById('analysisInTrajectory').value,midTrajectory:document.getElementById('analysisMidTrajectory').value,outTrajectory:document.getElementById('analysisOutTrajectory').value,acceleration:document.getElementById('analysisAcceleration').value,rotation:document.getElementById('analysisRotation').value});
      if(!s.generalAnalysis)s.generalAnalysis={};s.generalAnalysis[pid]={comment:document.getElementById('generalAnalysis')?.value||''};
      await save();toast('Análise guardada');render();break;
    }
    case 'finish-analysis':{
      if(saveCurrentAnalysis()){await save();toast('Sessão analisada e guardada');ui.page='sessions';ui.session=null;ui.sessionPoint=0;ui.sessionPilot=null;render();}
      break;
    }
    case 'logout':logout();break;
    case 'calendar-prev':calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()-1,1);render();break;
    case 'calendar-next':calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,1);render();break;
    case 'new-calendar-event':newCalendarEvent();break;
    case 'create-calendar-event':createCalendarEvent();break;
    case 'save-calendar-event':saveCalendarEvent(action.dataset.id);break;
    case 'calendar-event':calendarEventModal(action.dataset.id);break;
    case 'delete-calendar-event':{const id=String(action.dataset.id);if(confirm('Apagar esta prova do calendário?')){db.calendarEvents=db.calendarEvents.filter(e=>String(e.id)!==id);await save();closeModal();render();}}break;
    case 'pilot-home':ui.page='my-events';render();break;
    case 'pilot-race-back':ui.page='pilot-race';if(action.dataset.champ)ui.championship=action.dataset.champ;if(action.dataset.race)ui.race=action.dataset.race;render();break;
    case 'pilot-race':ui.page='pilot-race';ui.championship=action.dataset.champ;ui.race=action.dataset.race;render();break;
    case 'pilot-day':ui.page='pilot-day';ui.day=action.dataset.id;if(action.dataset.champ)ui.championship=action.dataset.champ;if(action.dataset.race)ui.race=action.dataset.race;render();break;
    case 'pilot-session':ui.page='pilot-session';ui.session=action.dataset.id;if(action.dataset.champ)ui.championship=action.dataset.champ;if(action.dataset.race)ui.race=action.dataset.race;if(action.dataset.day)ui.day=action.dataset.day;render();break;
    case 'new-championship':newChampionship();break;
    case 'create-championship':createChampionship();break;
    case 'open-championship':ui.page='championship';ui.championship=action.dataset.id;render();break;
    case 'back-championships':ui.page='championships';render();break;
    case 'back-championship':ui.page='championship';render();break;
    case 'new-race':newRace();break;
    case 'create-race':createRace();break;
    case 'open-race':ui.page='race';ui.race=action.dataset.id;render();break;
    case 'back-races':ui.page='championship';render();break;
    case 'delete-championship':{const id=action.dataset.id;db.championships=db.championships.filter(c=>String(c.id)!==String(id));if(String(ui.championship)===String(id)){ui.championship=null;ui.race=null;ui.day=null;ui.session=null;ui.page='championships';}await save();render();break;}
    case 'delete-race':{const c=getChamp();if(c){c.races=c.races.filter(r=>String(r.id)!==String(action.dataset.id));save();render();}break;}
    case 'new-day':newDay();break;
    case 'create-day':createDay();break;
    case 'open-day':ui.page='day';ui.day=action.dataset.id;render();break;
    case 'back-day':ui.page='day';render();break;
    case 'new-session':newSession();break;
    case 'manage-session-templates':manageSessionTemplates();break;
    case 'add-session-template':addSessionTemplate();break;
    case 'delete-session-template':deleteSessionTemplate(action.dataset.index);break;
    case 'create-session':createSession();break;
    case 'delete-session':{
      if(ui.page==='session' && !action.dataset.champ){deleteSession();}
      else {deleteSessionByIds(action.dataset.id,action.dataset.champ||ui.championship,action.dataset.race||ui.race,action.dataset.day||ui.day);}
      break;
    }
    case 'open-session':ui.page='session';ui.session=action.dataset.id;if(action.dataset.champ)ui.championship=action.dataset.champ;if(action.dataset.race)ui.race=action.dataset.race;if(action.dataset.day)ui.day=action.dataset.day;render();break;
    case 'configure-session':configureSession();break;
    case 'save-session':saveSession();break;
    case 'new-track':newTrack();break;
    case 'create-track':createTrack();break;
    case 'new-driver':newDriver();break;
    case 'add-registered-pilot':addRegisteredPilot(action.dataset.userId);break;
    case 'create-driver':addRegisteredPilot();break;
    case 'delete-pilot-account':deletePilotAccount(action.dataset.userId);break;
    case 'delete-orphan-pilot':deleteOrphanPilot(action.dataset.driverId);break;
    case 'close':closeModal();break;
    case 'edit':
      ui.page='editor';ui.editor=action.dataset.id;ui.mode='add';ui.selected=null;render();break;
    case 'back':
      ui.page='tracks';ui.editor=null;ui.selected=null;render();break;
    case 'image':
      document.getElementById('file').click();break;
    case 'save':
      save();toast('Pista guardada');break;
    case 'remove':{
      const t=db.tracks.find(x=>String(x.id)===String(ui.editor));
      if(ui.selected==null){toast('Seleciona primeiro uma curva');break;}
      t.points.splice(ui.selected,1);
      ui.selected=t.points.length?Math.min(ui.selected,t.points.length-1):null;
      save();render();break;
    }
    case 'delete':{
      const id=String(action.dataset.id);
      db.tracks=db.tracks.filter(t=>String(t.id)!==id);
      await save();
      if(String(ui.editor)===id){ui.editor=null;ui.selected=null;ui.page='tracks';}
      render();toast('Pista eliminada');break;
    }
    case 'save-comment':{
      const t=db.tracks.find(x=>String(x.id)===String(ui.editor));
      const p=t?.points?.[ui.selected];
      if(!p)break;
      p.comment=document.getElementById('comment').value;
      p.braking=document.getElementById('braking').value;
      p.entry=document.getElementById('entry').value;
      p.apex=document.getElementById('apex').value;
      p.exit=document.getElementById('exit').value;
      p.trajectory=document.getElementById('trajectory').value;
      p.error=document.getElementById('error').value;
      p.correction=document.getElementById('correction').value;
      save();toast('Comentário guardado');break;
    }
  }
});

function updateCountdowns(){
  document.querySelectorAll('[data-countdown]').forEach(el=>{const t=new Date(el.dataset.countdown).getTime(),diff=t-Date.now();if(!Number.isFinite(t))return;if(diff<=0){el.textContent='A começar agora';return;}const total=Math.floor(diff/1000),days=Math.floor(total/86400),hrs=Math.floor(total%86400/3600),mins=Math.floor(total%3600/60),secs=total%60;el.textContent=days>0?`${days}d ${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`:`${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;});
}
setInterval(updateCountdowns,1000);
window.addEventListener('beforeunload',()=>persistUi());
window.addEventListener('pagehide',()=>persistUi());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')persistUi();});

render();
subscribeAuth();
bootCloud();
</script>
