<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pista Coach V14</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d10;color:#f5f6f7;font-family:Arial,Helvetica,sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}
.sidebar{position:fixed;inset:0 auto 0 0;width:220px;background:#111419;border-right:1px solid #292e35;padding:22px 16px;z-index:20}
.logo{font-size:20px;font-weight:800;margin:4px 8px 30px}.logo span{color:#87909a}
.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aeb5bd;text-align:left;padding:12px;border-radius:8px}
.nav button.active,.nav button:hover{background:#20252c;color:#fff}
main{margin-left:220px;padding:28px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}
.title{font-size:28px;font-weight:800}.sub,.muted{color:#8e97a1}
.btn{background:#171b21;color:#fff;border:1px solid #303740;border-radius:8px;padding:10px 14px}
.btn.primary{background:#fff;color:#111;border-color:#fff;font-weight:700}.btn.danger{color:#ff9999}
.buttons{display:flex;gap:8px;flex-wrap:wrap}
.list{display:grid;gap:9px}.row{background:#13171c;border:1px solid #292f36;border-radius:11px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:15px}
.empty{padding:40px;text-align:center;border:1px dashed #303740;border-radius:12px;color:#8e97a1}
.editor{display:grid;grid-template-columns:250px 1fr;gap:12px}
.panel{display:grid;gap:10px;align-content:start}.card{background:#13171c;border:1px solid #292f36;border-radius:11px;padding:13px}
.card h3{font-size:14px;margin:0 0 10px}.card .btn{width:100%;margin-bottom:7px}
.help{font-size:12px;color:#8e97a1;line-height:1.5}.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mode .btn.selected{background:#fff;color:#111}
.stagebox{background:#0e1115;border:1px solid #292f36;border-radius:11px;overflow:hidden}
.stagehead{padding:12px 14px;border-bottom:1px solid #292f36;display:flex;justify-content:space-between}
.stage{height:calc(100vh - 165px);min-height:520px;position:relative;overflow:hidden;background:#0e1115;touch-action:none}
.image-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.track-image{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none;pointer-events:none}
.point{position:absolute;width:32px;height:32px;border-radius:50%;transform:translate(-50%,-50%);background:#fff;color:#111;border:3px solid #111;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;z-index:5;box-shadow:0 2px 6px #0008}
.point.selected{background:#ffd05a}.point.added{cursor:pointer}
.click-layer{position:absolute;inset:0;z-index:2}
.comments{position:absolute;right:12px;top:12px;width:290px;max-height:calc(100% - 24px);overflow:auto;background:#171b20ee;border:1px solid #3b424a;border-radius:10px;padding:12px;z-index:10}
.comments h3{margin:0 0 10px}.field{display:grid;gap:5px;margin-bottom:8px}.field label{font-size:12px;color:#aeb5bd}
.field input,.field textarea{width:100%;background:#0b0e12;color:#fff;border:1px solid #303740;border-radius:7px;padding:8px}.field textarea{min-height:65px;resize:vertical}
.modalbg{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:20px;z-index:40}
.modal{background:#14181d;border:1px solid #343b44;border-radius:13px;padding:20px;width:min(600px,100%)}
.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
@media(max-width:850px){.sidebar{width:65px;padding:14px 7px}.logo{font-size:0;text-align:center}.logo:after{content:"PC";font-size:18px}.nav button{font-size:0;text-align:center}main{margin-left:65px;padding:16px}.editor{grid-template-columns:1fr}.stage{height:65vh;min-height:430px}.comments{left:12px;right:12px;width:auto}}

.breadcrumb{display:flex;gap:8px;align-items:center;color:#8e97a1;font-size:13px;margin-bottom:14px}.breadcrumb [data-action]{cursor:pointer}.breadcrumb b{color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.cardlink,.eventcard{background:#13171c;border:1px solid #292f36;border-radius:11px;padding:16px}.cardlink{cursor:pointer}.cardlink:hover{border-color:#59636e}.cardlink h3,.eventcard h3{margin:0 0 7px}.cardlink p,.eventmeta{margin:0;color:#8e97a1;font-size:13px;line-height:1.5}.eventgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.links{display:grid;gap:7px;margin-top:10px}.links a{color:#fff;text-decoration:none;border:1px solid #303740;border-radius:7px;padding:8px 10px;background:#171b21;font-size:13px}.sessionrow{background:#13171c;border:1px solid #292f36;border-radius:10px;padding:13px;display:flex;justify-content:space-between;gap:10px;align-items:center}.sectiontitle{font-size:16px;font-weight:800;margin:22px 0 10px}.readonly{background:#101318;border:1px solid #292f36;border-radius:10px;padding:15px}

.userbar{display:flex;align-items:center;gap:10px}.rolebadge{font-size:11px;padding:5px 8px;border-radius:999px;background:#20252c;color:#dbe0e5}.loginbox{width:min(420px,100%)}.loginbox h1{margin-top:0}.account-card{background:#13171c;border:1px solid #292f36;border-radius:10px;padding:13px;margin-top:9px}
<style>.kpi{font-size:30px;font-weight:800}.checklist{display:grid;gap:8px}.checklist label{padding:8px;border:1px solid #292f36;border-radius:7px}.point.selected{outline:3px solid #fff;transform:translate(-50%,-50%) scale(1.08)}</style>
</head>
<body>
<aside class="sidebar">
<div class="logo">PISTA <span>COACH</span></div>
<div class="nav">
<button data-page="dashboard">Dashboard</button>
<button data-page="drivers">Pilotos</button>
<button data-page="tracks">Pistas</button>
<button data-page="championships">Campeonatos</button>
<button data-page="sessions">Sessões</button>
<button data-page="profile">Meu perfil</button>
</div>
</aside>
<main id="app"></main><div id="modal"></div>

<script>
'use strict';

const KEY='pista_coach_v13';
const LEGACY=['pista_coach_v12','pista_coach_v9','pista_coach_v8','pista_coach_v7','pista_coach_v6','pista_coach_v5','pista_coach_v4_1','pista_coach_v4','pista_coach_v3','pista_coach_v2','pista_coach_v1'];

let db=load();
let ui={page:'dashboard',editor:null,mode:'add',selected:null,championship:null,race:null,day:null,session:null};
let currentUser=loadUser();

function normalize(raw){
  raw=raw||{};
  const tracks=Array.isArray(raw.tracks)?raw.tracks.map((t,i)=>{
    const source=Array.isArray(t.points)?t.points:[];
    const points=source.map((p,j)=>({id:p.id||('p'+Date.now()+j),x:Number(p.x!=null?p.x:p[0])||0,y:Number(p.y!=null?p.y:p[1])||0,comment:p.comment||'',braking:p.braking||'',entry:p.entry||'',apex:p.apex||'',exit:p.exit||'',trajectory:p.trajectory||'',error:p.error||'',correction:p.correction||''}));
    return {id:t.id||Date.now()+i,name:t.name||('Pista '+(i+1)),variant:t.variant||'Karting',image:t.image||t.background||'',points};
  }):[];
  const championships=Array.isArray(raw.championships)?raw.championships.map((c,i)=>({
    id:c.id||Date.now()+i,name:c.name||('Campeonato '+(i+1)),season:c.season||'',
    races:Array.isArray(c.races)?c.races.map((r,j)=>({
      id:r.id||Date.now()+j,name:r.name||('Corrida '+(j+1)),location:r.location||'',date:r.date||'',
      links:{timing:r.links?.timing||'',results:r.links?.results||'',schedule:r.links?.schedule||''},
      days:Array.isArray(r.days)?r.days.map((d,k)=>({
        id:d.id||Date.now()+k,name:d.name||('Dia '+(k+1)),date:d.date||'',sessions:Array.isArray(d.sessions)?d.sessions.map(s=>({...s,pilotIds:Array.isArray(s.pilotIds)?s.pilotIds:[],analyses:s.analyses||{}})):[]
      })):[],pilotIds:Array.isArray(r.pilotIds)?r.pilotIds:[]
    })):[],
  })):[];

  return {
    tracks,
    drivers:Array.isArray(raw.drivers)?raw.drivers.map(d=>({...d,id:d.id||Date.now(),name:d.name||'Piloto',userId:d.userId||null,age:d.age||'',kartingStartYear:d.kartingStartYear||'',category:d.category||'',team:d.team||'',number:d.number||''})):[],
    championships,
    sessions:Array.isArray(raw.sessions)?raw.sessions:[]
  };
}
function load(){
  for(const key of [KEY,...LEGACY]){
    try{
      const raw=localStorage.getItem(key);
      if(raw){
        const data=normalize(JSON.parse(raw));
        localStorage.setItem(KEY,JSON.stringify(data));
        return data;
      }
    }catch(e){}
  }
  return normalize({});
}


function defaultUsers(){
  return [
    {id:'admin',name:'Admin',email:'admin@pistacoach.pt',password:'admin123',role:'admin',pilotId:null,profile:null},
    {id:'pilot1',name:'Piloto Demo',email:'piloto@pistacoach.pt',password:'1234',role:'pilot',pilotId:null,profile:null}
  ];
}
function loadUser(){
  try{
    const key='pista_coach_v13_users';
    if(!localStorage.getItem(key))localStorage.setItem(key,JSON.stringify(defaultUsers()));
  }catch(e){}
  return null;
}
function users(){try{return JSON.parse(localStorage.getItem('pista_coach_v13_users'))||defaultUsers()}catch(e){return defaultUsers()}}
function isAdmin(){return currentUser?.role==='admin'}
function freshCurrentUser(){
  if(!currentUser)return null;
  const u=users().find(x=>x.id===currentUser.id);
  if(u)currentUser=u;
  return currentUser;
}
function currentPilotId(){
  return freshCurrentUser()?.pilotId||null;
}
function profileComplete(u){return !!(u&&u.role==='pilot'&&u.profile&&u.profile.name&&u.profile.age!==''&&u.profile.kartingStartYear!=='')}
function loginPage(){
  return `<div style="min-height:80vh;display:flex;align-items:center;justify-content:center"><div class="card loginbox">
    <h1>Pista Coach</h1><div class="sub" style="margin-bottom:18px">Entrar na plataforma</div>
    <div class="field"><label>Email</label><input id="loginEmail" type="email"></div>
    <div class="field"><label>Password</label><input id="loginPassword" type="password"></div>
    <button class="btn primary" style="width:100%" data-action="login">Entrar</button>
    <button class="btn" style="width:100%;margin-top:8px" data-action="go-register">Criar conta de piloto</button>
    <div class="help" style="margin-top:14px">Teste admin: admin@pistacoach.pt / admin123<br>Teste piloto: piloto@pistacoach.pt / 1234</div>
  </div></div>`;
}
function registerPage(){
  return `<div style="min-height:80vh;display:flex;align-items:center;justify-content:center"><div class="card loginbox">
    <h1>Criar conta de piloto</h1><div class="sub">Depois do registo, vais preencher o teu perfil.</div>
    <div class="field"><label>Nome</label><input id="regName"></div>
    <div class="field"><label>Email</label><input id="regEmail" type="email"></div>
    <div class="field"><label>Password</label><input id="regPassword" type="password"></div>
    <div class="modalactions"><button class="btn" data-action="back-login">Voltar</button><button class="btn primary" data-action="register-pilot">Criar conta</button></div>
  </div></div>`;
}
function login(){
  const email=document.getElementById('loginEmail').value.trim().toLowerCase(),password=document.getElementById('loginPassword').value;
  const u=users().find(x=>x.email.toLowerCase()===email&&x.password===password);
  if(!u){toast('Email ou password incorretos');return}
  currentUser=u;sessionStorage.setItem('pista_coach_v13_user',JSON.stringify(u));
  ui.page=isAdmin()?'dashboard':(profileComplete(u)?'my-events':'profile');render();
}
function restoreUser(){try{const raw=sessionStorage.getItem('pista_coach_v13_user');if(raw)currentUser=JSON.parse(raw)}catch(e){}}
function logout(){currentUser=null;sessionStorage.removeItem('pista_coach_v13_user');ui.page='login';render()}
function registerPilot(){
  const name=document.getElementById('regName').value.trim(),email=document.getElementById('regEmail').value.trim().toLowerCase(),password=document.getElementById('regPassword').value;
  if(!name||!email||password.length<4){toast('Preenche nome, email e uma password com pelo menos 4 caracteres');return}
  const list=users();
  if(list.some(u=>u.email.toLowerCase()===email)){toast('Já existe uma conta com esse email');return}
  const u={id:'pilot_'+Date.now(),name,email,password,role:'pilot',pilotId:null,profile:null};
  list.push(u);localStorage.setItem('pista_coach_v13_users',JSON.stringify(list));
  currentUser=u;sessionStorage.setItem('pista_coach_v13_user',JSON.stringify(u));ui.page='profile';render();
}
function profilePage(){
  const p=currentUser?.profile||{};
  return header('Meu perfil','Identificação e contexto desportivo do piloto.','')+
  `<div class="card" style="max-width:760px">
    <div class="field"><label>Nome completo</label><input id="profileName" value="${esc(p.name||currentUser?.name||'')}"></div>
    <div class="grid2"><div class="field"><label>Idade</label><input id="profileAge" type="number" min="5" max="80" value="${esc(p.age??'')}"></div><div class="field"><label>Ano de início no karting</label><input id="profileKartingYear" type="number" min="1950" max="2100" value="${esc(p.kartingStartYear??'')}"></div></div>
    <div class="grid2"><div class="field"><label>Categoria</label><input id="profileCategory" placeholder="Ex.: X30 Senior" value="${esc(p.category||'')}"></div><div class="field"><label>Equipa</label><input id="profileTeam" value="${esc(p.team||'')}"></div></div>
    <div class="grid2"><div class="field"><label>Número</label><input id="profileNumber" value="${esc(p.number||'')}"></div><div class="field"><label>Localidade</label><input id="profileLocation" value="${esc(p.location||'')}"></div></div>
    <div class="field"><label>Notas de contexto</label><textarea id="profileNotes" rows="4">${esc(p.notes||'')}</textarea></div>
    <button class="btn primary" data-action="save-profile">Guardar perfil</button>
  </div>`;
}
function saveProfile(){
  const u=users().find(x=>x.id===currentUser.id);if(!u)return;
  const profile={name:document.getElementById('profileName').value.trim(),age:document.getElementById('profileAge').value,kartingStartYear:document.getElementById('profileKartingYear').value,category:document.getElementById('profileCategory').value.trim(),team:document.getElementById('profileTeam').value.trim(),number:document.getElementById('profileNumber').value.trim(),location:document.getElementById('profileLocation').value.trim(),notes:document.getElementById('profileNotes').value.trim()};
  if(!profile.name||profile.age===''||profile.kartingStartYear===''){toast('Preenche nome, idade e ano de início no karting');return}
  u.name=profile.name;u.profile=profile;localStorage.setItem('pista_coach_v13_users',JSON.stringify(users()));
  currentUser=u;sessionStorage.setItem('pista_coach_v13_user',JSON.stringify(u));
  if(u.pilotId){const d=db.drivers.find(x=>String(x.id)===String(u.pilotId));if(d){Object.assign(d,{name:profile.name,age:profile.age,kartingStartYear:profile.kartingStartYear,category:profile.category,team:profile.team,number:profile.number});save()}}
  ui.page='my-events';render();
}
function syncPilotLinks(){
  const us=users();
  for(const d of db.drivers||[]){
    if(d.userId){
      const u=us.find(x=>String(x.id)===String(d.userId));
      if(u && u.pilotId!==d.id)u.pilotId=d.id;
    }
  }
  for(const u of us.filter(x=>x.role==='pilot')){
    if(u.pilotId && !(db.drivers||[]).some(d=>String(d.id)===String(u.pilotId) && String(d.userId)===String(u.id)))
      u.pilotId=null;
  }
  localStorage.setItem('pista_coach_v13_users',JSON.stringify(us));
}
function registeredPilotUsers(){
  syncPilotLinks();
  return users().filter(u=>u.role==='pilot'&&u.profile&&!u.pilotId);
}
function newDriver(){
  syncPilotLinks();
  const available=registeredPilotUsers();
  if(!available.length){toast('Não existem contas de piloto registadas e disponíveis.');return}
  modal(`<h2>Adicionar piloto</h2><div class="help" style="margin-bottom:12px">Só aparecem contas de piloto que já estão registadas e ainda não foram adicionadas.</div>
    <div class="field"><label>Conta de piloto</label><select id="registeredPilot"><option value="">Selecionar</option>${available.map(u=>`<option value="${u.id}">${esc(u.profile.name)} · ${esc(u.email)}</option>`).join('')}</select></div>
    <div class="modalactions"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="create-driver">Adicionar</button></div>`);
}
function createDriver(){
  const u=users().find(x=>x.id===document.getElementById('registeredPilot')?.value);
  if(!u||!u.profile){toast('Seleciona uma conta registada');return}
  const p=u.profile,d={id:'d_'+Date.now(),name:p.name,userId:u.id,age:p.age,kartingStartYear:p.kartingStartYear,category:p.category||'',team:p.team||'',number:p.number||'',location:p.location||'',notes:p.notes||''};
  db.drivers.push(d);
  const allUsers=users();
  const linked=allUsers.find(x=>x.id===u.id);
  if(linked)linked.pilotId=d.id;
  localStorage.setItem('pista_coach_v13_users',JSON.stringify(allUsers));
  save();closeModal();render();
}
function driverCard(d){
  const u=users().find(x=>x.id===d.userId),p=u?.profile||d;
  return `<div class="card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:16px"><div><h3 style="margin:0 0 6px">${esc(p.name||d.name)}</h3><div class="muted">${esc(p.category||'Categoria por definir')} · ${esc(p.team||'Equipa por definir')} · ${p.age?esc(p.age)+' anos':''}</div></div><span class="rolebadge">${u?'Conta registada':'Sem conta'}</span></div>
  <div class="grid2" style="margin-top:14px"><div><span class="muted">Início no karting</span><br>${esc(p.kartingStartYear||'—')}</div><div><span class="muted">Número</span><br>${esc(p.number||'—')}</div><div><span class="muted">Localidade</span><br>${esc(p.location||'—')}</div><div><span class="muted">Email</span><br>${esc(u?.email||'—')}</div></div>
  ${p.notes?`<div class="help" style="margin-top:12px">${esc(p.notes)}</div>`:''}</div>`;
}
function myEventsPage(){
  const pid=currentPilotId(),cards=[];
  db.championships.forEach(c=>c.races.forEach(r=>{if(!pid||r.pilotIds.includes(pid)||r.days.some(d=>d.sessions.some(s=>s.pilotIds?.includes(pid))))cards.push({c,r})}));
  return header('Os meus eventos','Campeonatos e sessões atribuídas ao piloto.','')+
  '<div class="cards">'+(cards.map(x=>`<div class="cardlink" data-action="pilot-race" data-champ="${x.c.id}" data-race="${x.r.id}"><h3>${esc(x.r.name)}</h3><p>${esc(x.c.name)} · ${esc(x.r.location||'')} · ${esc(x.r.date||'')}</p></div>`).join('')||'<div class="empty">Ainda não tens eventos atribuídos.</div>')+'</div>';
}
function analysisFor(s,pid,index){return s.analyses?.[pid]?.[index]||{}}
function setAnalysis(s,pid,index,data){if(!s.analyses||Array.isArray(s.analyses))s.analyses={};if(!s.analyses[pid])s.analyses[pid]={};s.analyses[pid][index]={...(s.analyses[pid][index]||{}),...data}}
function sessionPilots(s){return (s.pilotIds||[]).map(id=>db.drivers.find(d=>String(d.id)===String(id))).filter(Boolean)}


const IMAGE_DB='pista_coach_images_v1';
function openImageDB(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){reject(new Error('IndexedDB indisponível'));return}
    const req=indexedDB.open(IMAGE_DB,1);
    req.onupgradeneeded=()=>req.result.createObjectStore('images');
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function putImage(id,data){
  try{
    const dbi=await openImageDB();
    await new Promise((resolve,reject)=>{
      const tx=dbi.transaction('images','readwrite');tx.objectStore('images').put(data,id);
      tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
    });
    dbi.close();return true;
  }catch(e){return false}
}
async function getImage(id){
  try{
    const dbi=await openImageDB();
    const value=await new Promise((resolve,reject)=>{
      const tx=dbi.transaction('images','readonly');const req=tx.objectStore('images').get(id);
      req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
    });
    dbi.close();return value||'';
  }catch(e){return ''}
}
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=1800;
        const scale=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*scale));
        c.height=Math.max(1,Math.round(img.height*scale));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg',0.82));
      };
      img.onerror=reject;img.src=reader.result;
    };
    reader.onerror=reject;reader.readAsDataURL(file);
  });
}
async function persistTrackImage(track,data){
  const imageId=track.imageId||('img_'+track.id);
  const ok=await putImage(imageId,data);
  if(ok){
    track.imageId=imageId;
    track.image=data;       // keep it in memory so the editor shows it immediately
    save();                 // save() strips the image bytes from localStorage
    return true;
  }
  track.image=data;
  return save();
}
async function hydrateImages(){
  let changed=false;
  for(const t of db.tracks||[]){
    if(t.imageId){
      const data=await getImage(t.imageId);
      if(data){t.image=data;changed=true;}
    }else if(t.image && t.image.length>100000){
      const id='img_'+t.id;
      if(await putImage(id,t.image)){t.imageId=id;changed=true;}
    }
  }
  if(changed)save();
}

function save(){
  try{
    const payload=JSON.parse(JSON.stringify(db));
    (payload.tracks||[]).forEach(t=>{if(t.imageId)t.image='';});
    localStorage.setItem(KEY,JSON.stringify(payload));
    return true;
  }catch(e){
    toast('Não foi possível guardar os dados locais.');
    return false;
  }
}

function esc(v){
  return String(v??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function toast(text){
  const el=document.createElement('div');
  el.textContent=text;
  el.style.cssText='position:fixed;right:18px;bottom:18px;background:#fff;color:#111;padding:11px 14px;border-radius:8px;font-weight:700;z-index:100';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1600);
}

function header(title,sub,actions=''){
  return `<div class="header"><div><div class="title">${esc(title)}</div><div class="sub">${esc(sub)}</div></div><div>${actions}</div></div>`;
}

function tracksPage(){
  if(!isAdmin())return '<div class="empty">Apenas o administrador pode gerir pistas.</div>';
  return header('Pistas','Imagem + pontos de coaching.',
    '<button class="btn primary" data-action="new-track">+ Nova pista</button>')+
    `<div class="list">${
      db.tracks.map(t=>`<div class="row">
        <div><b>${esc(t.name)}</b><div class="muted">${esc(t.variant)} · ${t.points.length} curvas</div></div>
        <div class="buttons">
          <button class="btn" data-action="edit" data-id="${t.id}">Editar pista</button>
          <button class="btn danger" data-action="delete" data-id="${t.id}">Apagar</button>
        </div>
      </div>`).join('') ||
      '<div class="empty">Ainda não tens pistas.</div>'
    }</div>`;
}

function dashboard(){
  if(!isAdmin())return myEventsPage();
  const totalSessions=db.championships.reduce((n,c)=>n+c.races.reduce((a,r)=>a+r.days.reduce((b,d)=>b+d.sessions.length,0),0),0);
  return header('Dashboard','Visão geral da atividade de coaching.','')+
  `<div class="cards"><div class="card"><div class="muted">Pilotos</div><div class="kpi">${db.drivers.length}</div></div><div class="card"><div class="muted">Campeonatos</div><div class="kpi">${db.championships.length}</div></div><div class="card"><div class="muted">Pistas</div><div class="kpi">${db.tracks.length}</div></div><div class="card"><div class="muted">Sessões</div><div class="kpi">${totalSessions}</div></div></div>
  <div class="sectiontitle">Pilotos da equipa</div><div class="list">${db.drivers.map(driverCard).join('')||'<div class="empty">Ainda não tens pilotos.</div>'}</div>`;
}
function drivers(){
  return header('Pilotos','Só podes adicionar pilotos que já tenham uma conta registada.','<button class="btn primary" data-action="new-driver">+ Adicionar piloto</button>')+
  `<div class="list">${db.drivers.map(driverCard).join('')||'<div class="empty">Ainda não tens pilotos adicionados.</div>'}</div>
  <div class="help" style="margin-top:12px">Cria uma conta de piloto no ecrã de login, preenche o perfil e depois adiciona essa conta aqui.</div>`;
}
function sessions(){
  const rows=db.championships.flatMap(c=>c.races.flatMap(r=>r.days.flatMap(d=>d.sessions.map(s=>({c,r,d,s})))));
  return header('Sessões','Cria uma sessão a partir do campeonato, prova e dia.','<button class="btn primary" data-action="new-session">+ Criar sessão</button>')+
  `<div class="list">${rows.map(x=>`<div class="row"><div><b>${esc(x.s.name)}</b><div class="muted">${esc(x.c.name)} · ${esc(x.r.name)} · ${esc(x.d.name)} · ${x.s.pilotIds?.length||0} pilotos</div></div><button class="btn" data-action="open-session" data-id="${x.s.id}" data-champ="${x.c.id}" data-race="${x.r.id}" data-day="${x.d.id}">Abrir</button></div>`).join('')||'<div class="empty">Ainda não existem sessões.</div>'}</div>`;
}
function editor(){
  const t=db.tracks.find(x=>String(x.id)===String(ui.editor));
  if(!t){ui.page='tracks';return tracksPage();}
  const points=t.points.map((p,i)=>`<button class="point ${ui.selected===i?'selected':''}" data-point="${i}" style="left:${p.x}%;top:${p.y}%" title="Curva ${i+1}">${i+1}</button>`).join('');
  return `<div style="margin-bottom:12px"><button class="btn" data-action="back">← Pistas</button></div>
  ${header('Editar · '+t.name,'Aqui defines apenas os pontos das curvas. Os comentários ficam nas sessões.','<button class="btn primary" data-action="save">Guardar pista</button>')}
  <div class="editor"><div class="panel">
    <div class="card"><h3>Imagem da pista</h3><button class="btn" data-action="image">Carregar imagem</button><input id="file" type="file" accept="image/*" hidden><div class="help">A imagem é a referência visual.</div></div>
    <div class="card"><h3>Pontos das curvas</h3><div class="mode"><button class="btn ${ui.mode==='add'?'selected':''}" data-mode="add">Adicionar</button><button class="btn ${ui.mode==='select'?'selected':''}" data-mode="select">Selecionar</button></div><button class="btn danger" data-action="remove">Apagar selecionado</button><div class="help">Clica na imagem para criar Curva 1, Curva 2, Curva 3...</div></div>
    <div class="card"><h3>Estado</h3><b>${t.points.length}</b> curvas configuradas</div>
  </div><div class="stagebox"><div class="stagehead"><b>${esc(t.name)}</b><span class="muted">${t.points.length} curvas</span></div><div class="stage" id="stage"><div class="image-wrap">${t.image?`<img id="trackImage" class="track-image" src="${t.image}" alt="">`:'<div class="empty" style="margin:auto">Carrega uma imagem da pista</div>'}</div><div class="click-layer" id="clickLayer"></div>${points}</div></div></div>`;
}

function getChamp(){return db.championships.find(c=>String(c.id)===String(ui.championship))}
function getRace(){return getChamp()?.races.find(r=>String(r.id)===String(ui.race))}
function getDay(){return getRace()?.days.find(d=>String(d.id)===String(ui.day))}
function getSession(){return getDay()?.sessions.find(s=>String(s.id)===String(ui.session))}

function championshipsPage(){return header('Campeonatos','Organiza campeonatos e corridas.','<button class="btn primary" data-action="new-championship">+ Adicionar campeonato</button>')+'<div class="cards">'+(db.championships.map(c=>`<div class="cardlink" data-action="open-championship" data-id="${c.id}"><h3>${esc(c.name)}</h3><p>${esc(c.season||'')} · ${c.races.length} corridas</p></div>`).join('')||'<div class="empty">Ainda não tens campeonatos.</div>')+'</div>'}
function championshipPage(){const c=getChamp();return `<div class="breadcrumb"><span data-action="back-championships">Campeonatos</span> › <b>${esc(c.name)}</b></div>`+header(c.name,'Corridas deste campeonato.','<button class="btn primary" data-action="new-race">+ Adicionar corrida</button>')+'<div class="eventgrid">'+(c.races.map(r=>`<div class="eventcard"><h3>${esc(r.name)}</h3><div class="eventmeta">${esc(r.location||'Local por definir')}<br>${esc(r.date||'Data por definir')}<br>${r.days.length} dias</div><div class="buttons"><button class="btn" data-action="open-race" data-id="${r.id}">Abrir corrida</button><button class="btn danger" data-action="delete-race" data-id="${r.id}">Apagar</button></div></div>`).join('')||'<div class="empty">Adiciona a primeira corrida.</div>')+'</div>'}
function racePage(){const c=getChamp(),r=getRace(),ls=[['Live timing',r.links.timing],['Resultados',r.links.results],['Horários',r.links.schedule]].filter(x=>x[1]);return `<div class="breadcrumb"><span data-action="back-championships">Campeonatos</span> › <span data-action="back-races">${esc(c.name)}</span> › <b>${esc(r.name)}</b></div>`+header(r.name,`${esc(r.location)} · ${esc(r.date)}`,'<button class="btn primary" data-action="new-day">+ Adicionar dia</button>')+`<div class="readonly"><b>Links do evento</b><div class="links">${ls.map(x=>`<a href="${esc(x[1])}" target="_blank" rel="noopener">${esc(x[0])}</a>`).join('')||'<span class="muted">Sem links.</span>'}</div></div><div class="sectiontitle">Dias</div><div class="list">`+(r.days.map(d=>`<div class="row"><div><b>${esc(d.name)}</b><div class="muted">${esc(d.date)} · ${d.sessions.length} sessões</div></div><button class="btn" data-action="open-day" data-id="${d.id}">Abrir dia</button></div>`).join('')||'<div class="empty">Adiciona um dia.</div>')+'</div>'}
function dayPage(){const r=getRace(),d=getDay();return `<div class="breadcrumb"><span data-action="back-championships">Campeonatos</span> › <span data-action="back-races">${esc(r.name)}</span> › <b>${esc(d.name)}</b></div>`+header(d.name,`Sessões do dia · ${esc(d.date)}`,'<button class="btn primary" data-action="new-session">+ Adicionar sessão</button>')+'<div class="list">'+(d.sessions.map(s=>`<div class="sessionrow"><div><b>${esc(s.name)}</b><div class="muted">${esc(s.type)} · ${s.trackId?'Pista definida':'Pista por definir'}</div></div><button class="btn" data-action="open-session" data-id="${s.id}">Abrir sessão</button></div>`).join('')||'<div class="empty">Ainda não existem sessões.</div>')+'</div>'}
function sessionPage(){
  const d=getDay(),s=getSession(),track=db.tracks.find(t=>String(t.id)===String(s.trackId)),pilots=sessionPilots(s),pid=ui.sessionPilot||pilots[0]?.id||'',idx=Number.isFinite(ui.sessionPoint)?ui.sessionPoint:0,a=pid&&track?analysisFor(s,pid,idx):{};
  return `<div class="breadcrumb"><span data-action="back-championships">Campeonatos</span> › <span data-action="back-day">${esc(d.name)}</span> › <b>${esc(s.name)}</b></div>`+
  header(s.name,`${esc(s.type||'Sessão')} · ${track?esc(track.name):'Pista por definir'}`,'<button class="btn primary" data-action="configure-session">Configurar sessão</button>')+
  `<div class="grid2"><div class="card"><div class="field"><label>Piloto em análise</label><select id="activePilot">${pilots.map(p=>`<option value="${p.id}" ${String(p.id)===String(pid)?'selected':''}>${esc(p.name)}</option>`).join('')||'<option value="">Nenhum piloto</option>'}</select></div><div class="help">Seleciona o piloto e depois clica numa curva.</div></div><div class="card"><b>Contexto</b><div class="muted">${esc(d.name)} · ${esc(s.type||'Sessão')}</div></div></div>`+
  (track?`<div style="margin-top:14px"><div class="stagebox"><div class="stagehead"><b>${esc(track.name)}</b><span class="muted">${track.points.length} curvas</span></div><div class="stage"><div class="image-wrap"><img class="track-image" src="${track.image}" alt=""></div>${track.points.map((p,i)=>`<button class="point ${i===idx?'selected':''}" style="left:${p.x}%;top:${p.y}%" data-session-point="${i}">${i+1}</button>`).join('')}</div></div></div>
  <div class="card" style="margin-top:14px">${pid?`<h3>Curva ${idx+1}</h3><div class="grid2"><div class="field"><label>Comentário</label><textarea id="analysisComment" rows="5">${esc(a.comment||'')}</textarea></div><div><div class="field"><label>Travagem</label><input id="analysisBraking" value="${esc(a.braking||'')}"></div><div class="field"><label>Entrada</label><input id="analysisEntry" value="${esc(a.entry||'')}"></div><div class="field"><label>Ápex</label><input id="analysisApex" value="${esc(a.apex||'')}"></div><div class="field"><label>Saída</label><input id="analysisExit" value="${esc(a.exit||'')}"></div></div></div><div class="grid2"><div class="field"><label>Trajetória</label><input id="analysisTrajectory" value="${esc(a.trajectory||'')}"></div><div class="field"><label>Erro</label><input id="analysisError" value="${esc(a.error||'')}"></div></div><div class="field"><label>Correção</label><textarea id="analysisCorrection" rows="3">${esc(a.correction||'')}</textarea></div><button class="btn primary" data-action="save-analysis">Guardar análise da curva</button>`:'<div class="empty">Adiciona um piloto à sessão para começar a análise.</div>'}</div>`:'<div class="empty">Esta sessão ainda não tem uma pista associada.</div>');
}
function newChampionship(){modal(`<h2>Adicionar campeonato</h2><div class="field"><label>Nome</label><input id="champName"></div><div class="field"><label>Época</label><input id="champSeason" placeholder="2026"></div><div class="modalactions"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="create-championship">Criar</button></div>`)}
function createChampionship(){const n=document.getElementById('champName').value.trim();if(!n)return;db.championships.push({id:Date.now(),name:n,season:document.getElementById('champSeason').value.trim(),races:[]});save();closeModal();render()}
function newRace(){modal(`<h2>Adicionar corrida</h2><div class="field"><label>Nome</label><input id="raceName" placeholder="Ex.: Ronda 1"></div><div class="field"><label>Kartódromo / local</label><input id="raceLocation"></div><div class="field"><label>Data</label><input id="raceDate" type="date"></div><div class="field"><label>Live timing</label><input id="raceTiming"></div><div class="field"><label>Resultados</label><input id="raceResults"></div><div class="field"><label>Horários</label><input id="raceSchedule"></div><div class="modalactions"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="create-race">Criar</button></div>`)}
function createRace(){const c=getChamp(),n=document.getElementById('raceName').value.trim();if(!n)return;c.races.push({id:Date.now(),name:n,location:document.getElementById('raceLocation').value.trim(),date:document.getElementById('raceDate').value,links:{timing:document.getElementById('raceTiming').value.trim(),results:document.getElementById('raceResults').value.trim(),schedule:document.getElementById('raceSchedule').value.trim()},days:[],pilotIds:[]});save();closeModal();render()}
function newDay(){modal(`<h2>Adicionar dia</h2><div class="field"><label>Nome do dia</label><input id="dayName" placeholder="Ex.: Sexta-feira · Treinos"></div><div class="field"><label>Data</label><input id="dayDate" type="date"></div><div class="modalactions"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="create-day">Criar</button></div>`)}
function createDay(){const r=getRace(),n=document.getElementById('dayName').value.trim();if(!n)return;r.days.push({id:Date.now(),name:n,date:document.getElementById('dayDate').value,sessions:[]});save();closeModal();render()}
function newSession(){
  const races=db.championships.flatMap(c=>c.races.map(r=>({c,r})));
  modal(`<h2>Criar sessão</h2>
    <div class="field"><label>Campeonato</label><select id="sessionChamp"><option value="">Selecionar</option>${db.championships.map(c=>`<option value="${c.id}">${esc(c.name)}${c.season?' · '+esc(c.season):''}</option>`).join('')}</select></div>
    <div class="field"><label>Prova</label><select id="sessionRace"><option value="">Selecionar</option>${races.map(x=>`<option value="${x.r.id}">${esc(x.c.name)} — ${esc(x.r.name)}</option>`).join('')}</select></div>
    <div class="field"><label>Dia</label><select id="sessionDay"><option value="">Selecionar</option>${races.flatMap(x=>x.r.days.map(d=>`<option value="${d.id}">${esc(x.r.name)} — ${esc(d.name)}${d.date?' · '+esc(d.date):''}</option>`)).join('')}</select></div>
    <div class="field"><label>Nome da sessão</label><input id="sessionName" placeholder="Ex.: Treino 1"></div>
    <div class="field"><label>Tipo</label><input id="sessionType" placeholder="Treino / Qualificação / Corrida"></div>
    <div class="field"><label>Pista</label><select id="sessionTrack"><option value="">Selecionar pista</option>${db.tracks.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div>
    <div class="field"><label>Pilotos a analisar</label><div class="checklist">${db.drivers.map(d=>`<label><input type="checkbox" name="newSessionPilot" value="${d.id}"> ${esc(d.name)}</label>`).join('')||'<span class="muted">Adiciona primeiro um piloto.</span>'}</div></div>
    <div class="help">A sessão fica ligada a campeonato → prova → dia → pista. Depois, dentro da sessão, podes selecionar o piloto e analisar cada curva.</div>
    <div class="modalactions"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="create-session">Criar sessão</button></div>`);
}
function createSession(){
  const champId=document.getElementById('sessionChamp').value,raceId=document.getElementById('sessionRace').value,dayId=document.getElementById('sessionDay').value,n=document.getElementById('sessionName').value.trim();
  if(!champId||!raceId||!dayId||!n){toast('Seleciona campeonato, prova, dia e nome da sessão');return}
  const c=db.championships.find(x=>String(x.id)===String(champId)),r=c?.races.find(x=>String(x.id)===String(raceId)),d=r?.days.find(x=>String(x.id)===String(dayId));
  if(!d){toast('Não foi possível encontrar o dia');return}
  const pilotIds=[...document.querySelectorAll('input[name="newSessionPilot"]:checked')].map(x=>x.value);
  const s={id:Date.now(),name:n,type:document.getElementById('sessionType').value.trim(),trackId:document.getElementById('sessionTrack').value||null,pilotIds,analyses:{}};
  d.sessions.push(s);save();closeModal();ui.championship=c.id;ui.race=r.id;ui.day=d.id;ui.session=s.id;ui.page='session';render();
}
function configureSession(){
  const s=getSession();
  modal(`<h2>Configurar sessão</h2><div class="field"><label>Pista</label><select id="cfgTrack"><option value="">Selecionar</option>${db.tracks.map(t=>`<option value="${t.id}" ${String(t.id)===String(s.trackId)?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
  <div class="field"><label>Pilotos desta sessão</label><div class="checklist">${db.drivers.map(d=>`<label><input type="checkbox" name="cfgPilot" value="${d.id}" ${(s.pilotIds||[]).some(id=>String(id)===String(d.id))?'checked':''}> ${esc(d.name)}</label>`).join('')||'<span class="muted">Adiciona primeiro um piloto.</span>'}</div></div>
  <div class="modalactions"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="save-session">Guardar</button></div>`);
}
function saveSession(){
  const s=getSession();s.trackId=document.getElementById('cfgTrack').value||null;s.pilotIds=[...document.querySelectorAll('input[name="cfgPilot"]:checked')].map(x=>x.value);if(!s.analyses)s.analyses={};save();closeModal();render();
}
function pilotRacePage(){
  const c=db.championships.find(x=>String(x.id)===String(ui.championship));
  const r=c?.races.find(x=>String(x.id)===String(ui.race));
  if(!c||!r)return myEventsPage();
  const pilotId=currentPilotId();
  const allowed=!pilotId || r.pilotIds.includes(pilotId);
  if(!allowed)return myEventsPage();
  return `<div class="breadcrumb"><span data-action="pilot-home">Os meus eventos</span> › <b>${esc(r.name)}</b></div>`+
    header(r.name,`${esc(c.name)} · ${esc(r.location||'')} · ${esc(r.date||'')}`,'')+
    '<div class="sectiontitle">Dias</div><div class="list">'+
    (r.days.map(d=>`<div class="row"><div><b>${esc(d.name)}</b><div class="muted">${esc(d.date||'')} · ${d.sessions.length} sessões</div></div><button class="btn" data-action="pilot-day" data-id="${d.id}">Abrir</button></div>`).join('')||'<div class="empty">Ainda não existem sessões.</div>')+
    '</div>';
}
function pilotDayPage(){
  const r=getRace(),d=getDay();
  return `<div class="breadcrumb"><span data-action="pilot-home">Os meus eventos</span> › <span data-action="pilot-race-back">${esc(r.name)}</span> › <b>${esc(d.name)}</b></div>`+
    header(d.name,'Sessões do dia.','')+
    '<div class="list">'+(d.sessions.filter(s=>(s.pilotIds||[]).some(x=>String(x)===String(currentPilotId()))).map(s=>`<div class="sessionrow"><div><b>${esc(s.name)}</b><div class="muted">${esc(s.type||'')}</div></div><button class="btn" data-action="pilot-session" data-id="${s.id}">Abrir</button></div>`).join('')||'<div class="empty">Não tens sessões atribuídas neste dia.</div>')+'</div>';
}
function pilotSessionPage(){
  const s=getSession(),track=db.tracks.find(t=>String(t.id)===String(s.trackId));
  const pid=currentPilotId();
  if(!s || !pid || !(s.pilotIds||[]).some(x=>String(x)===String(pid)))
    return '<div class="empty">Esta sessão não está atribuída à tua conta.</div>';
  if(!track)return '<div class="empty">Esta sessão ainda não tem uma pista associada.</div>';
  const idx=Number.isFinite(ui.sessionPoint)?ui.sessionPoint:0;
  const a=analysisFor(s,pid,idx);
  return `<div class="breadcrumb"><span data-action="pilot-home">Os meus eventos</span> › <b>${esc(s.name)}</b></div>`+
    header(s.name,`${esc(s.type||'Sessão')} · ${esc(track.name)}`,'')+
    `<div class="card"><b>A tua análise</b><div class="help">Seleciona uma curva no mapa para veres o comentário do treinador.</div></div>
    <div style="margin-top:14px"><div class="stagebox"><div class="stagehead"><b>${esc(track.name)}</b><span class="muted">${track.points.length} curvas</span></div><div class="stage"><div class="image-wrap">${track.image?`<img class="track-image" src="${track.image}" alt="">`:'<div class="empty" style="margin:auto">Imagem indisponível</div>'}</div>${track.points.map((p,i)=>`<button class="point ${i===idx?'selected':''}" style="left:${p.x}%;top:${p.y}%" data-session-point="${i}">${i+1}</button>`).join('')}</div></div></div>
    <div class="card" style="margin-top:14px"><h3>Curva ${idx+1}</h3>
      ${a.comment||a.braking||a.entry||a.apex||a.exit||a.trajectory||a.error||a.correction ?
      `<div class="analysisread">
        ${[['Comentário',a.comment],['Travagem',a.braking],['Entrada',a.entry],['Ápex',a.apex],['Saída',a.exit],['Trajetória',a.trajectory],['Erro',a.error],['Correção',a.correction]].filter(x=>x[1]).map(x=>`<div style="margin-bottom:12px"><div class="muted">${x[0]}</div><div>${esc(x[1])}</div></div>`).join('')}
      </div>`:
      '<div class="empty">Ainda não existe análise para esta curva.</div>'}
    </div>`;
}

function render(){
  const app=document.getElementById('app');
  if(currentUser && currentUser.role==='pilot' && !profileComplete(currentUser) && !['profile','register'].includes(ui.page))ui.page='profile';
  if(!currentUser){app.innerHTML=loginPage();document.querySelectorAll('[data-page]').forEach(b=>b.classList.remove('active'));return;}
  if(ui.page==='editor')app.innerHTML=editor();
  else if(ui.page==='dashboard')app.innerHTML=dashboard();
  else if(ui.page==='my-events')app.innerHTML=myEventsPage();
  else if(ui.page==='profile')app.innerHTML=profilePage();
  else if(ui.page==='register')app.innerHTML=registerPage();
  else if(ui.page==='drivers')app.innerHTML=drivers();
  else if(ui.page==='sessions')app.innerHTML=sessions();
  else if(ui.page==='tracks')app.innerHTML=tracksPage();
  else if(ui.page==='championships')app.innerHTML=championshipsPage();
  else if(ui.page==='championship')app.innerHTML=championshipPage();
  else if(ui.page==='race')app.innerHTML=racePage();
  else if(ui.page==='day')app.innerHTML=dayPage();
  else if(ui.page==='session')app.innerHTML=sessionPage();
  else if(ui.page==='pilot-race')app.innerHTML=pilotRacePage();
  else if(ui.page==='pilot-day')app.innerHTML=pilotDayPage();
  else if(ui.page==='pilot-session')app.innerHTML=pilotSessionPage();
  if(currentUser){
    const role=currentUser.role==='admin'?'ADMIN':'PILOTO';
    app.insertAdjacentHTML('afterbegin',`<div class="userbar" style="justify-content:flex-end;margin-bottom:12px"><span>${esc(currentUser.name)}</span><span class="rolebadge">${role}</span><button class="btn" data-action="logout">Sair</button></div>`);
  }
  document.querySelectorAll('[data-page]').forEach(b=>{
    b.classList.toggle('active',b.dataset.page===ui.page);
    const adminOnly=['dashboard','championships','tracks','drivers','sessions'].includes(b.dataset.page);
    if(isAdmin() && b.dataset.page==='profile') b.style.display='none';
    else b.style.display=(!isAdmin()&&adminOnly)?'none':'';
  });
  const side=document.querySelector('.nav');
  if(side && !isAdmin() && !side.querySelector('[data-page="my-events"]')){
    const b=document.createElement('button');b.dataset.page='my-events';b.textContent='Os meus eventos';side.prepend(b);
  }
  if(side && isAdmin()){
    const b=side.querySelector('[data-page="my-events"]');if(b)b.remove();
  }
  if(ui.page==='editor')bindEditor();
}
function modal(content){
  document.getElementById('modal').innerHTML=`<div class="modalbg"><div class="modal">${content}</div></div>`;
}
function closeModal(){document.getElementById('modal').innerHTML=''}

function newTrack(){
  modal(`<h2>Nova pista</h2>
    <div class="field"><label>Nome</label><input id="trackName" placeholder="Ex.: Viana"></div>
    <div class="field"><label>Variante</label><input id="trackVariant" value="Karting"></div>
    <div class="modalactions"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="create-track">Criar</button></div>`);
}

function createTrack(){
  const name=document.getElementById('trackName').value.trim();
  if(!name)return;
  const t={
    id:Date.now(),
    name,
    variant:document.getElementById('trackVariant').value.trim()||'Karting',
    image:'',
    points:[]
  };
  db.tracks.push(t);save();closeModal();
  ui.page='editor';ui.editor=t.id;ui.mode='add';ui.selected=null;render();
}

function bindEditor(){
  const t=db.tracks.find(x=>String(x.id)===String(ui.editor));
  const stage=document.getElementById('stage');
  const layer=document.getElementById('clickLayer');
  const image=document.getElementById('trackImage');
  if(!t||!stage||!layer)return;

  const file=document.getElementById('file');
  if(file){
    file.onchange=()=>{
      const f=file.files[0];
      if(!f)return;
      compressImage(f).then(async data=>{
        const ok=await persistTrackImage(t,data);
        if(ok){render();toast('Imagem carregada e guardada');}
        else toast('Não foi possível guardar a imagem');
      }).catch(()=>toast('Não foi possível ler a imagem'));
    };
  }

  layer.onclick=(event)=>{
    if(ui.mode!=='add')return;
    if(!image){
      toast('Carrega primeiro uma imagem.');
      return;
    }

    const imageRect=image.getBoundingClientRect();
    const stageRect=stage.getBoundingClientRect();

    // Only accept clicks inside the visible image.
    if(event.clientX<imageRect.left || event.clientX>imageRect.right ||
       event.clientY<imageRect.top || event.clientY>imageRect.bottom)return;

    // Points are positioned relative to the whole stage, so calculate
    // their coordinates from the stage, not from the image.
    const x=((event.clientX-stageRect.left)/stageRect.width)*100;
    const y=((event.clientY-stageRect.top)/stageRect.height)*100;

    t.points.push({
      id:'p'+Date.now(),
      x,y,
      comment:'',braking:'',entry:'',apex:'',exit:'',
      trajectory:'',error:'',correction:''
    });

    ui.selected=t.points.length-1;
    save();
    render();
  };

  // Make image itself non-interactive; points are separate buttons.
  if(image)image.draggable=false;
}

document.addEventListener('change',event=>{
  if(event.target.id==='activePilot'){ui.sessionPilot=event.target.value;ui.sessionPoint=0;render();}
});
document.addEventListener('click',event=>{

  const page=event.target.closest('[data-page]');
  if(page){
    ui.page=page.dataset.page;ui.editor=null;ui.selected=null;render();return;
  }

  const mode=event.target.closest('[data-mode]');
  if(mode){ui.mode=mode.dataset.mode;render();return;}

  const sessionPoint=event.target.closest('[data-session-point]');
  if(sessionPoint){ui.sessionPoint=Number(sessionPoint.dataset.sessionPoint);render();return;}
  const point=event.target.closest('[data-point]');
  if(point){
    ui.selected=Number(point.dataset.point);
    ui.mode='select';
    render();
    return;
  }

  const action=event.target.closest('[data-action]');
  if(!action)return;
  const protectedActions=['new-track','create-track','delete','new-championship','create-championship','new-race','create-race','new-day','create-day','new-session','create-session','configure-session','save-session','edit','image','remove'];
  if(!isAdmin()&&protectedActions.includes(action.dataset.action)){toast('Acesso reservado ao administrador');return;}

  switch(action.dataset.action){
    case 'login':login();break;
    case 'go-register':ui.page='register';render();break;
    case 'back-login':ui.page='login';render();break;
    case 'register-pilot':registerPilot();break;
    case 'save-profile':saveProfile();break;
    case 'save-analysis':{
      const s=getSession(),pid=ui.sessionPilot||document.getElementById('activePilot')?.value;
      if(!pid){toast('Seleciona um piloto');break}
      setAnalysis(s,pid,ui.sessionPoint||0,{comment:document.getElementById('analysisComment').value,braking:document.getElementById('analysisBraking').value,entry:document.getElementById('analysisEntry').value,apex:document.getElementById('analysisApex').value,exit:document.getElementById('analysisExit').value,trajectory:document.getElementById('analysisTrajectory').value,error:document.getElementById('analysisError').value,correction:document.getElementById('analysisCorrection').value});
      save();toast('Análise guardada');render();break;
    }
    case 'logout':logout();break;
    case 'pilot-home':ui.page='my-events';render();break;
    case 'pilot-race-back':ui.page='pilot-race';render();break;
    case 'pilot-race':ui.page='pilot-race';ui.championship=action.dataset.champ;ui.race=action.dataset.race;render();break;
    case 'pilot-day':ui.page='pilot-day';ui.day=action.dataset.id;render();break;
    case 'pilot-session':ui.page='pilot-session';ui.session=action.dataset.id;render();break;
    case 'new-championship':newChampionship();break;
    case 'create-championship':createChampionship();break;
    case 'open-championship':ui.page='championship';ui.championship=action.dataset.id;render();break;
    case 'back-championships':ui.page='championships';render();break;
    case 'back-championship':ui.page='championship';render();break;
    case 'new-race':newRace();break;
    case 'create-race':createRace();break;
    case 'open-race':ui.page='race';ui.race=action.dataset.id;render();break;
    case 'back-races':ui.page='championship';render();break;
    case 'delete-race':{const c=getChamp();c.races=c.races.filter(r=>String(r.id)!==String(action.dataset.id));save();render();break;}
    case 'new-day':newDay();break;
    case 'create-day':createDay();break;
    case 'open-day':ui.page='day';ui.day=action.dataset.id;render();break;
    case 'back-day':ui.page='day';render();break;
    case 'new-session':newSession();break;
    case 'create-session':createSession();break;
    case 'open-session':ui.page='session';ui.session=action.dataset.id;if(action.dataset.champ)ui.championship=action.dataset.champ;if(action.dataset.race)ui.race=action.dataset.race;if(action.dataset.day)ui.day=action.dataset.day;render();break;
    case 'configure-session':configureSession();break;
    case 'save-session':saveSession();break;
    case 'new-track':newTrack();break;
    case 'create-track':createTrack();break;
    case 'new-driver':newDriver();break;
    case 'create-driver':createDriver();break;
    case 'close':closeModal();break;
    case 'edit':
      ui.page='editor';ui.editor=action.dataset.id;ui.mode='add';ui.selected=null;render();break;
    case 'back':
      ui.page='tracks';ui.editor=null;ui.selected=null;render();break;
    case 'image':
      document.getElementById('file').click();break;
    case 'save':
      save();toast('Pista guardada');break;
    case 'remove':{
      const t=db.tracks.find(x=>String(x.id)===String(ui.editor));
      if(ui.selected==null){toast('Seleciona primeiro uma curva');break;}
      t.points.splice(ui.selected,1);
      ui.selected=t.points.length?Math.min(ui.selected,t.points.length-1):null;
      save();render();break;
    }
    case 'delete':
      if(confirm('Apagar esta pista?')){
        db.tracks=db.tracks.filter(t=>String(t.id)!==String(action.dataset.id));
        save();render();
      }
      break;
    case 'save-comment':{
      const t=db.tracks.find(x=>String(x.id)===String(ui.editor));
      const p=t?.points?.[ui.selected];
      if(!p)break;
      p.comment=document.getElementById('comment').value;
      p.braking=document.getElementById('braking').value;
      p.entry=document.getElementById('entry').value;
      p.apex=document.getElementById('apex').value;
      p.exit=document.getElementById('exit').value;
      p.trajectory=document.getElementById('trajectory').value;
      p.error=document.getElementById('error').value;
      p.correction=document.getElementById('correction').value;
      save();toast('Comentário guardado');break;
    }
  }
});

restoreUser();
syncPilotLinks();
if(currentUser)ui.page=isAdmin()?'dashboard':(profileComplete(freshCurrentUser())?'my-events':'profile');else ui.page='login';
render();
hydrateImages().then(()=>{if(currentUser)render();});
</script>
