<style>
:root{--bg:#080909;--panel:#101112;--panel2:#151617;--panel3:#1b1c1e;--line:#2a2c2f;--line2:#36383b;--text:#f3f3f3;--muted:#8d9094;--soft:#c7c9cc;--accent:#ffffff;--danger:#ff8b8b}

.btn{background:#171819;color:#eee;border:1px solid #303235;border-radius:6px;padding:9px 13px;font-size:12px;font-weight:700;letter-spacing:.02em;transition:.15s}.btn:hover{background:#222426;border-color:#505256}.btn.primary{background:#f1f1f1;color:#0b0b0c;border-color:#f1f1f1;font-weight:800}.btn.primary:hover{background:#fff}.btn.danger{color:var(--danger);border-color:#593636}.buttons{display:flex;gap:8px;flex-wrap:wrap}
.list{display:grid;gap:8px}.row{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:15px;transition:.15s}.row:hover{border-color:#45474a;background:#121314}
.empty{padding:42px;text-align:center;border:1px dashed #303235;border-radius:8px;color:var(--muted);background:#0c0d0e}
.editor{display:grid;grid-template-columns:255px 1fr;gap:14px}.panel{display:grid;gap:10px;align-content:start}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}.card h3{font-size:13px;margin:0 0 10px}.card .btn{width:100%;margin-bottom:7px}.help{font-size:11px;color:var(--muted);line-height:1.5}.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px}.mode .btn.selected{background:#eee;color:#111}
.stagebox{background:#0b0c0d;border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 20px 50px #0005}.stagehead{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;background:#111213}.stage{height:calc(100vh - 170px);min-height:520px;position:relative;overflow:hidden;background:#0b0c0d;touch-action:none}.image-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}.track-image{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none;pointer-events:none}.point{position:absolute;width:31px;height:31px;border-radius:50%;transform:translate(-50%,-50%);background:#f2f2f2;color:#111;border:2px solid #111;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:850;z-index:5;box-shadow:0 3px 10px #000a}.point.selected{background:#fff;outline:2px solid #fff;outline-offset:2px}.point.added{cursor:pointer}.click-layer{position:absolute;inset:0;z-index:2}.comments{position:absolute;right:12px;top:12px;width:300px;max-height:calc(100% - 24px);overflow:auto;background:#111213f2;border:1px solid #383a3d;border-radius:8px;padding:13px;z-index:10;box-shadow:0 15px 35px #0009}.comments h3{margin:0 0 10px}
.field{display:grid;gap:5px;margin-bottom:9px}.field label{font-size:11px;color:#aeb0b4;font-weight:700;text-transform:uppercase;letter-spacing:.07em}.field input,.field textarea,.field select{width:100%;background:#1a1b1d;color:#f5f5f5;border:1px solid #35373a;border-radius:6px;padding:8px}.field input:focus,.field textarea:focus,.field select:focus{outline:1px solid #777;outline-offset:1px}.field textarea{min-height:65px;resize:vertical}
.score-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:10px}.score-group{background:#18191b;border:1px solid #2e3033;border-radius:7px;padding:8px 9px;min-width:0}.score-field{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0}.score-field label{font-weight:700;font-size:12px;line-height:1.2;min-width:0;color:#e8e8e9}.score-help{display:block;color:#777b80;font-size:9px;font-weight:500;margin-top:3px;white-space:nowrap}.score-select{width:62px!important;min-width:62px;flex:0 0 62px;padding:4px 5px!important;height:31px;background:#25272a!important;border-color:#44474b!important;color:#fff!important}.score-section-title{font-size:11px;font-weight:850;margin:0 0 7px;text-transform:uppercase;letter-spacing:.08em;color:#c8c9cb}.analysis-layout{display:block}.analysis-comment{margin-top:10px}.analysis-comment textarea{min-height:95px}
.modalbg{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;padding:20px;z-index:40}.modal{background:#121314;border:1px solid #393b3e;border-radius:9px;padding:20px;width:min(600px,100%);box-shadow:0 30px 80px #000}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.breadcrumb{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;margin-bottom:14px}.breadcrumb [data-action]{cursor:pointer}.breadcrumb b{color:#fff}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}.cardlink,.eventcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:15px;transition:.15s}.cardlink{cursor:pointer}.cardlink:hover{border-color:#55585c;transform:translateY(-1px)}.cardlink h3,.eventcard h3{margin:0 0 7px}.cardlink p,.eventmeta{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.eventgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}.links{display:grid;gap:6px;margin-top:10px}.links a{color:#eee;text-decoration:none;border:1px solid #303235;border-radius:6px;padding:8px 10px;background:#18191b;font-size:12px}.sessionrow{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}.sectiontitle{font-size:15px;font-weight:850;margin:24px 0 10px}.readonly{background:#111213;border:1px solid var(--line);border-radius:8px;padding:15px}.kpi{font-size:31px;font-weight:900;letter-spacing:-.04em}.checklist{display:grid;gap:7px}.checklist label{padding:8px;border:1px solid #2d2f32;border-radius:6px;background:#151617}.userbar{display:flex;align-items:center;gap:10px}.rolebadge{font-size:10px;padding:4px 7px;border-radius:999px;background:#242629;color:#d9dbdd;text-transform:uppercase;letter-spacing:.07em}.loginbox{width:min(420px,100%)}.loginbox h1{margin-top:0}.account-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px;margin-top:9px}
.kpi-card{background:linear-gradient(145deg,#151617,#0f1011);border:1px solid #2c2e31;border-radius:8px;padding:18px;position:relative;overflow:hidden}.kpi-card:after{content:"";position:absolute;right:-25px;top:-35px;width:100px;height:100px;border:1px solid #3b3d40;transform:rotate(45deg);opacity:.25}.kpi-label{font-size:10px;color:#85898d;text-transform:uppercase;letter-spacing:.1em;font-weight:800}.kpi-value{font-size:32px;font-weight:900;margin-top:5px;letter-spacing:-.05em}
@media(max-width:1000px){.score-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:850px){.sidebar{width:68px;padding:14px 7px}.logo{font-size:0;text-align:center}.logo:after{content:"MP";font-size:18px}.logo span{display:none}.nav button{font-size:0;text-align:center}.nav button:before{left:2px}main{margin-left:68px;padding:20px 16px 40px}.editor{grid-template-columns:1fr}.stage{height:65vh;min-height:430px}.comments{left:12px;right:12px;width:auto}}@media(max-width:600px){.score-grid{grid-template-columns:1fr}.header{align-items:flex-start;flex-direction:column}.title{font-size:24px}}

/* MPRacingDevelopment mobile ergonomics */
@media(max-width:700px){
  .sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:66px;padding:6px 8px;background:rgba(8,9,10,.98);border-right:0;border-top:1px solid #2a2c2f;box-shadow:0 -12px 30px #0009;z-index:60}
  .logo{display:none}
  .nav{height:100%;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;align-items:stretch}
  .nav button{font-size:9px!important;text-align:center;padding:8px 2px 7px;border-radius:6px;line-height:1.1;color:#8d9094}
  .nav button:before{display:none}
  .nav button.active,.nav button:hover{background:#1a1b1d;color:#fff}
  main{margin-left:0;padding:18px 12px 88px;max-width:none}
  .userbar{position:sticky;top:0;z-index:25;background:#080909e8;padding:7px 0;margin-bottom:12px!important;backdrop-filter:blur(10px)}
  .header{gap:10px;margin-bottom:16px;padding-bottom:12px}
  .title{font-size:22px}
  .sub{font-size:11px;line-height:1.45}
  .buttons{width:100%}
  .buttons .btn{flex:1;min-width:0}
  .row{align-items:flex-start;flex-direction:column}

  .stage{height:56vh;min-height:360px}
  .comments{position:relative;left:auto;right:auto;top:auto;width:auto;max-height:none;margin-top:10px}

}

.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#25272a;border:1px solid #3a3c40;display:flex;align-items:center;justify-content:center;font-weight:850;color:#fff;overflow:hidden}.avatar.sm{width:34px;height:34px;font-size:11px}.avatar img{width:100%;height:100%;object-fit:cover}.pilot-picker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.pilot-option{display:flex;align-items:center;gap:9px;padding:8px 9px;background:#151617;border:1px solid #2d2f32;border-radius:7px;cursor:pointer}.pilot-option:hover{border-color:#55585c;background:#1a1b1d}.pilot-option input{accent-color:#fff}.pilot-option .pilot-meta{min-width:0}.pilot-option b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pilot-option span{display:block;font-size:10px;color:#7f8388;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.category-group{margin-bottom:18px}.category-title{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:#aeb0b4;margin:0 0 8px}.category-title:after{content:'';height:1px;background:#282a2d;flex:1}.session-template-tools{display:flex;gap:7px;align-items:end}.session-template-tools .field{flex:1;margin-bottom:0}.profile-photo-row{display:flex;align-items:center;gap:14px;padding:10px;background:#151617;border:1px solid #2d2f32;border-radius:7px;margin-bottom:12px}.account-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
</style>

<body>
<aside class="sidebar">
<div class="logo">MP<span>RacingDevelopment</span></div>
<div class="nav">
<button data-page="dashboard">Dashboard</button>
<button data-page="drivers">Pilotos</button>
<button data-page="tracks">Pistas</button>
<button data-page="championships">Campeonatos</button>
<button data-page="sessions">Sessões</button>
<button data-page="profile">Meu perfil</button>
</div>
</aside>
<main id="app"></main><div id="modal"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';

const SUPABASE_URL='https://untypzlxsscrabhqryga.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_jKsTUVb5fbCoYkXEFkCKdw_Z3hGxUdu';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const KEY='mpracingdevelopment_cloud';
const LEGACY_KEYS=['mpracingdevelopment_v27','mpracingdevelopment_v26','mpracingdevelopment_v25','pista_coach_v24','pista_coach_v23','pista_coach_v22','pista_coach_v21','pista_coach_v20','pista_coach_v19','pista_coach_v18','pista_coach_v17','pista_coach_v16'];
let db=normalize({});
let ui={page:'dashboard',editor:null,mode:'add',selected:null,championship:null,race:null,day:null,session:null};
let currentUser=null;
let profileCache=[];
let cloudReady=false;
let cloudStateExists=false;
let localLegacyDb=null;

function normalizeProfile(row){
  if(!row)return null;
  const p=row.profile||{};
  p.category=normalizeCategory(p.category);
  return {id:row.id,name:row.name||p.name||row.email?.split('@')[0]||'Utilizador',email:(row.email||'').toLowerCase(),role:row.role||'pilot',pilotId:row.pilot_id||null,profile:p};
}
function users(){return profileCache.slice()}
function isAdmin(){return currentUser?.role==='admin'}
function freshCurrentUser(){return currentUser}
function currentPilotId(){return freshCurrentUser()?.pilotId||null}
const PILOT_CATEGORIES=['Cadete','Mini','Junior','Sénior','DD2','Shifter'];
const DEFAULT_SESSION_TEMPLATES=['Treino 1','Treino 2','Treino 3','Qualificação','Corrida'];
function normalizeCategory(v){const x=String(v||'').trim();return x==='Senior'?'Sénior':(PILOT_CATEGORIES.includes(x)?x:'')}
function sessionTemplates(){return Array.isArray(db.sessionTemplates)&&db.sessionTemplates.length?db.sessionTemplates:DEFAULT_SESSION_TEMPLATES.slice()}
function avatarHtml(p,sm=false){const name=p?.name||'P';const letter=esc(name.trim().charAt(0).toUpperCase()||'P');return p?.photo?`<span class="avatar ${sm?'sm':''}"><img src="${p.photo}" alt=""></span>`:`<span class="avatar ${sm?'sm':''}">${letter}</span>`}
function profileComplete(u){return !!(u&&u.role==='pilot'&&u.profile&&u.profile.name&&u.profile.age!==''&&u.profile.kartingStartYear!==''&&normalizeCategory(u.profile.category))}

function localLegacyLoad(){
  try{
    let legacyUsers=[];
    for(const key of ['mpracingdevelopment_v26_users','pista_coach_v20_users','pista_coach_v19_users','pista_coach_v18_users','pista_coach_v17_users','pista_coach_v16_users','pista_coach_v15_users','pista_coach_v14_users','pista_coach_v13_users']){
      const raw=localStorage.getItem(key);if(raw){try{legacyUsers=JSON.parse(raw);break}catch(e){}}
    }
    for(const key of LEGACY_KEYS){const raw=localStorage.getItem(key);if(raw){localLegacyDb=normalize(JSON.parse(raw));break;}}
    if(localLegacyDb){
      const byId=new Map((Array.isArray(legacyUsers)?legacyUsers:[]).map(u=>[String(u.id),u]));
      (localLegacyDb.drivers||[]).forEach(d=>{const u=byId.get(String(d.userId));if(u)d.email=(u.email||'').toLowerCase();});
    }
  }catch(e){}
  return localLegacyDb;
}

async function loadCloudState(){
  const {data,error}=await sb.from('app_state').select('data').eq('id','main').maybeSingle();
  if(error){console.error(error);toast('Erro a carregar os dados online. Verifica a configuração do Supabase.');return false;}
  cloudStateExists=!!data;
  db=normalize(data?.data||{});
  return true;
}
async function loadProfiles(){
  if(!currentUser)return false;
  // First load the authenticated user's own profile so the real role is known.
  const own=await sb.from('profiles').select('*').eq('id',currentUser.id).maybeSingle();
  if(own.error){console.error(own.error);toast('Erro a carregar a conta.');return false;}
  const ownProfile=normalizeProfile(own.data);
  if(ownProfile){
    currentUser=ownProfile;
    profileCache=[ownProfile];
  }
  // Once the real role is known, an admin can load all pilot accounts.
  if(currentUser?.role==='admin'){
    const all=await sb.from('profiles').select('*').order('created_at',{ascending:true});
    if(all.error){console.error(all.error);toast('Erro a carregar as contas de piloto.');return false;}
    profileCache=(Array.isArray(all.data)?all.data:[]).map(normalizeProfile).filter(Boolean);
    currentUser=profileCache.find(x=>String(x.id)===String(currentUser.id))||currentUser;
  }
  return true;
}
async function save(){
  if(!isAdmin())return false;
  try{
    const payload=JSON.parse(JSON.stringify(db));
    const {error}=await sb.from('app_state').upsert({id:'main',data:payload,updated_at:new Date().toISOString()});
    if(error){console.error(error);toast('Não foi possível guardar os dados online.');return false;}
    cloudStateExists=true;
    return true;
  }catch(e){console.error(e);toast('Não foi possível guardar os dados online.');return false;}
}
async function importLegacyIfNeeded(){
  if(!isAdmin()||cloudStateExists||!localLegacyDb)return;
  const imported=JSON.parse(JSON.stringify(localLegacyDb));
  db=normalize(imported);
  await save();
  toast('Dados deste dispositivo importados para a nuvem.');
}
async function autoLinkPilot(){
  if(!currentUser||isAdmin()||currentUser.pilotId||!db.drivers?.length)return;
  const match=db.drivers.find(d=>d.email&&String(d.email).toLowerCase()===String(currentUser.email).toLowerCase());
  if(!match)return;
  const {error}=await sb.from('profiles').update({pilot_id:match.id,updated_at:new Date().toISOString()}).eq('id',currentUser.id);
  if(error){console.error(error);return;}
  await loadProfiles();
}

async function bootCloud(){
  localLegacyLoad();
  const {data:{session}}=await sb.auth.getSession();
  if(session?.user){
    currentUser={id:session.user.id,email:session.user.email||'',role:'pilot',name:session.user.email||'Piloto',pilotId:null,profile:null};
    await loadProfiles();
    await loadCloudState();
    await importLegacyIfNeeded();
    await autoLinkPilot();
    if(isAdmin()) await loadProfiles();
    ui.page=isAdmin()?'dashboard':(profileComplete(currentUser)?'my-events':'profile');
  }else{
    currentUser=null;db=normalize({});ui.page='login';
  }
  cloudReady=true;render();
}

function subscribeAuth(){
  sb.auth.onAuthStateChange(async (event,session)=>{
    if(event==='SIGNED_OUT'){currentUser=null;profileCache=[];db=normalize({});ui.page='login';render();return;}
    if(session?.user && ['INITIAL_SESSION','SIGNED_IN','TOKEN_REFRESHED','USER_UPDATED'].includes(event)){
      currentUser={id:session.user.id,email:session.user.email||'',role:'pilot',name:session.user.user_metadata?.name||session.user.email||'Piloto',pilotId:null,profile:null};
      await loadProfiles();
      await loadCloudState();
      await importLegacyIfNeeded();
      await autoLinkPilot();
      ui.page=isAdmin()?'dashboard':(profileComplete(currentUser)?'my-events':'profile');
      render();
    }
  });
}

function normalize(raw){
  raw=raw||{};
  const tracks=Array.isArray(raw.tracks)?raw.tracks.map((t,i)=>{
    const source=Array.isArray(t.points)?t.points:[];
    const points=source.map((pt,j)=>({
      id:pt.id||('p'+Date.now()+j),
      x:Number(pt.x!=null?pt.x:pt[0])||0,
      y:Number(pt.y!=null?pt.y:pt[1])||0,
      comment:pt.comment||'',
      braking:pt.braking||'',
      entry:pt.entry||'',
      apex:pt.apex||'',
      exit:pt.exit||'',
      trajectory:pt.trajectory||'',
      error:pt.error||'',
      correction:pt.correction||''
    }));
    return {
      id:t.id||Date.now()+i,
      name:t.name||('Pista '+(i+1)),
      variant:t.variant||'Karting',
      imageId:t.imageId||null,
      image:t.image||t.background||'',
      pointSpace:t.pointSpace||'image',
      points
    };
  }):[];
  const championships=Array.isArray(raw.championships)?raw.championships.map((c,i)=>({
    id:c.id||Date.now()+i,
    name:c.name||('Campeonato '+(i+1)),
    season:c.season||'',
    races:Array.isArray(c.races)?c.races.map((r,j)=>({
      id:r.id||Date.now()+j,
      name:r.name||('Corrida '+(j+1)),
      location:r.location||'',
      date:r.date||'',
      links:{timing:r.links?.timing||'',results:r.links?.results||'',schedule:r.links?.schedule||''},
      days:Array.isArray(r.days)?r.days.map((d,k)=>({
        id:d.id||Date.now()+k,
        name:d.name||('Dia '+(k+1)),

          pilotIds:Array.isArray(sess.pilotIds)?sess.pilotIds:[],
          analyses:sess.analyses||{},
          generalAnalysis:sess.generalAnalysis||{}
        })):[]
      })):[],
      pilotIds:Array.isArray(r.pilotIds)?r.pilotIds:[]
    })):[]
  })):[];
  return {
    tracks,
    drivers:Array.isArray(raw.drivers)?raw.drivers.map(d=>({...d,
      id:d.id||Date.now(),
      name:d.name||'Piloto',
      userId:d.userId||null,

      team:d.team||'',
      number:d.number||'',
      location:d.location||'',
      notes:d.notes||'',
      photo:d.photo||''
    })):[],
    championships,
    sessions:Array.isArray(raw.sessions)?raw.sessions:[],
    sessionTemplates:Array.isArray(raw.sessionTemplates)&&raw.sessionTemplates.length?raw.sessionTemplates:DEFAULT_SESSION_TEMPLATES.slice()
  };
}

function load(){
  try{
    const existing=localStorage.getItem(KEY);
    if(existing) return normalize(JSON.parse(existing));
  }catch(e){}

  // V26 migration: use V25 as the primary state, and only use older versions
  // to restore missing point/image data for tracks that still exist. Never
  // resurrect tracks that were deleted from the current state.
  const sources=['mpracingdevelopment_v25','pista_coach_v24','pista_coach_v23','pista_coach_v22','pista_coach_v21','pista_coach_v20','pista_coach_v19','pista_coach_v16'];
  let base=null;
  for(const key of sources){
    try{const raw=localStorage.getItem(key);if(raw){base=normalize(JSON.parse(raw));break;}}catch(e){}
  }
  if(!base) base=normalize({});

  // Recover points/images for tracks that exist in the current base. Do not
  // re-add missing tracks: absence is treated as an intentional deletion.
  const byName=new Map();
  for(const key of sources.slice(1)){
    try{
      const raw=localStorage.getItem(key); if(!raw) continue;
      const old=normalize(JSON.parse(raw));
      for(const t of old.tracks||[]) byName.set(String(t.name).trim().toLowerCase(),t);
    }catch(e){}
  }
  base.tracks=(base.tracks||[]).map(t=>{
    const old=byName.get(String(t.name||'').trim().toLowerCase());
    if(old){
      if((!t.points||!t.points.length) && old.points?.length) t.points=old.points;
      if(!t.imageId && old.imageId) t.imageId=old.imageId;
      if((!t.image||t.image.length<100) && old.image) t.image=old.image;
      if(old.pointSpace==='image') t.pointSpace='image';
    }
    return t;
  });
  base.tracks.forEach(t=>{ if(t.points?.length) t.pointSpace='image'; });
  try{ const deleted=JSON.parse(localStorage.getItem(DELETED_TRACKS_KEY)||'[]'); const ids=new Set(deleted.map(x=>String(x.id))); base.tracks=base.tracks.filter(t=>!ids.has(String(t.id))); }catch(e){}
  try{localStorage.setItem(KEY,JSON.stringify(base));localStorage.setItem(DELETED_TRACKS_KEY,'[]');}catch(e){}
  return base;
}

const SCORE_WEIGHTS={rotation:22,braking:18,inTrajectory:14,midTrajectory:14,outTrajectory:12,insertion:12,acceleration:8};
function analysisFor(s,pid,index){return s.analyses?.[pid]?.[index]||{}}
function setAnalysis(s,pid,index,data){if(!s.analyses||Array.isArray(s.analyses))s.analyses={};if(!s.analyses[pid])s.analyses[pid]={};s.analyses[pid][index]={...(s.analyses[pid][index]||{}),...data}}
function metricScore(v){const n=Number(v);return Number.isFinite(n)?Math.max(0,10-Math.abs(Math.max(-10,Math.min(10,n)))):null}
function curveScore(a){
  if(!a)return null;
  const vals=[
    ['rotation',metricScore(a.rotation),SCORE_WEIGHTS.rotation],
    ['braking',metricScore(a.braking),SCORE_WEIGHTS.braking],
    ['inTrajectory',Number(a.inTrajectory),SCORE_WEIGHTS.inTrajectory],
    ['midTrajectory',Number(a.midTrajectory),SCORE_WEIGHTS.midTrajectory],
    ['outTrajectory',Number(a.outTrajectory),SCORE_WEIGHTS.outTrajectory],
    ['insertion',metricScore(a.insertion),SCORE_WEIGHTS.insertion],
    ['acceleration',metricScore(a.acceleration),SCORE_WEIGHTS.acceleration]
  ].filter(x=>Number.isFinite(x[1]));
  if(!vals.length)return null;
  const weight=vals.reduce((n,x)=>n+x[2],0);
  return weight?vals.reduce((n,x)=>n+x[1]*x[2],0)/weight:null;
}
function sessionScore(s,pid){
  const entries=Object.values(s.analyses?.[pid]||{}).map(curveScore).filter(v=>v!=null);
  return entries.length?entries.reduce((a,b)=>a+b,0)/entries.length:null;
}

}

function positionMapPoints(){
  const stage=document.getElementById('stage');
  const image=document.getElementById('trackImage');
  if(!stage||!image)return;
  const track=db.tracks.find(x=>String(x.id)===String(ui.editor));
  const s=getSession();
  const trackForSession=ui.page==='session'&&s?db.tracks.find(t=>String(t.id)===String(s.trackId)):null;
  const pilotSession=getSession();
  const trackForPilot=ui.page==='pilot-session'&&pilotSession?db.tracks.find(t=>String(t.id)===String(pilotSession.trackId)):null;
  const t=track||trackForSession||trackForPilot||db.tracks.find(x=>x.points?.length&&x.image);
  if(!t||!t.points?.length)return;
  // Points are stored as percentages of the ORIGINAL rendered image, never of the stage.
  // Calculate their position from the image's actual bounding box so Admin and Pilot use
  // exactly the same reference rectangle even when the image is resized/centered.
  const ir=image.getBoundingClientRect(),sr=stage.getBoundingClientRect();
  if(!ir.width||!ir.height)return;
  const ox=ir.left-sr.left,oy=ir.top-sr.top;
  const place=(el,p)=>{
    const x=ox+(Number(p.x)||0)/100*ir.width;
    const y=oy+(Number(p.y)||0)/100*ir.height;
    el.style.left=`${x}px`;
    el.style.top=`${y}px`;
  };
  stage.querySelectorAll('[data-map-point]').forEach((el,i)=>{ if(t.points[i])place(el,t.points[i]); });
}

function migrateLegacyTrackPoints(t){
  if(!t||t.pointSpace==='image')return false;
  const stage=document.getElementById('stage'),image=document.getElementById('trackImage');
  if(!stage||!image||!image.complete)return false;
  const ir=image.getBoundingClientRect(),sr=stage.getBoundingClientRect();
  if(!ir.width||!ir.height)return false;
  t.points.forEach(p=>{p.x=Math.max(0,Math.min(100,((Number(p.x)/100*sr.width-(ir.left-sr.left))/ir.width)*100));p.y=Math.max(0,Math.min(100,((Number(p.y)/100*sr.height-(ir.top-sr.top))/ir.height)*100));});
  t.pointSpace='image';save();return true;
}

async function createSession(){
  const champId=document.getElementById('sessionChamp').value,raceId=document.getElementById('sessionRace').value,dayId=document.getElementById('sessionDay').value,n=document.getElementById('sessionTemplate').value;
  if(!champId||!raceId||!dayId||!n){toast('Seleciona campeonato, prova, dia e nome da sessão');return}
  const c=db.championships.find(x=>String(x.id)===String(champId)),r=c?.races.find(x=>String(x.id)===String(raceId)),d=r?.days.find(x=>String(x.id)===String(dayId));
  if(!d){toast('Não foi possível encontrar o dia');return}
  const pilotIds=[...document.querySelectorAll('input[name="newSessionPilot"]:checked')].map(x=>String(x.value));
  const s={id:Date.now(),name:n,type:'',trackId:document.getElementById('sessionTrack').value||null,pilotIds,analyses:{}};
  d.sessions.push(s);
  // Keep the race-level assignment in sync immediately, so pilot accounts can see the event.
  const racePilotIds=new Set((r.pilotIds||[]).map(x=>String(x)));
  pilotIds.forEach(id=>racePilotIds.add(String(id)));
  r.pilotIds=[...racePilotIds];
  await save();closeModal();ui.championship=c.id;ui.race=r.id;ui.day=d.id;ui.session=s.id;ui.page='session';render();
}

function pilotDayPage(){
  const r=getRace(),d=getDay(),pid=currentPilotId();
  if(!r||!d||!pid)return myEventsPage();
  return `<div class="breadcrumb"><span data-action="pilot-home">Os meus eventos</span> › <span data-action="pilot-race-back" data-champ="${getChamp()?.id||''}" data-race="${r.id}">${esc(r.name)}</span> › <b>${esc(d.name)}</b></div>`+
    header(d.name,'Sessões do dia.','')+
    '<div class="list">'+((d.sessions||[]).filter(s=>(s.pilotIds||[]).some(x=>String(x)===String(pid))).map(s=>`<div class="sessionrow"><div><b>${esc(s.name)}</b><div class="muted">${esc(s.type||'')}</div></div><button class="btn" data-action="pilot-session" data-id="${s.id}" data-day="${d.id}" data-race="${r.id}" data-champ="${getChamp()?.id||''}">Abrir</button></div>`).join('')||'<div class="empty">Não tens sessões atribuídas neste dia.</div>')+'</div>';
}
function pilotSessionPage(){
  const s=getSession(),track=s&&db.tracks.find(t=>String(t.id)===String(s.trackId)),pid=currentPilotId();
  if(!s||!pid||(s.pilotIds||[]).every(x=>String(x)!==String(pid)))return '<div class="empty">Esta sessão não está atribuída à tua conta.</div>';
  if(!track)return '<div class="empty">Esta sessão ainda não tem uma pista associada.</div>';
  const idx=Number.isFinite(ui.sessionPoint)?ui.sessionPoint:0,safeIdx=track.points.length?Math.min(Math.max(idx,0),track.points.length-1):0,a=analysisFor(s,pid,safeIdx),score=sessionScore(s,pid),general=sessionGeneral(s,pid);
  return `<div class="breadcrumb"><span data-action="pilot-home">Os meus eventos</span> › <b>${esc(s.name)}</b></div>`+
    header(s.name,`${esc(s.type||'Sessão')} · ${esc(track.name)}`,'')+
    `<div class="grid2"><div class="card"><b>Score da sessão</b><div class="kpi">${score==null?'—':score.toFixed(1)+'/10'}</div><div class="muted">${score==null?'Ainda sem análise.':Math.round(score*10)+'/100'}</div></div><div class="card"><b>Análise geral</b><div style="margin-top:8px">${esc(general.comment||'Ainda não foi adicionada uma análise geral.')}</div></div></div>
    <div class="card" style="margin-top:14px"><b>Análise do treinador</b><div class="help">Clica diretamente nos números das curvas para consultar cada avaliação.</div></div>
    <div style="margin-top:14px"><div class="stagebox"><div class="stagehead"><b>${esc(track.name)}</b><span class="muted">${track.points.length} curvas</span></div><div class="stage" id="stage"><div class="image-wrap">${track.image?`<img id="trackImage" class="track-image" src="${track.image}" alt="Mapa da pista">`:'<div class="empty" style="margin:auto">Imagem indisponível</div>'}</div>${track.points.map((p,i)=>`<button type="button" class="point ${i===safeIdx?'selected':''}" data-session-point="${i}" data-map-point="${i}">${i+1}</button>`).join('')}</div></div></div>
    <div class="card" style="margin-top:14px"><h3>Curva ${track.points.length?safeIdx+1:'—'}</h3>${track.points.length?`<div class="grid2"><div><div class="muted">Nota da curva</div><div class="kpi">${curveScore(a)==null?'—':curveScore(a).toFixed(1)+'/10'}</div></div><div><div class="muted">Rotação</div><div>${a.rotation===''||a.rotation==null?'—':esc(a.rotation)+'/10'}</div></div></div><div class="analysisread" style="margin-top:14px">${[['Comentário',a.comment],['Travagem',a.braking],['Inserção',a.insertion],['Trajetória entrada',a.inTrajectory],['Trajetória meio',a.midTrajectory],['Trajetória saída',a.outTrajectory],['Aceleração',a.acceleration],['Rotação',a.rotation]].filter(x=>x[1]!==''&&x[1]!=null).map(x=>`<div style="margin-bottom:10px"><div class="muted">${x[0]}</div><div>${esc(x[1])}</div></div>`).join('')||'<div class="empty">Ainda não existe análise para esta curva.</div>'}</div>`:'<div class="empty">Esta pista ainda não tem curvas marcadas.</div>'}</div>`;
}


function render(){
  const app=document.getElementById('app');
  if(currentUser && currentUser.role==='pilot' && !profileComplete(currentUser) && !['profile','register'].includes(ui.page))ui.page='profile';
  if(!currentUser){
    app.innerHTML=(ui.page==='register'?registerPage():loginPage());
    document.querySelectorAll('[data-page]').forEach(b=>b.classList.remove('active'));
    return;
  }
  if(ui.page==='editor')app.innerHTML=editor();
  else if(ui.page==='dashboard')app.innerHTML=dashboard();
  else if(ui.page==='my-events')app.innerHTML=myEventsPage();
  else if(ui.page==='profile')app.innerHTML=profilePage();
  else if(ui.page==='register')app.innerHTML=registerPage();
  else if(ui.page==='drivers')app.innerHTML=drivers();
  else if(ui.page==='sessions')app.innerHTML=sessions();
  else if(ui.page==='tracks')app.innerHTML=tracksPage();
  else if(ui.page==='championships')app.innerHTML=championshipsPage();
  else if(ui.page==='championship')app.innerHTML=championshipPage();
  else if(ui.page==='race')app.innerHTML=racePage();
  else if(ui.page==='day')app.innerHTML=dayPage();
  else if(ui.page==='session')app.innerHTML=sessionPage();
  else if(ui.page==='pilot-race')app.innerHTML=pilotRacePage();
  else if(ui.page==='pilot-day')app.innerHTML=pilotDayPage();
  else if(ui.page==='pilot-session')app.innerHTML=pilotSessionPage();
  if(currentUser){
    const role=currentUser.role==='admin'?'ADMIN':'PILOTO';
    app.insertAdjacentHTML('afterbegin',`<div class="userbar" style="justify-content:flex-end;margin-bottom:12px"><span>${esc(currentUser.name)}</span><span class="rolebadge">${role}</span><button class="btn" data-action="logout">Sair</button></div>`);
  }
  document.querySelectorAll('[data-page]').forEach(b=>{
    b.classList.toggle('active',b.dataset.page===ui.page);
    const adminOnly=['dashboard','championships','tracks','drivers','sessions'].includes(b.dataset.page);
    if(isAdmin() && b.dataset.page==='profile') b.style.display='none';
    else b.style.display=(!isAdmin()&&adminOnly)?'none':'';
  });
  const side=document.querySelector('.nav');
  if(side && !isAdmin() && !side.querySelector('[data-page="my-events"]')){
    const b=document.createElement('button');b.dataset.page='my-events';b.textContent='Os meus eventos';side.prepend(b);
  }
  if(side && isAdmin()){
    const b=side.querySelector('[data-page="my-events"]');if(b)b.remove();
  }
  if(ui.page==='editor')bindEditor();
  if(ui.page==='session'||ui.page==='pilot-session'||ui.page==='editor'){
    const img=document.getElementById('trackImage');
    if(img){
      const p=()=>{positionMapPoints();requestAnimationFrame(()=>positionMapPoints());};
      if(img.complete)p();else img.onload=p;
      if(window._mpResizeObserver)window._mpResizeObserver.disconnect();
      window._mpResizeObserver=new ResizeObserver(()=>positionMapPoints());
      window._mpResizeObserver.observe(img);
      window._mpResizeObserver.observe(document.getElementById('stage'));
    }
  }
}
function modal(content){
  document.getElementById('modal').innerHTML=`<div class="modalbg"><div class="modal">${content}</div></div>`;
}
function closeModal(){document.getElementById('modal').innerHTML=''}

function newTrack(){
  modal(`<h2>Nova pista</h2>
    <div class="field"><label>Nome</label><input id="trackName" placeholder="Ex.: Viana"></div>
    <div class="field"><label>Variante</label><input id="trackVariant" value="Karting"></div>
    <div class="modalactions"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="create-track">Criar</button></div>`);
}

async function createTrack(){
  const name=document.getElementById('trackName').value.trim();
  if(!name)return;
  const t={
    id:Date.now(),
    name,
    variant:document.getElementById('trackVariant').value.trim()||'Karting',
    image:'',
    pointSpace:'image',
    points:[]
  };
  db.tracks.push(t);await save();closeModal();
  ui.page='editor';ui.editor=t.id;ui.mode='add';ui.selected=null;render();
}

function bindEditor(){
  const t=db.tracks.find(x=>String(x.id)===String(ui.editor));
  const stage=document.getElementById('stage'),layer=document.getElementById('clickLayer'),image=document.getElementById('trackImage');
  if(!t||!stage||!layer)return;
  const file=document.getElementById('file');
  if(file)file.onchange=()=>{const f=file.files[0];if(!f)return;compressImage(f).then(async data=>{const ok=await persistTrackImage(t,data);if(ok){t.pointSpace='image';render();toast('Imagem carregada e guardada')}else toast('Não foi possível guardar a imagem')}).catch(()=>toast('Não foi possível ler a imagem'))};
  const position=()=>{if(image){if(!migrateLegacyTrackPoints(t)){positionMapPoints();}else{render();return;}}};
  if(image){if(image.complete)position();else image.onload=position;}
  layer.onclick=event=>{
    if(ui.mode!=='add'||!image){if(!image)toast('Carrega primeiro uma imagem.');return;}
    const ir=image.getBoundingClientRect(),sr=stage.getBoundingClientRect();
    if(event.clientX<ir.left||event.clientX>ir.right||event.clientY<ir.top||event.clientY>ir.bottom)return;
    const x=((event.clientX-ir.left)/ir.width)*100,y=((event.clientY-ir.top)/ir.height)*100;
    t.pointSpace='image';t.points.push({id:'p'+Date.now(),x,y,comment:'',braking:'',trail:'',insertion:'',inTrajectory:10,midTrajectory:10,outTrajectory:10,acceleration:'',rotation:''});
    ui.selected=t.points.length-1;save();render();
  };
}

document.addEventListener('change',event=>{
  if(event.target.id==='activePilot'){ui.sessionPilot=event.target.value;ui.sessionPoint=0;render();}
});
document.addEventListener('click',async event=>{

  const page=event.target.closest('[data-page]');
  if(page){
    ui.page=page.dataset.page;ui.editor=null;ui.selected=null;render();return;
  }

  const mode=event.target.closest('[data-mode]');
  if(mode){ui.mode=mode.dataset.mode;render();return;}

  const sessionPoint=event.target.closest('[data-session-point]');
  if(sessionPoint){ui.sessionPoint=Number(sessionPoint.dataset.sessionPoint);render();return;}
  const point=event.target.closest('[data-point]');
  if(point){
    ui.selected=Number(point.dataset.point);
    ui.mode='select';
    render();
    return;
  }

  const action=event.target.closest('[data-action]');
  if(!action)return;
  const protectedActions=['new-track','create-track','delete','add-registered-pilot','new-championship','create-championship','new-race','create-race','new-day','create-day','new-session','create-session','configure-session','delete-session','manage-session-templates','add-session-template','delete-session-template','delete-account','save-session','edit','image','remove'];
  if(!isAdmin()&&protectedActions.includes(action.dataset.action)){toast('Acesso reservado ao administrador');return;}

  switch(action.dataset.action){
    case 'login':login();break;
    case 'go-register':ui.page='register';render();break;
    case 'back-login':ui.page='login';render();break;
    case 'register-pilot':registerPilot();break;
    case 'save-profile':saveProfile();break;
    case 'save-analysis':{
      const s=getSession(),pid=ui.sessionPilot||document.getElementById('activePilot')?.value;
      if(!pid){toast('Seleciona um piloto');break}
      setAnalysis(s,pid,ui.sessionPoint||0,{comment:document.getElementById('analysisComment').value,braking:document.getElementById('analysisBraking').value,insertion:document.getElementById('analysisInsertion').value,inTrajectory:document.getElementById('analysisInTrajectory').value,midTrajectory:document.getElementById('analysisMidTrajectory').value,outTrajectory:document.getElementById('analysisOutTrajectory').value,acceleration:document.getElementById('analysisAcceleration').value,rotation:document.getElementById('analysisRotation').value});
      if(!s.generalAnalysis)s.generalAnalysis={};s.generalAnalysis[pid]={comment:document.getElementById('generalAnalysis')?.value||''};
      await save();toast('Análise guardada');render();break;
    }
    case 'finish-analysis':{
      if(saveCurrentAnalysis()){await save();toast('Sessão analisada e guardada');ui.page='sessions';ui.session=null;ui.sessionPoint=0;ui.sessionPilot=null;render();}
      break;
    }
    case 'logout':logout();break;
    case 'pilot-home':ui.page='my-events';render();break;
    case 'pilot-race-back':ui.page='pilot-race';if(action.dataset.champ)ui.championship=action.dataset.champ;if(action.dataset.race)ui.race=action.dataset.race;render();break;
    case 'pilot-race':ui.page='pilot-race';ui.championship=action.dataset.champ;ui.race=action.dataset.race;render();break;
    case 'pilot-day':ui.page='pilot-day';ui.day=action.dataset.id;if(action.dataset.champ)ui.championship=action.dataset.champ;if(action.dataset.race)ui.race=action.dataset.race;render();break;
    case 'pilot-session':ui.page='pilot-session';ui.session=action.dataset.id;if(action.dataset.champ)ui.championship=action.dataset.champ;if(action.dataset.race)ui.race=action.dataset.race;if(action.dataset.day)ui.day=action.dataset.day;render();break;
    case 'new-championship':newChampionship();break;
    case 'create-championship':createChampionship();break;
    case 'open-championship':ui.page='championship';ui.championship=action.dataset.id;render();break;
    case 'back-championships':ui.page='championships';render();break;
    case 'back-championship':ui.page='championship';render();break;
    case 'new-race':newRace();break;
    case 'create-race':createRace();break;
    case 'open-race':ui.page='race';ui.race=action.dataset.id;render();break;
    case 'back-races':ui.page='championship';render();break;
    case 'delete-championship':{const id=action.dataset.id;db.championships=db.championships.filter(c=>String(c.id)!==String(id));if(String(ui.championship)===String(id)){ui.championship=null;ui.race=null;ui.day=null;ui.session=null;ui.page='championships';}await save();render();break;}
    case 'delete-race':{const c=getChamp();if(c){c.races=c.races.filter(r=>String(r.id)!==String(action.dataset.id));save();render();}break;}
    case 'new-day':newDay();break;
    case 'create-day':createDay();break;
    case 'open-day':ui.page='day';ui.day=action.dataset.id;render();break;
    case 'back-day':ui.page='day';render();break;
    case 'manage-session-templates':manageSessionTemplates();break;
    case 'add-session-template':{const n=document.getElementById('newSessionTemplate').value.trim();if(!n){toast('Escreve um nome');break;}const a=sessionTemplates();if(a.some(x=>x.toLowerCase()===n.toLowerCase())){toast('Esse nome já existe');break;}db.sessionTemplates=a.concat(n);await save();newSession();break;}
    case 'delete-session-template':{const i=Number(action.dataset.index),a=sessionTemplates();if(a.length<=1){toast('Mantém pelo menos um nome de sessão');break;}db.sessionTemplates=a.filter((_,j)=>j!==i);await save();manageSessionTemplates();break;}
    case 'delete-session':{const c=db.championships.find(x=>String(x.id)===String(action.dataset.champ)),r=c?.races.find(x=>String(x.id)===String(action.dataset.race)),d=r?.days.find(x=>String(x.id)===String(action.dataset.day));if(d){d.sessions=d.sessions.filter(x=>String(x.id)!==String(action.dataset.id));r.pilotIds=[...new Set(r.days.flatMap(day=>day.sessions.flatMap(ss=>ss.pilotIds||[])).map(String))];await save();render();toast('Sessão eliminada');}break;}
    case 'delete-account':{const uid=String(action.dataset.userId||'');if(!uid){toast('Conta inválida');break;}if(uid===String(currentUser?.id)){toast('Não podes eliminar a tua própria conta aqui.');break;}const p=profileCache.find(x=>String(x.id)===uid);if(!p){toast('Conta não encontrada');break;}db.drivers=db.drivers.filter(d=>String(d.userId)!==uid);for(const c of db.championships||[])for(const r of c.races||[])for(const d of r.days||[])for(const ss of d.sessions||[])ss.pilotIds=(ss.pilotIds||[]).filter(id=>{const drv=db.drivers.find(x=>String(x.id)===String(id));return drv});await save();const {error}=await sb.rpc('delete_mpr_user',{target_user_id:uid});if(error){console.error(error);toast('A conta não foi eliminada. Executa primeiro o SQL V33 no Supabase.');break;}await loadProfiles();render();toast('Conta eliminada');break;}
    case 'new-session':newSession();break;
    case 'create-session':createSession();break;
    case 'open-session':ui.page='session';ui.session=action.dataset.id;if(action.dataset.champ)ui.championship=action.dataset.champ;if(action.dataset.race)ui.race=action.dataset.race;if(action.dataset.day)ui.day=action.dataset.day;render();break;
    case 'configure-session':configureSession();break;
    case 'save-session':saveSession();break;
    case 'new-track':newTrack();break;
    case 'create-track':createTrack();break;
    case 'new-driver':newDriver();break;
    case 'add-registered-pilot':addRegisteredPilot(action.dataset.userId);break;
    case 'create-driver':addRegisteredPilot();break;
    case 'close':closeModal();break;
    case 'edit':
      ui.page='editor';ui.editor=action.dataset.id;ui.mode='add';ui.selected=null;render();break;
    case 'back':
      ui.page='tracks';ui.editor=null;ui.selected=null;render();break;
    case 'image':
      document.getElementById('file').click();break;
    case 'save':
      save();toast('Pista guardada');break;
    case 'remove':{
      const t=db.tracks.find(x=>String(x.id)===String(ui.editor));
      if(ui.selected==null){toast('Seleciona primeiro uma curva');break;}
      t.points.splice(ui.selected,1);
      ui.selected=t.points.length?Math.min(ui.selected,t.points.length-1):null;
      save();render();break;
    }
    case 'delete':{
      const id=String(action.dataset.id);
      db.tracks=db.tracks.filter(t=>String(t.id)!==id);
      await save();
      if(String(ui.editor)===id){ui.editor=null;ui.selected=null;ui.page='tracks';}
      render();toast('Pista eliminada');break;
    }
    case 'save-comment':{
      const t=db.tracks.find(x=>String(x.id)===String(ui.editor));
      const p=t?.points?.[ui.selected];
      if(!p)break;
      p.comment=document.getElementById('comment').value;
      p.braking=document.getElementById('braking').value;
      p.entry=document.getElementById('entry').value;
      p.apex=document.getElementById('apex').value;
      p.exit=document.getElementById('exit').value;
      p.trajectory=document.getElementById('trajectory').value;
      p.error=document.getElementById('error').value;
      p.correction=document.getElementById('correction').value;
      save();toast('Comentário guardado');break;
    }
  }
});

render();
subscribeAuth();
bootCloud();
</script>
