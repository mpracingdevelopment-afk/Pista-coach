<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pista Coach</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b0e;color:#f4f5f7;font-family:Arial,Helvetica,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
.layout{min-height:100vh}.sidebar{width:230px;background:#0f1216;border-right:1px solid #292f36;padding:20px;position:fixed;inset:0 auto 0 0}.logo{font-weight:800;font-size:20px;margin:5px 8px 30px}.logo span{color:#7f8994}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:#aeb5bd;text-align:left;padding:12px;border-radius:8px}.nav button.active,.nav button:hover{background:#1c2229;color:#fff}
.content{margin-left:230px;width:calc(100% - 230px);padding:28px;max-width:1600px}.header{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.title{font-size:28px;font-weight:800}.subtitle{color:#8f98a3;margin-top:5px}.buttons{display:flex;gap:8px;flex-wrap:wrap}.btn{background:#171c22;color:#fff;border:1px solid #303740;border-radius:8px;padding:10px 14px}.btn.primary{background:#fff;color:#090b0e;border-color:#fff;font-weight:700}.btn.active{background:#ffd166;color:#111;border-color:#ffd166}.btn.danger{color:#ff9696}
.list{display:grid;gap:9px;margin-top:12px}.row{background:#12171c;border:1px solid #293038;border-radius:11px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:15px}.empty{border:1px dashed #303740;border-radius:11px;padding:35px;text-align:center;color:#929ba5}
.modal-bg{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#12171c;border:1px solid #303740;border-radius:14px;padding:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#aeb5bd}.field input,.field select{background:#0b0e12;color:#fff;border:1px solid #303740;border-radius:7px;padding:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.editor{display:grid;grid-template-columns:280px 1fr 250px;gap:12px}.toolgroup{background:#12171c;border:1px solid #293038;border-radius:12px;padding:13px;margin-bottom:10px}.toolgroup h3{font-size:14px;margin:0 0 10px}.toolgroup .btn{width:100%;margin-bottom:7px}.toolgroup .btn:last-child{margin-bottom:0}.info{font-size:12px;color:#9ba4ad;line-height:1.5}.check{display:flex;align-items:center;gap:8px;margin:8px 0;color:#c8ced5}.check input{accent-color:#fff}.range{width:100%}
.canvas-wrap{background:#0b0e12;border:1px solid #293038;border-radius:12px;overflow:hidden}.canvas-head{padding:13px 15px;border-bottom:1px solid #293038;display:flex;justify-content:space-between;gap:10px}.canvas{position:relative;height:min(74vh,720px);min-height:500px;overflow:hidden;background:#151a20}.canvas svg{width:100%;height:100%;display:block;touch-action:none}.editor-bg{cursor:grab}.editor-bg.moving{cursor:grabbing}
.road{fill:none;stroke:#3d4650;stroke-width:42;stroke-linecap:round;stroke-linejoin:round}.road2{fill:none;stroke:#0b0f13;stroke-width:28;stroke-linecap:round;stroke-linejoin:round}.centre{fill:none;stroke:#f1f3f4;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round;stroke-linejoin:round}.editpoint{fill:#fff;stroke:#090b0e;stroke-width:2;cursor:grab}.editpoint.selected{fill:#ffd166}.handle{fill:#ffd166;stroke:#090b0e;stroke-width:2;cursor:grab}.handle-line{stroke:#ffd166;stroke-width:1.5;stroke-dasharray:4 4}.curve-label{font-size:12px;font-weight:800;text-anchor:middle;dominant-baseline:middle;pointer-events:none;fill:#111}.start-line{stroke:#fff;stroke-width:5}.modehint{padding:9px 13px;background:#171c22;border-bottom:1px solid #293038;font-size:12px;color:#c6ccd2}
.kpi{font-size:24px;font-weight:800}.muted{color:#929ba5}.statrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #242a31;font-size:13px}.statrow:last-child{border-bottom:0}.angle{font-variant-numeric:tabular-nums}
.toast{position:fixed;right:18px;bottom:18px;background:#fff;color:#111;padding:12px 15px;border-radius:8px;font-weight:700;z-index:40}
@media(max-width:1150px){.editor{grid-template-columns:230px 1fr}.rightpanel{display:none}}@media(max-width:800px){.sidebar{width:68px;padding:15px 8px}.logo{font-size:0;text-align:center}.logo:after{content:"PC";font-size:18px}.nav button{font-size:0;text-align:center}.content{margin-left:68px;width:calc(100% - 68px);padding:14px}.editor{grid-template-columns:1fr}.editor-tools{display:grid;grid-template-columns:1fr 1fr}.canvas{height:62vh;min-height:400px}}@media(max-width:560px){.editor-tools{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.title{font-size:23px}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar"><div class="logo">PISTA <span>COACH</span></div><div class="nav">
<button data-nav="dashboard">Dashboard</button><button data-nav="drivers">Pilotos</button><button data-nav="tracks" class="active">Pistas</button><button data-nav="sessions">Sessões</button>
</div></aside>
<main class="content" id="content"></main>
</div><div id="overlay"></div>

<script>
(function(){
'use strict';
const KEY='pista_coach_v4', W=1000,H=650;
const base=[[120,130],[260,85],[470,100],[700,145],[820,260],[770,410],[600,500],[390,470],[220,520],[100,420],[110,300],[190,245],[300,275],[390,225],[520,255],[650,205]];
const initial={drivers:[],tracks:[{id:1,name:'Portimão',variant:'Karting',corners:16,points:base.map(p=>({x:p[0],y:p[1],hin:null,hout:null})),image:{src:'',x:80,y:55,w:840,h:540,opacity:.28},startPoint:0}],sessions:[]};
let db=load(),state={page:'tracks',editorId:null,selected:0,mode:'image',drag:null,history:[]};

function load(){
 try{
  let x=localStorage.getItem(KEY);
  if(!x){ const old=localStorage.getItem('pista_coach_v3') || localStorage.getItem('pista_coach_v2'); x=old; }
  let data=x?JSON.parse(x):initial;
  data.tracks=(data.tracks||[]).map(t=>normalizeTrack(t));
  return data;
 }catch(e){return initial}
}
function normalizeTrack(t){
 t.image=(t.image && typeof t.image==='object')?t.image:{src:'',x:80,y:55,w:840,h:540,opacity:.28};
 t.image.src=typeof t.image.src==='string'?t.image.src:''; t.image.x=Number(t.image.x)||80; t.image.y=Number(t.image.y)||55; t.image.w=Number(t.image.w)||840; t.image.h=Number(t.image.h)||540; t.image.opacity=Number(t.image.opacity)||.28;
 t.points=(t.points||base).map(p=>Array.isArray(p)?{x:p[0],y:p[1],hin:null,hout:null}:{x:Number(p.x),y:Number(p.y),hin:p.hin||null,hout:p.hout||null});
 t.corners=t.points.length;
 return t;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('Não foi possível guardar. Tenta uma imagem menor.');return false}}
function byId(a,id){return a.find(x=>String(x.id)===String(id))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(m){let x=document.createElement('div');x.className='toast';x.textContent=m;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}
function header(t,s,a){return '<div class="header"><div><div class="title">'+esc(t)+'</div><div class="subtitle">'+esc(s||'')+'</div></div><div>'+a+'</div></div>'}
function clonePoints(p){return JSON.parse(JSON.stringify(p))}
function pushHistory(t){state.history.push(clonePoints(t.points));if(state.history.length>20)state.history.shift()}

function dashboard(){return header('Dashboard','Coaching e análise em pista','<button class="btn primary" data-action="new-session">+ Nova sessão</button>')+'<div class="cards"><div class="card"><div class="muted">Pilotos</div><div class="kpi">'+db.drivers.length+'</div></div><div class="card"><div class="muted">Pistas</div><div class="kpi">'+db.tracks.length+'</div></div><div class="card"><div class="muted">Sessões</div><div class="kpi">'+db.sessions.length+'</div></div></div>'}
function drivers(){return header('Pilotos','Pilotos acompanhados','<button class="btn primary" data-action="new-driver">+ Adicionar piloto</button>')+'<div class="list">'+(db.drivers.map(d=>'<div class="row"><div><b>'+esc(d.name)+'</b><div class="muted">'+esc(d.category||'Karting')+(d.number?' · #'+esc(d.number):'')+'</div></div><button class="btn danger" data-action="delete-driver" data-id="'+d.id+'">Apagar</button></div>').join('')||'<div class="empty">Adiciona o primeiro piloto.</div>')+'</div>'}
function tracks(){return header('Pistas','Cria e edita os layouts diretamente no browser','<button class="btn primary" data-action="new-track">+ Nova pista</button>')+'<div class="list">'+db.tracks.map(t=>'<div class="row"><div><b>'+esc(t.name)+'</b><div class="muted">'+esc(t.variant)+' · '+t.points.length+' pontos'+(t.image.src?' · imagem carregada':'')+'</div></div><div class="buttons"><button class="btn" data-action="edit-track" data-id="'+t.id+'">Editar layout</button><button class="btn" data-action="preview-track" data-id="'+t.id+'">Pré-visualizar</button><button class="btn danger" data-action="delete-track" data-id="'+t.id+'">Apagar</button></div></div>').join('')+'</div>'}
function sessions(){return header('Sessões','Histórico de coaching','<button class="btn primary" data-action="new-session">+ Nova sessão</button>')+'<div class="empty">A área de sessões permanece disponível. Nesta versão o foco é o editor de pistas.</div>'}

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function angleDeg(a,b){return Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI}
function normAngle(a){a=(a+360)%360;return a}
function handleDefault(p,prev,next){
 const d1=prev?angleDeg(prev,p):0, d2=next?angleDeg(p,next):d1;
 let tangent=(d1+d2)/2;
 if(Math.abs(d2-d1)>180)tangent+=180;
 const r=Math.min(70,Math.max(25,(dist(prev||p,p)+dist(p,next||p))/6));
 const rad=tangent*Math.PI/180;
 p.hin={x:p.x-r*Math.cos(rad),y:p.y-r*Math.sin(rad)};
 p.hout={x:p.x+r*Math.cos(rad),y:p.y+r*Math.sin(rad)};
}
function ensureHandles(t){
 const p=t.points;
 p.forEach((q,i)=>{
  if(!q.hin||!q.hout)handleDefault(q,p[(i-1+p.length)%p.length],p[(i+1)%p.length]);
 });
}
function cubicPath(p){
 if(p.length<2)return '';
 let d='M '+p[0].x+' '+p[0].y+' ';
 for(let i=0;i<p.length;i++){
  let a=p[i],b=p[(i+1)%p.length],c1=a.hout||a,c2=b.hin||b;
  d+='C '+c1.x+' '+c1.y+', '+c2.x+' '+c2.y+', '+b.x+' '+b.y+' ';
 }
 return d;
}
function selectedStats(t){
 const p=t.points[state.selected],prev=t.points[(state.selected-1+t.points.length)%t.points.length],next=t.points[(state.selected+1)%t.points.length];
 const hin=p.hin||p,hout=p.hout||p;
 return {inA:normAngle(angleDeg(hin,p)),outA:normAngle(angleDeg(p,hout)),turn:Math.round(Math.abs(normAngle(angleDeg(hin,p)-angleDeg(p,hout)))),radius:Math.round((dist(p,hin)+dist(p,hout))/2),prev,next};
}

function editorSvg(t){
 ensureHandles(t);
 const d=cubicPath(t.points);
 let bg=t.image.src?'<image class="editor-bg" data-bg="1" href="'+t.image.src+'" x="'+t.image.x+'" y="'+t.image.y+'" width="'+t.image.w+'" height="'+t.image.h+'" opacity="'+t.image.opacity+'" preserveAspectRatio="none"></image>':'';
 let marks=t.points.map((p,i)=>{
   let s=i===state.selected;
   return '<g data-point="'+i+'"><circle class="editpoint'+(s?' selected':'')+'" cx="'+p.x+'" cy="'+p.y+'" r="10"></circle><text class="curve-label" x="'+p.x+'" y="'+p.y+'">'+(i+1)+'</text></g>';
 }).join('');
 let handles='';
 if(state.mode==='curve'){
   const p=t.points[state.selected],hin=p.hin||p,hout=p.hout||p;
   handles='<line class="handle-line" x1="'+p.x+'" y1="'+p.y+'" x2="'+hin.x+'" y2="'+hin.y+'"></line><line class="handle-line" x1="'+p.x+'" y1="'+p.y+'" x2="'+hout.x+'" y2="'+hout.y+'"></line><circle class="handle" data-handle="in" cx="'+hin.x+'" cy="'+hin.y+'" r="8"></circle><circle class="handle" data-handle="out" cx="'+hout.x+'" cy="'+hout.y+'" r="8"></circle>';
 }
 return '<svg id="editor-svg" viewBox="0 0 '+W+' '+H+'">'+bg+'<path class="road" d="'+d+'"></path><path class="road2" d="'+d+'"></path><path class="centre" d="'+d+'"></path>'+marks+handles+'</svg>';
}

function editor(){
 const t=byId(db.tracks,state.editorId);ensureHandles(t);const p=t.points[state.selected],st=selectedStats(t);
 return '<div style="margin-bottom:10px"><button class="btn" data-action="back-tracks">← Voltar</button></div>'+
 header('Editor · '+t.name,'Primeiro posiciona a imagem. Depois muda para “Editar curva” e desenha o traçado.','<div class="buttons"><button class="btn primary" data-action="save-track">Guardar pista</button></div>')+
 '<div class="editor"><div class="editor-tools">'+
 '<div class="toolgroup"><h3>Modo</h3><button class="btn '+(state.mode==='image'?'active':'')+'" data-action="mode-image">Mover imagem</button><button class="btn '+(state.mode==='curve'?'active':'')+'" data-action="mode-curve">Editar curva</button><button class="btn '+(state.mode==='add'?'active':'')+'" data-action="mode-add">Adicionar ponto</button><div class="info">Mover imagem: arrasta a imagem. Editar curva: arrasta pontos e handles amarelos. Adicionar ponto: clica no local pretendido.</div></div>'+
 '<div class="toolgroup"><h3>Imagem Google Maps</h3><button class="btn" data-action="upload-bg">Carregar imagem</button><button class="btn" data-action="remove-bg">Remover imagem</button><label class="field"><label>Opacidade <span id="opacity-val">'+Math.round(t.image.opacity*100)+'%</span></label><input id="opacity" class="range" type="range" min="5" max="100" value="'+Math.round(t.image.opacity*100)+'"></label><label class="field"><label>Escala</label><input id="scale" class="range" type="range" min="25" max="180" value="'+Math.round(t.image.w/W*100)+'"></label><input id="bg-file" type="file" accept="image/*" hidden><div class="info">Depois de carregar, usa “Mover imagem” para a posicionar. A roda do rato também faz zoom.</div></div>'+
 '<div class="toolgroup"><h3>Traçado</h3><button class="btn" data-action="add-point">+ Adicionar ponto no meio</button><button class="btn" data-action="delete-point">Apagar ponto</button><button class="btn" data-action="undo">Desfazer</button><div class="info">Pontos: <b>'+t.points.length+'</b></div></div>'+
 '<div class="toolgroup"><h3>Ponto '+(state.selected+1)+'</h3><div class="statrow"><span>Ângulo entrada</span><b class="angle">'+Math.round(st.inA)+'°</b></div><div class="statrow"><span>Ângulo saída</span><b class="angle">'+Math.round(st.outA)+'°</b></div><div class="statrow"><span>Curvatura</span><b class="angle">'+st.turn+'°</b></div><div class="statrow"><span>Raio gráfico</span><b>'+st.radius+' px</b></div><button class="btn" data-action="reset-handles">Recalcular handles</button></div>'+
 '<div class="toolgroup"><h3>Meta</h3><button class="btn" data-action="set-start">Definir ponto como meta</button><div class="info">Meta: '+(t.startPoint!=null?'Ponto '+(t.startPoint+1):'não definida')+'</div></div>'+
 '</div><div class="canvas-wrap"><div class="canvas-head"><div><b>'+esc(t.name)+'</b><div class="muted">Base: imagem + traçado editável</div></div><span class="badge">'+t.points.length+' pontos</span></div><div class="modehint">'+(state.mode==='image'?'MODO IMAGEM — arrasta a imagem para a posição correta.':state.mode==='add'?'MODO PONTOS — clica na pista para criar um ponto.':'MODO CURVA — arrasta os pontos brancos e os handles amarelos.')+'</div><div class="canvas" id="canvas">'+editorSvg(t)+'</div></div>'+
 '<div class="toolgroup rightpanel"><h3>Como usar</h3><div class="info"><b>1.</b> Carrega a imagem do Google Maps.<br><b>2.</b> Em “Mover imagem”, arrasta-a e ajusta a escala/opacidade.<br><b>3.</b> Em “Adicionar ponto”, coloca os pontos nas curvas.<br><b>4.</b> Em “Editar curva”, arrasta cada ponto para o centro da trajetória.<br><b>5.</b> Arrasta os handles amarelos para controlar o ângulo e a suavidade.<br><b>6.</b> Guarda a pista.</div></div></div>';
}

function render(){
 let c=document.getElementById('content');
 if(state.page==='dashboard')c.innerHTML=dashboard();else if(state.page==='drivers')c.innerHTML=drivers();else if(state.page==='tracks')c.innerHTML=tracks();else if(state.page==='editor')c.innerHTML=editor();else c.innerHTML=sessions();
 document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.page));
 bindEditor();
}
function modal(h){document.getElementById('overlay').innerHTML='<div class="modal-bg" data-close="1"><div class="modal">'+h+'</div></div>'}
function closeModal(){document.getElementById('overlay').innerHTML=''}

function newTrack(){modal('<h2>Nova pista</h2><div class="fields"><div class="field"><label>Nome</label><input id="new-name"></div><div class="field"><label>Variante</label><input id="new-variant" value="Karting"></div><div class="field"><label>Pontos iniciais</label><input id="new-corners" type="number" min="4" max="40" value="12"></div></div><div class="modal-actions"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="create-track">Criar</button></div>')}
function createTrack(){let n=Math.max(4,Math.min(40,Number(document.getElementById('new-corners').value)||12)),pts=[];for(let i=0;i<n;i++){let a=2*Math.PI*i/n-Math.PI/2;pts.push({x:500+330*Math.cos(a),y:325+230*Math.sin(a),hin:null,hout:null})}let t={id:Date.now(),name:document.getElementById('new-name').value.trim()||'Nova pista',variant:document.getElementById('new-variant').value.trim()||'Karting',points:pts,corners:n,image:{src:'',x:80,y:55,w:840,h:540,opacity:.28}};db.tracks.push(t);save();closeModal();state.editorId=t.id;state.selected=0;state.mode='image';render()}
function editTrack(id){const t=byId(db.tracks,id);if(!t){toast('Pista não encontrada');return;}state.editorId=t.id;state.selected=0;state.mode='image';state.history=[];render()}
function deleteTrack(id){if(confirm('Apagar esta pista?')){db.tracks=db.tracks.filter(t=>String(t.id)!==String(id));save();render()}}
function previewTrack(id){let t=byId(db.tracks,id);modal('<h2>'+esc(t.name)+'</h2><div class="canvas" style="height:480px">'+editorSvg(t)+'</div><div class="modal-actions"><button class="btn" data-action="close">Fechar</button></div>')}
function newDriver(){modal('<h2>Novo piloto</h2><div class="fields"><div class="field"><label>Nome</label><input id="dn"></div><div class="field"><label>Número</label><input id="dnum"></div></div><div class="modal-actions"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="create-driver">Criar</button></div>')}
function createDriver(){let n=document.getElementById('dn').value.trim();if(!n)return;db.drivers.push({id:Date.now(),name:n,number:document.getElementById('dnum').value.trim()});save();closeModal();render()}

function toSvg(e,svg){let r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function bindEditor(){
 if(state.page!=='editor')return;
 const t=byId(db.tracks,state.editorId),svg=document.getElementById('editor-svg'),file=document.getElementById('bg-file');
 if(!svg)return;
 svg.querySelectorAll('[data-point]').forEach(g=>g.addEventListener('pointerdown',e=>{
  if(state.mode==='add')return;
  e.preventDefault();state.selected=Number(g.dataset.point);
  if(state.mode==='curve'){state.drag={type:'point',index:state.selected};pushHistory(t)}
  render();
 }));
 svg.querySelectorAll('[data-handle]').forEach(h=>h.addEventListener('pointerdown',e=>{
  if(state.mode!=='curve')return;e.preventDefault();e.stopPropagation();state.drag={type:'handle',which:h.dataset.handle,index:state.selected};pushHistory(t)
 }));
 svg.addEventListener('pointerdown',e=>{
  const pos=toSvg(e,svg);
  if(state.mode==='image' && t.image.src){state.drag={type:'image',x:e.clientX,y:e.clientY,ix:t.image.x,iy:t.image.y};svg.querySelector('[data-bg]')?.classList.add('moving');return}
  if(state.mode==='add' && e.target===svg){pushHistory(t);t.points.push({x:pos.x,y:pos.y,hin:null,hout:null});state.selected=t.points.length-1;ensureHandles(t);save();render();return}
 });
 svg.addEventListener('pointermove',e=>{
  if(!state.drag)return;
  const pos=toSvg(e,svg);
  if(state.drag.type==='image'){
   const dx=(e.clientX-state.drag.x)/svg.getBoundingClientRect().width*W,dy=(e.clientY-state.drag.y)/svg.getBoundingClientRect().height*H;
   t.image.x=state.drag.ix+dx;t.image.y=state.drag.iy+dy;renderEditorOnly();return
  }
  let p=t.points[state.drag.index];if(!p)return;
  if(state.drag.type==='point'){p.x=pos.x;p.y=pos.y;ensureHandles(t)}
  else if(state.drag.type==='handle'){p[state.drag.which==='in'?'hin':'hout']={x:pos.x,y:pos.y}}
  renderEditorOnly();
 });
 svg.addEventListener('pointerup',()=>{if(state.drag){state.drag=null;save();render()}});
 svg.addEventListener('pointerleave',()=>{if(state.drag&&state.drag.type!=='image'){state.drag=null;save()}});
 svg.addEventListener('wheel',e=>{
  if(state.mode!=='image'||!t.image.src)return;e.preventDefault();
  let factor=e.deltaY<0?1.06:.94,old=t.image,mouse=toSvg(e,svg);
  old.w=Math.max(80,Math.min(1800,old.w*factor));old.h=Math.max(50,Math.min(1200,old.h*factor));
  old.x=mouse.x-(mouse.x-old.x)*factor;old.y=mouse.y-(mouse.y-old.y)*factor;save();renderEditorOnly()
 },{passive:false});
 if(file)file.onchange=()=>{
  const f=file.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{t.image.src=r.result;state.mode='image';save();render()};r.readAsDataURL(f)
 };
 const op=document.getElementById('opacity');if(op)op.oninput=()=>{t.image.opacity=Number(op.value)/100;document.getElementById('opacity-val').textContent=op.value+'%';renderEditorOnly();save()};
 const sc=document.getElementById('scale');if(sc)sc.oninput=()=>{let nw=W*Number(sc.value)/100,ratio=nw/t.image.w;t.image.w=nw;t.image.h*=ratio;renderEditorOnly();save()};
}
function renderEditorOnly(){let wrap=document.getElementById('canvas');if(wrap){let t=byId(db.tracks,state.editorId);wrap.innerHTML=editorSvg(t);bindEditor()}}

function addPoint(){let t=byId(db.tracks,state.editorId);pushHistory(t);let i=Math.min(state.selected+1,t.points.length),a=t.points[state.selected],b=t.points[i%t.points.length];t.points.splice(i,0,{x:(a.x+b.x)/2,y:(a.y+b.y)/2,hin:null,hout:null});state.selected=i;ensureHandles(t);save();render()}
function deletePoint(){let t=byId(db.tracks,state.editorId);if(t.points.length<=4){toast('Mínimo 4 pontos');return}pushHistory(t);t.points.splice(state.selected,1);state.selected=Math.max(0,Math.min(state.selected,t.points.length-1));ensureHandles(t);save();render()}
function undo(){let t=byId(db.tracks,state.editorId),last=state.history.pop();if(!last){toast('Nada para desfazer');return}t.points=last;state.selected=Math.min(state.selected,t.points.length-1);save();render()}
function resetHandles(){let t=byId(db.tracks,state.editorId);pushHistory(t);t.points.forEach((p,i)=>p.hin=p.hout=null);ensureHandles(t);save();render()}
function setStart(){let t=byId(db.tracks,state.editorId);t.startPoint=state.selected;save();toast('Meta definida');render()}
function uploadBg(){document.getElementById('bg-file').click()}
function removeBg(){let t=byId(db.tracks,state.editorId);t.image.src='';save();render()}
function handleClick(e){
 const nav=e.target.closest('[data-nav]');if(nav){state.page=nav.dataset.nav;state.editorId=null;render();return}
 const a=e.target.closest('[data-action]');if(!a)return;let x=a.dataset.action;
 if(x==='close'){closeModal();return}if(x==='new-track'){newTrack();return}if(x==='create-track'){createTrack();return}if(x==='edit-track'){editTrack(Number(a.dataset.id));return}if(x==='delete-track'){deleteTrack(Number(a.dataset.id));return}if(x==='preview-track'){previewTrack(Number(a.dataset.id));return}if(x==='back-tracks'){state.page='tracks';state.editorId=null;render();return}
 if(x==='mode-image'){state.mode='image';render();return}if(x==='mode-curve'){state.mode='curve';render();return}if(x==='mode-add'){state.mode='add';render();return}
 if(x==='upload-bg'){uploadBg();return}if(x==='remove-bg'){removeBg();return}if(x==='add-point'){addPoint();return}if(x==='delete-point'){deletePoint();return}if(x==='undo'){undo();return}if(x==='reset-handles'){resetHandles();return}if(x==='set-start'){setStart();return}if(x==='save-track'){save();toast('Pista guardada');return}
 if(x==='new-driver'){newDriver();return}if(x==='create-driver'){createDriver();return}if(x==='delete-driver'){if(confirm('Apagar este piloto?')){db.drivers=db.drivers.filter(d=>String(d.id)!==String(a.dataset.id));save();render()}return}
}
document.body.addEventListener('click',handleClick);
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.dataset.close)closeModal()});
try{render()}catch(err){console.error(err);document.getElementById('content').innerHTML='<div class="empty">Erro ao carregar a aplicação. Atualiza a página (Ctrl+F5).</div>'; }
})();
</script>
</body>
</html>
