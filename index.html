<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pista Coach</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b0e;color:#f4f5f7;font-family:Arial,Helvetica,sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}.sidebar{position:fixed;inset:0 auto 0 0;width:220px;background:#101318;border-right:1px solid #292f37;padding:22px 15px;z-index:10}.logo{font-size:20px;font-weight:800;margin:4px 8px 30px}.logo span{color:#89939e}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aeb5bd;text-align:left;padding:12px;border-radius:8px}.nav button.active,.nav button:hover{background:#20262d;color:#fff}
main{margin-left:220px;padding:26px;min-height:100vh}.header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.title{font-size:27px;font-weight:800}.sub,.muted{color:#8f98a2;font-size:13px}.buttons{display:flex;gap:8px;flex-wrap:wrap}.btn{background:#171c22;color:#fff;border:1px solid #303740;border-radius:8px;padding:10px 14px}.btn.primary{background:#fff;color:#111;border-color:#fff;font-weight:700}.btn.danger{color:#ff9b9b}
.list{display:grid;gap:9px}.row{background:#12171c;border:1px solid #293038;border-radius:11px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:15px}.empty{padding:40px;text-align:center;border:1px dashed #303740;border-radius:11px;color:#8f98a2}
.editor{display:grid;grid-template-columns:235px minmax(0,1fr) 300px;gap:12px;align-items:start}.card{background:#12171c;border:1px solid #293038;border-radius:11px;padding:12px;margin-bottom:10px}.card h3{font-size:14px;margin:0 0 9px}.card .btn{width:100%;margin-bottom:7px}.help{font-size:12px;color:#8f98a2;line-height:1.5}.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px}.mode .btn.selected{background:#fff;color:#111}
.track-area{background:#0e1115;border:1px solid #293038;border-radius:11px;overflow:hidden}.track-head{padding:12px 14px;border-bottom:1px solid #293038;display:flex;justify-content:space-between;gap:10px}.canvas{width:100%;display:flex;justify-content:center;align-items:flex-start;background:#0b0e12;overflow:auto}.stage{position:relative;width:100%;aspect-ratio:16/10;line-height:0;background:#171b20;overflow:hidden}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}.stage #point-layer{position:absolute;inset:0;pointer-events:none}.stage #point-layer .point{pointer-events:auto}.point-layer{position:absolute;inset:0}.point{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;padding:0;background:#fff;color:#111;border:3px solid #111;font-size:12px;font-weight:800;cursor:pointer;z-index:2}.point.selected{background:#ffd166}.no-line{display:none}
.comment-panel{background:#12171c;border:1px solid #293038;border-radius:11px;padding:13px;max-height:calc(100vh - 145px);overflow:auto}.comment-panel h3{margin:0 0 12px}.field{display:grid;gap:5px;margin-bottom:9px}.field label{font-size:12px;color:#aeb5bd}.field input,.field textarea{width:100%;background:#0b0e12;color:#fff;border:1px solid #303740;border-radius:7px;padding:9px}.field textarea{min-height:68px;resize:vertical}.corner-list{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}.corner-list button{padding:8px 0;border-radius:7px;border:1px solid #303740;background:#171c22;color:#fff}.corner-list button.active{background:#fff;color:#111}
.login-note{font-size:12px;color:#8f98a2;line-height:1.5}
@media(max-width:1150px){.editor{grid-template-columns:220px minmax(0,1fr)}.comment-panel{grid-column:1/-1;max-height:none}.corner-list{grid-template-columns:repeat(8,1fr)}}
@media(max-width:800px){.sidebar{width:65px;padding:14px 7px}.logo{font-size:0;text-align:center}.logo:after{content:"PC";font-size:18px}.nav button{font-size:0;text-align:center}main{margin-left:65px;padding:15px}.editor{grid-template-columns:1fr}.corner-list{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<aside class="sidebar"><div class="logo">PISTA <span>COACH</span></div><div class="nav">
<button data-page="dashboard">Dashboard</button><button data-page="drivers">Pilotos</button><button data-page="tracks" class="active">Pistas</button><button data-page="sessions">Sessões</button>
</div></aside><main id="app"></main><div id="modal"></div>
<script>
'use strict';
const KEY='pista_coach_v8';
const OLD=['pista_coach_v7','pista_coach_v6','pista_coach_v5','pista_coach_v4','pista_coach_v4_1','pista_coach_v3','pista_coach_v2','pista_coach_v1'];
let db=load(),ui={page:'tracks',editor:null,selected:null,mode:'add'};

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(raw){
 raw=raw||{};
 const tracks=Array.isArray(raw.tracks)?raw.tracks.map((t,i)=>{
   let src=Array.isArray(t.points)?t.points:[];
   let pts=src.map((p,j)=>({
     id:p.id||('p'+Date.now()+j),
     x:p.x!=null?Number(p.x):Number(p[0])||0,
     y:p.y!=null?Number(p.y):Number(p[1])||0,
     comment:p.comment||'',braking:p.braking||'',entry:p.entry||'',apex:p.apex||'',exit:p.exit||'',trajectory:p.trajectory||'',error:p.error||'',correction:p.correction||''
   }));
   // V6 points used a 1000x650 canvas. Keep their relative position.
   if(pts.length && pts.some(p=>p.x>1||p.y>1)) pts=pts.map(p=>({ ...p,x:p.x/1000,y:p.y/650 }));
   return {id:t.id||Date.now()+i,name:t.name||('Pista '+(i+1)),variant:t.variant||'Karting',image:t.image||t.background||'',imageOpacity:1,imageW:Number(t.imageW)||0,imageH:Number(t.imageH)||0,points:pts};
 }):[];
 return {tracks,drivers:Array.isArray(raw.drivers)?raw.drivers:[],sessions:Array.isArray(raw.sessions)?raw.sessions:[]};
}
function load(){
 for(const k of [KEY,...OLD]){try{const s=localStorage.getItem(k);if(s){const d=norm(JSON.parse(s));localStorage.setItem(KEY,JSON.stringify(d));return d}}catch(e){}}
 return norm({});
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('Não foi possível guardar. A imagem pode ser demasiado grande.');return false}}
function toast(s){const x=document.createElement('div');x.textContent=s;x.style.cssText='position:fixed;right:18px;bottom:18px;background:#fff;color:#111;padding:11px 14px;border-radius:8px;font-weight:700;z-index:99';document.body.appendChild(x);setTimeout(()=>x.remove(),1600)}
function header(a,b,c=''){return '<div class="header"><div><div class="title">'+esc(a)+'</div><div class="sub">'+esc(b)+'</div></div><div>'+c+'</div></div>'}
function tracksPage(){return header('Pistas','Só o chefe de equipa deverá editar os layouts.','<button class="btn primary" data-action="new-track">+ Nova pista</button>')+'<div class="list">'+(db.tracks.map(t=>'<div class="row"><div><b>'+esc(t.name)+'</b><div class="muted">'+esc(t.variant)+' · '+t.points.length+' curvas</div></div><div class="buttons"><button class="btn" data-action="edit" data-id="'+t.id+'">Editar pista</button><button class="btn danger" data-action="delete" data-id="'+t.id+'">Apagar</button></div></div>').join('')||'<div class="empty">Cria uma pista e carrega uma imagem do layout.</div>')+'</div>'}
function dashboard(){return header('Dashboard','Visão geral','<button class="btn primary" data-action="new-track">+ Nova pista</button>')+'<div class="list"><div class="row"><div><b>Pistas</b><div class="muted">'+db.tracks.length+'</div></div></div><div class="row"><div><b>Pilotos</b><div class="muted">'+db.drivers.length+'</div></div></div></div>'}
function drivers(){return header('Pilotos','Base de pilotos e respetivos dados','<button class="btn primary" data-action="new-driver">+ Adicionar piloto</button>')+'<div class="list">'+(db.drivers.map(d=>'<div class="row"><div><b>'+esc(d.name)+'</b><div class="muted">Dados individuais</div></div></div>').join('')||'<div class="empty">Ainda não existem pilotos.</div>')+'</div>'}
function sessions(){return header('Sessões','Cada sessão ficará associada a um piloto e a uma pista.','')+'<div class="empty">A estrutura de sessões será ligada aos pilotos na próxima etapa.</div>'}

function editor(){
 const t=db.tracks.find(x=>String(x.id)===String(ui.editor));if(!t){ui.page='tracks';return tracksPage()}
 const ratio=(t.imageW&&t.imageH)?t.imageW/t.imageH:1.6;
 const p=ui.selected!=null?t.points[ui.selected]:null;
 const comments=p?'<div class="comment-panel"><h3>Curva '+(ui.selected+1)+'</h3>'+
 '<div class="field"><label>Comentário geral</label><textarea id="cc">'+esc(p.comment)+'</textarea></div>'+
 '<div class="field"><label>Travagem</label><textarea id="cb">'+esc(p.braking)+'</textarea></div>'+
 '<div class="field"><label>Entrada</label><textarea id="ce">'+esc(p.entry)+'</textarea></div>'+
 '<div class="field"><label>Apex</label><textarea id="ca">'+esc(p.apex)+'</textarea></div>'+
 '<div class="field"><label>Saída</label><textarea id="cx">'+esc(p.exit)+'</textarea></div>'+
 '<div class="field"><label>Trajetória</label><textarea id="ct">'+esc(p.trajectory)+'</textarea></div>'+
 '<div class="field"><label>Erro</label><textarea id="cr">'+esc(p.error)+'</textarea></div>'+
 '<div class="field"><label>Correção</label><textarea id="ck">'+esc(p.correction)+'</textarea></div>'+
 '<button class="btn primary" style="width:100%" data-action="save-comment">Guardar comentário</button></div>':
 '<div class="comment-panel"><h3>Comentários</h3><div class="help">Seleciona uma curva no mapa para abrir os dados dessa curva.</div><div class="corner-list">'+t.points.map((_,i)=>'<button data-corner="'+i+'">'+(i+1)+'</button>').join('')+'</div></div>';
 return '<div style="margin-bottom:12px"><button class="btn" data-action="back">← Pistas</button></div>'+
 header('Editar · '+t.name,'A imagem ocupa todo o espaço disponível. Sem linhas entre os pontos.','<button class="btn primary" data-action="save">Guardar pista</button>')+
 '<div class="editor"><div>'+
 '<div class="card"><h3>Imagem da pista</h3><button class="btn" data-action="image">Carregar / substituir imagem</button><input id="file" type="file" accept="image/*" hidden><div class="help">A imagem fica sempre a 100% de opacidade e é ajustada ao espaço sem margens brancas.</div></div>'+
 '<div class="card"><h3>Pontos</h3><div class="mode"><button class="btn '+(ui.mode==='add'?'selected':'')+'" data-mode="add">Adicionar</button><button class="btn '+(ui.mode==='select'?'selected':'')+'" data-mode="select">Selecionar</button></div><button class="btn danger" data-action="remove">Apagar selecionado</button><div class="help">Cada clique cria uma curva. A numeração e o total são automáticos.</div></div>'+
 '<div class="card"><h3>Estado</h3><b>'+t.points.length+' curvas</b><div class="help">Sem linhas de ligação: só aparecem os marcadores.</div></div>'+
 '</div><div class="track-area"><div class="track-head"><div><b>'+esc(t.name)+'</b><div class="muted">'+(ui.mode==='add'?'Clica na imagem para criar uma curva.':'Seleciona uma curva para editar.')+'</div></div><b>'+t.points.length+' curvas</b></div><div class="canvas"><div class="stage" id="stage" style="aspect-ratio:'+ratio+'">'+
 (t.image?'<img id="track-image" src="'+t.image+'" alt="Layout da pista">':'<div style="position:absolute;inset:0;display:grid;place-items:center;color:#8f98a2">Carrega uma imagem da pista</div>')+
 '<div id="point-layer">'+t.points.map((q,i)=>'<button type="button" class="point '+(ui.selected===i?'selected':'')+'" data-point="'+i+'" style="left:'+(q.x*100)+'%;top:'+(q.y*100)+'%">'+(i+1)+'</button>').join('')+'</div></div></div>'+comments+'</div>';
}
function render(){document.getElementById('app').innerHTML=ui.page==='editor'?editor():ui.page==='dashboard'?dashboard():ui.page==='drivers'?drivers():ui.page==='sessions'?sessions():tracksPage();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===ui.page));if(ui.page==='editor')bindEditor()}
function modal(s){document.getElementById('modal').innerHTML='<div style="position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:20px;z-index:30"><div style="background:#14181d;border:1px solid #343b44;border-radius:13px;padding:20px;width:min(600px,100%)">'+s+'</div></div>'}
function closeModal(){document.getElementById('modal').innerHTML=''}
function newTrack(){modal('<h2>Nova pista</h2><div class="field"><label>Nome</label><input id="tn" placeholder="Ex.: Viana"></div><div class="field"><label>Variante</label><input id="tv" value="Karting"></div><div class="buttons" style="justify-content:flex-end"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="create">Criar</button></div>')}
function create(){const n=document.getElementById('tn').value.trim();if(!n)return;const t={id:Date.now(),name:n,variant:document.getElementById('tv').value.trim()||'Karting',image:'',imageOpacity:1,imageW:0,imageH:0,points:[]};db.tracks.push(t);save();closeModal();ui.page='editor';ui.editor=t.id;ui.selected=null;ui.mode='add';render()}
function newDriver(){modal('<h2>Novo piloto</h2><div class="field"><label>Nome</label><input id="dn"></div><div class="buttons" style="justify-content:flex-end"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="create-driver">Criar</button></div>')}
function createDriver(){const n=document.getElementById('dn').value.trim();if(!n)return;db.drivers.push({id:Date.now(),name:n});save();closeModal();render()}
function bindEditor(){
 const t=db.tracks.find(x=>String(x.id)===String(ui.editor)); if(!t)return;
 const file=document.getElementById('file');
 file.onchange=()=>{const f=file.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{
   const im=new Image(); im.onload=()=>{t.image=reader.result;t.imageW=im.naturalWidth;t.imageH=im.naturalHeight;t.imageOpacity=1;save();render();toast('Imagem carregada')}; im.onerror=()=>toast('Não foi possível ler a imagem'); im.src=reader.result;
 };reader.readAsDataURL(f)};
 const stage=document.getElementById('stage');
 if(stage && t.image && (!t.imageW || !t.imageH)){
   const im=stage.querySelector('#track-image');
   if(im){
     const setSize=()=>{if(im.naturalWidth&&im.naturalHeight&&!t.imageW){t.imageW=im.naturalWidth;t.imageH=im.naturalHeight;save();render();}};
     if(im.complete)setSize(); else im.addEventListener('load',setSize,{once:true});
   }
 }
}
document.addEventListener('click',e=>{
 const pg=e.target.closest('[data-page]');if(pg){ui.page=pg.dataset.page;ui.editor=null;ui.selected=null;render();return}
 const md=e.target.closest('[data-mode]');if(md){ui.mode=md.dataset.mode;render();return}
 const corner=e.target.closest('[data-corner]');if(corner){ui.selected=Number(corner.dataset.corner);ui.mode='select';render();return}
 const a=e.target.closest('[data-action]');if(!a)return;const x=a.dataset.action;
 if(x==='new-track'){newTrack();return}if(x==='create'){create();return}if(x==='new-driver'){newDriver();return}if(x==='create-driver'){createDriver();return}if(x==='close'){closeModal();return}
 if(x==='edit'){ui.page='editor';ui.editor=a.dataset.id;ui.selected=null;ui.mode='add';render();return}
 if(x==='back'){ui.page='tracks';ui.editor=null;ui.selected=null;render();return}
 if(x==='image'){document.getElementById('file').click();return}
 if(x==='save'){save();toast('Pista guardada');return}
 if(x==='remove'){const t=db.tracks.find(x=>String(x.id)===String(ui.editor));if(ui.selected==null){toast('Seleciona uma curva');return}t.points.splice(ui.selected,1);ui.selected=t.points.length?Math.min(ui.selected,t.points.length-1):null;save();render();return}
 if(x==='delete'){if(confirm('Apagar esta pista?')){db.tracks=db.tracks.filter(t=>String(t.id)!==String(a.dataset.id));save();render()}return}
 if(x==='save-comment'){const t=db.tracks.find(x=>String(x.id)===String(ui.editor)),p=t.points[ui.selected];if(!p)return;p.comment=document.getElementById('cc').value;p.braking=document.getElementById('cb').value;p.entry=document.getElementById('ce').value;p.apex=document.getElementById('ca').value;p.exit=document.getElementById('cx').value;p.trajectory=document.getElementById('ct').value;p.error=document.getElementById('cr').value;p.correction=document.getElementById('ck').value;save();toast('Comentário guardado');return}
});
render();
</script>
</body>
</html>
