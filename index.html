<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pista Coach</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b0e;color:#f4f5f7;font-family:Arial,Helvetica,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.layout{min-height:100vh;display:flex}.sidebar{width:230px;background:#0f1216;border-right:1px solid #292f36;padding:20px;position:fixed;left:0;top:0;bottom:0}
.logo{font-weight:800;font-size:20px;margin:5px 8px 30px}.logo span{color:#7f8994}
.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:#aeb5bd;text-align:left;padding:12px;border-radius:8px}.nav button.active,.nav button:hover{background:#1c2229;color:white}
.content{margin-left:230px;width:calc(100% - 230px);padding:28px;max-width:1500px}.header{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}.title{font-size:28px;font-weight:800}.subtitle{color:#8f98a3;margin-top:5px}
.btn{background:#171c22;color:#fff;border:1px solid #303740;border-radius:8px;padding:10px 14px}.btn.primary{background:#fff;color:#090b0e;border-color:#fff;font-weight:700}.btn.danger{color:#ff9696}.buttons{display:flex;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#12171c;border:1px solid #293038;border-radius:12px;padding:17px}.number{font-size:30px;font-weight:800;margin-top:6px}
.muted{color:#929ba5}.list{display:grid;gap:9px;margin-top:12px}.row{background:#12171c;border:1px solid #293038;border-radius:11px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:15px}.identity{display:flex;align-items:center;gap:11px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#262d35;font-weight:800}
.empty{border:1px dashed #303740;border-radius:11px;padding:35px;text-align:center;color:#929ba5}.section{margin-top:24px}.section h2{font-size:17px;margin:0 0 10px}
.modal-bg{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#12171c;border:1px solid #303740;border-radius:14px;padding:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#aeb5bd}.field input,.field select,.field textarea{background:#0b0e12;color:#fff;border:1px solid #303740;border-radius:7px;padding:10px}.field textarea{min-height:110px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.track{border:1px solid #293038;background:#0b0e12;border-radius:14px;overflow:hidden}.track-top{padding:13px 15px;border-bottom:1px solid #293038;display:flex;justify-content:space-between}.track svg{width:100%;height:500px;display:block}.road{fill:none;stroke:#39434e;stroke-width:50;stroke-linecap:round;stroke-linejoin:round}.road2{fill:none;stroke:#0e1216;stroke-width:35;stroke-linecap:round;stroke-linejoin:round}.line{fill:none;stroke:#dfe3e6;stroke-width:2;stroke-dasharray:8 9;stroke-linecap:round;stroke-linejoin:round}.marker{fill:#fff;stroke:#090b0e;stroke-width:2;cursor:pointer}.marker.selected{fill:#ffd166}.marker:hover{fill:#cbd1d6}.markertext{font-size:13px;font-weight:800;text-anchor:middle;dominant-baseline:middle;pointer-events:none;fill:#111}
.session-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:14px;margin-top:14px}.panel{background:#12171c;border:1px solid #293038;border-radius:14px;padding:16px}.tags{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tag{background:#171c22;color:#dfe3e6;border:1px solid #303740;border-radius:7px;padding:9px;text-align:left}.tag.selected{background:#fff;color:#111;border-color:#fff}.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.note{background:#10151a;border:1px solid #293038;border-radius:9px;padding:11px}.note b{display:block}.score{font-size:38px;font-weight:800;margin-top:5px}.good{color:#7ee2a8}.medium{color:#ffd166}.low{color:#ff8585}
.toast{position:fixed;right:18px;bottom:18px;background:#fff;color:#111;padding:12px 15px;border-radius:8px;font-weight:700;z-index:30}
@media(max-width:900px){.sidebar{width:68px;padding:15px 8px}.logo{font-size:0;text-align:center}.logo:after{content:"PC";font-size:18px}.nav button{font-size:0;text-align:center}.content{margin-left:68px;width:calc(100% - 68px);padding:18px}.cards{grid-template-columns:1fr 1fr}.session-grid{grid-template-columns:1fr}.notes{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.content{padding:13px}.header{align-items:flex-start;flex-direction:column}.cards,.fields,.notes,.tags{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}.row .buttons{width:100%}.row .buttons .btn{width:100%}.track svg{height:370px}.title{font-size:23px}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar"><div class="logo">PISTA <span>COACH</span></div><div class="nav">
<button data-nav="dashboard" class="active">Dashboard</button>
<button data-nav="drivers">Pilotos</button>
<button data-nav="tracks">Pistas</button>
<button data-nav="sessions">Sessões</button>
</div></aside>
<main class="content" id="content"></main>
</div>
<div id="overlay"></div>

<script>
(function(){
'use strict';

const STORAGE_KEY='pista_coach_v2';
const basePoints=[
 [120,115],[235,75],[420,90],[585,145],[665,250],[625,365],
 [505,440],[345,425],[205,470],[100,395],[90,300],[155,245],
 [250,270],[330,225],[430,250],[510,200]
];

const initial={
 drivers:[],
 tracks:[{id:1,name:'Portimão',variant:'Karting',corners:16,points:basePoints}],
 sessions:[]
};

function load(){
 try{
   const raw=localStorage.getItem(STORAGE_KEY);
   return raw?JSON.parse(raw):initial;
 }catch(e){return initial;}
}
let db=load();
let state={page:'dashboard',sessionId:null,corner:1};

function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db));}catch(e){}}
function byId(arr,id){return arr.find(x=>String(x.id)===String(id));}
function driverName(id){const x=byId(db.drivers,id);return x?x.name:'—';}
function trackName(id){const x=byId(db.tracks,id);return x?x.name:'—';}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),1600);}
function header(title,sub,action){return '<div class="header"><div><div class="title">'+esc(title)+'</div><div class="subtitle">'+esc(sub||'')+'</div></div><div>'+ (action||'')+'</div></div>';}

function dashboard(){
 const notes=db.sessions.reduce((n,s)=>n+Object.values(s.corners||{}).filter(c=>c&&c.comment).length,0);
 return header('Dashboard','Coaching e análise em pista','<button class="btn primary" data-action="new-session">+ Nova sessão</button>')+
 '<div class="cards"><div class="card"><div class="muted">Pilotos</div><div class="number">'+db.drivers.length+'</div></div>'+
 '<div class="card"><div class="muted">Pistas</div><div class="number">'+db.tracks.length+'</div></div>'+
 '<div class="card"><div class="muted">Sessões</div><div class="number">'+db.sessions.length+'</div></div>'+
 '<div class="card"><div class="muted">Notas</div><div class="number">'+notes+'</div></div></div>'+
 '<div class="section"><h2>Últimas sessões</h2><div class="list">'+
 (db.sessions.slice().reverse().slice(0,6).map(s=>'<div class="row"><div class="identity"><div class="avatar">'+esc(driverName(s.driverId).charAt(0))+'</div><div><b>'+esc(driverName(s.driverId))+'</b><div class="muted">'+esc(trackName(s.trackId))+' · '+esc(s.date)+'</div></div></div><button class="btn" data-action="open-session" data-id="'+s.id+'">Abrir</button></div>').join('')||'<div class="empty">Ainda não existem sessões.</div>')+
 '</div></div>';
}

function drivers(){
 return header('Pilotos','Pilotos acompanhados','<button class="btn primary" data-action="new-driver">+ Adicionar piloto</button>')+
 '<div class="section"><div class="list">'+
 (db.drivers.map(d=>'<div class="row"><div class="identity"><div class="avatar">'+esc(d.name.charAt(0))+'</div><div><b>'+esc(d.name)+'</b><div class="muted">'+esc(d.category||'Karting')+(d.number?' · #'+esc(d.number):'')+'</div></div></div><div class="buttons"><button class="btn" data-action="driver-sessions" data-id="'+d.id+'">Ver sessões</button><button class="btn danger" data-action="delete-driver" data-id="'+d.id+'">Apagar</button></div></div>').join('')||'<div class="empty">Adiciona o primeiro piloto.</div>')+
 '</div></div>';
}

function tracks(){
 return header('Pistas','Layouts disponíveis','<button class="btn primary" data-action="new-track">+ Adicionar pista</button>')+
 '<div class="section"><div class="list">'+
 db.tracks.map(t=>'<div class="row"><div><b>'+esc(t.name)+'</b><div class="muted">'+esc(t.variant)+' · '+t.corners+' curvas</div></div><div class="buttons"><button class="btn" data-action="preview-track" data-id="'+t.id+'">Ver layout</button><button class="btn danger" data-action="delete-track" data-id="'+t.id+'">Apagar</button></div></div>').join('')+
 '</div></div>';
}

function sessions(){
 return header('Sessões','Histórico de coaching','<button class="btn primary" data-action="new-session">+ Nova sessão</button>')+
 '<div class="section"><div class="list">'+
 (db.sessions.slice().reverse().map(s=>'<div class="row"><div><b>'+esc(driverName(s.driverId))+'</b><div class="muted">'+esc(trackName(s.trackId))+' · '+esc(s.date)+' · '+Object.values(s.corners||{}).filter(c=>c&&c.comment).length+' notas</div></div><div class="buttons"><button class="btn" data-action="open-session" data-id="'+s.id+'">Abrir</button><button class="btn danger" data-action="delete-session" data-id="'+s.id+'">Apagar</button></div></div>').join('')||'<div class="empty">Ainda não existem sessões.</div>')+
 '</div></div>';
}

function path(t){const p=t.points||basePoints;return p.map((a,i)=>(i?'L':'M')+a[0]+' '+a[1]).join(' ')+' Z';}
function mapSvg(t,session){
 const p=(t.points||basePoints).slice(0,t.corners);
 const markers=p.map((a,i)=>{
   const n=i+1,selected=session&&state.corner===n?' selected':'';
   return '<g data-action="select-corner" data-corner="'+n+'"><circle class="marker'+selected+'" cx="'+a[0]+'" cy="'+a[1]+'" r="15"></circle><text class="markertext" x="'+a[0]+'" y="'+a[1]+'">'+n+'</text></g>';
 }).join('');
 return '<svg viewBox="0 0 760 520" aria-label="Mapa da pista"><path class="road" d="'+path(t)+'"></path><path class="road2" d="'+path(t)+'"></path><path class="line" d="'+path(t)+'"></path>'+markers+'</svg>';
}

function sessionPage(){
 const s=byId(db.sessions,state.sessionId);
 if(!s){state.page='sessions';return sessions();}
 const t=byId(db.tracks,s.trackId);
 const c=(s.corners&&s.corners[state.corner])||{};
 const complete=Object.values(s.corners||{}).filter(x=>x&&x.comment).length;
 const score=calcScore(s);
 return '<div style="margin-bottom:12px"><button class="btn" data-action="go-sessions">← Voltar</button></div>'+
 header(driverName(s.driverId)+' · '+t.name,s.date+(s.conditions?' · '+s.conditions:''),'<div class="buttons"><button class="btn" data-action="summary">Resumo</button><button class="btn primary" data-action="save-session">Guardar</button></div>')+
 '<div class="track"><div class="track-top"><div><b>Mapa de análise</b><div class="muted">Clica numa curva para a selecionar.</div></div><div class="muted">'+complete+'/'+t.corners+' avaliadas</div></div>'+mapSvg(t,s)+'</div>'+
 '<div class="session-grid"><div class="panel"><h3>Curva '+state.corner+'</h3>'+
 '<div class="field"><label>Comentário</label><textarea id="corner-comment" placeholder="O que observaste nesta curva?">'+esc(c.comment||'')+'</textarea></div>'+
 '<div class="section"><div class="muted">Classificação</div><div class="tags" style="margin-top:7px">'+['Muito boa','Boa','A melhorar','Erro'].map(v=>'<button class="tag'+(c.rating===v?' selected':'')+'" data-action="rating" data-rating="'+esc(v)+'">'+v+'</button>').join('')+'</div></div>'+
 '<div class="section"><div class="fields"><div class="field"><label>Travagem</label><input id="corner-braking" value="'+esc(c.braking||'')+'" placeholder="Referência / intensidade"></div><div class="field"><label>Entrada</label><input id="corner-entry" value="'+esc(c.entry||'')+'" placeholder="Linha / velocidade"></div><div class="field"><label>Apex</label><input id="corner-apex" value="'+esc(c.apex||'')+'" placeholder="Ponto / velocidade"></div><div class="field"><label>Saída</label><input id="corner-exit" value="'+esc(c.exit||'')+'" placeholder="Linha / aceleração"></div><div class="field full"><label>Erro / correção</label><input id="corner-error" value="'+esc(c.error||'')+'" placeholder="O que deve mudar?"></div></div></div>'+
 '<div class="modal-actions"><button class="btn primary" data-action="save-corner">Guardar curva</button></div></div>'+
 '<div class="panel"><h3>Resumo</h3><div class="muted">Score da sessão</div><div class="score '+(score>=80?'good':score>=55?'medium':'low')+'">'+score+'<span style="font-size:16px">/100</span></div><div class="section"><div class="muted">Condições</div><b>'+esc(s.conditions||'Não registadas')+'</b></div><div class="section"><div class="muted">Curvas avaliadas</div><b>'+complete+' de '+t.corners+'</b></div><div class="section"><div class="muted">Classificação atual</div><b>'+esc(c.rating||'Sem classificação')+'</b></div></div></div>'+
 '<div class="section"><h2>Notas por curva</h2><div class="notes">'+Array.from({length:t.corners},(_,i)=>{const x=(s.corners&&s.corners[i+1])||{};return '<div class="note"><b>Curva '+(i+1)+'</b><small class="muted">'+esc(x.rating||'Sem classificação')+'</small><div style="margin-top:6px">'+esc(x.comment||'Sem nota')+'</div><button class="btn" style="margin-top:8px" data-action="select-corner" data-corner="'+(i+1)+'">Editar</button></div>';}).join('')+'</div></div>';
}

function calcScore(s){
 const points={'Muito boa':100,'Boa':80,'A melhorar':55,'Erro':25};
 const vals=Object.values(s.corners||{}).map(x=>points[x&&x.rating]).filter(x=>typeof x==='number');
 return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0;
}

function render(){
 const c=document.getElementById('content');
 if(state.page==='dashboard')c.innerHTML=dashboard();
 else if(state.page==='drivers')c.innerHTML=drivers();
 else if(state.page==='tracks')c.innerHTML=tracks();
 else if(state.page==='sessions')c.innerHTML=sessions();
 else c.innerHTML=sessionPage();
 document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.page));
}

function overlay(html){document.getElementById('overlay').innerHTML='<div class="modal-bg" data-close="true"><div class="modal">'+html+'</div></div>';}
function closeOverlay(){document.getElementById('overlay').innerHTML='';}

function newDriver(){
 overlay('<h2>Novo piloto</h2><div class="fields"><div class="field"><label>Nome</label><input id="driver-name"></div><div class="field"><label>Número</label><input id="driver-number"></div><div class="field full"><label>Categoria</label><input id="driver-category" value="Karting"></div></div><div class="modal-actions"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="create-driver">Criar</button></div>');
}

function newTrack(){
 overlay('<h2>Nova pista</h2><div class="fields"><div class="field"><label>Nome</label><input id="track-name"></div><div class="field"><label>Variante</label><input id="track-variant" value="Karting"></div><div class="field"><label>Número de curvas</label><input id="track-corners" type="number" min="1" max="16" value="12"></div></div><p class="muted">Nesta versão, o layout base é temporário. Vamos substituir pelos layouts reais das pistas.</p><div class="modal-actions"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="create-track">Criar</button></div>');
}

function newSession(){
 if(!db.drivers.length){overlay('<h2>Primeiro adiciona um piloto</h2><p class="muted">É necessário ter pelo menos um piloto para criar uma sessão.</p><div class="modal-actions"><button class="btn primary" data-action="close">OK</button></div>');return;}
 overlay('<h2>Nova sessão</h2><div class="fields"><div class="field"><label>Piloto</label><select id="session-driver">'+db.drivers.map(d=>'<option value="'+d.id+'">'+esc(d.name)+'</option>').join('')+'</select></div><div class="field"><label>Pista</label><select id="session-track">'+db.tracks.map(t=>'<option value="'+t.id+'">'+esc(t.name)+' — '+esc(t.variant)+'</option>').join('')+'</select></div><div class="field"><label>Data</label><input id="session-date" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label>Condições</label><input id="session-conditions" placeholder="Seco, molhado, temperatura..."></div></div><div class="modal-actions"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="create-session">Começar</button></div>');
}

function previewTrack(id){
 const t=byId(db.tracks,id);
 overlay('<h2>'+esc(t.name)+'</h2><div class="track">'+mapSvg(t,null)+'</div><div class="modal-actions"><button class="btn" data-action="close">Fechar</button></div>');
}

function saveCorner(){
 const s=byId(db.sessions,state.sessionId);
 if(!s)return;
 s.corners=s.corners||{};
 const c=s.corners[state.corner]||{};
 const get=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
 c.comment=get('corner-comment');c.braking=get('corner-braking');c.entry=get('corner-entry');c.apex=get('corner-apex');c.exit=get('corner-exit');c.error=get('corner-error');
 s.corners[state.corner]=c;persist();render();toast('Curva guardada');
}

function createDriver(){
 const name=document.getElementById('driver-name').value.trim();if(!name)return;
 db.drivers.push({id:Date.now(),name,number:document.getElementById('driver-number').value.trim(),category:document.getElementById('driver-category').value.trim()||'Karting'});
 persist();closeOverlay();render();
}
function createTrack(){
 const name=document.getElementById('track-name').value.trim();if(!name)return;
 const n=Math.max(1,Math.min(16,Number(document.getElementById('track-corners').value)||12));
 db.tracks.push({id:Date.now(),name,variant:document.getElementById('track-variant').value.trim()||'Karting',corners:n,points:basePoints.slice(0,n)});
 persist();closeOverlay();render();
}
function createSession(){
 const s={id:Date.now(),driverId:Number(document.getElementById('session-driver').value),trackId:Number(document.getElementById('session-track').value),date:document.getElementById('session-date').value,conditions:document.getElementById('session-conditions').value.trim(),corners:{}};
 db.sessions.push(s);persist();closeOverlay();state.sessionId=s.id;state.corner=1;state.page='session';render();
}

document.addEventListener('click',function(e){
 const nav=e.target.closest('[data-nav]');
 if(nav){state.page=nav.dataset.nav;state.sessionId=null;render();return;}
 const action=e.target.closest('[data-action]');
 if(!action)return;
 const a=action.dataset.action;
 if(a==='close'){closeOverlay();return;}
 if(a==='new-driver'){newDriver();return;}
 if(a==='new-track'){newTrack();return;}
 if(a==='new-session'){newSession();return;}
 if(a==='create-driver'){createDriver();return;}
 if(a==='create-track'){createTrack();return;}
 if(a==='create-session'){createSession();return;}
 if(a==='open-session'){state.sessionId=Number(action.dataset.id);state.corner=1;state.page='session';render();return;}
 if(a==='go-sessions'){state.page='sessions';state.sessionId=null;render();return;}
 if(a==='save-session'){persist();toast('Sessão guardada');return;}
 if(a==='save-corner'){saveCorner();return;}
 if(a==='select-corner'){saveCornerSilent();state.corner=Number(action.dataset.corner);render();return;}
 if(a==='rating'){const s=byId(db.sessions,state.sessionId);s.corners=s.corners||{};s.corners[state.corner]=s.corners[state.corner]||{};s.corners[state.corner].rating=action.dataset.rating;persist();render();return;}
 if(a==='preview-track'){previewTrack(Number(action.dataset.id));return;}
 if(a==='delete-driver'){if(confirm('Apagar este piloto?')){db.drivers=db.drivers.filter(x=>String(x.id)!==String(action.dataset.id));persist();render();}return;}
 if(a==='delete-track'){if(confirm('Apagar esta pista?')){db.tracks=db.tracks.filter(x=>String(x.id)!==String(action.dataset.id));persist();render();}return;}
 if(a==='delete-session'){if(confirm('Apagar esta sessão?')){db.sessions=db.sessions.filter(x=>String(x.id)!==String(action.dataset.id));persist();render();}return;}
 if(a==='driver-sessions'){state.page='sessions';render();return;}
 if(a==='summary'){showSummary();return;}
});
document.getElementById('overlay').addEventListener('click',function(e){if(e.target.dataset.close==='true')closeOverlay();});

function saveCornerSilent(){
 if(state.page!=='session')return;
 const s=byId(db.sessions,state.sessionId);if(!s)return;
 s.corners=s.corners||{};
 const c=s.corners[state.corner]||{};
 const get=id=>{const el=document.getElementById(id);return el?el.value.trim():c[id]||''};
 c.comment=get('corner-comment');c.braking=get('corner-braking');c.entry=get('corner-entry');c.apex=get('corner-apex');c.exit=get('corner-exit');c.error=get('corner-error');
 s.corners[state.corner]=c;persist();
}
function showSummary(){
 const s=byId(db.sessions,state.sessionId);if(!s)return;
 const rows=Object.keys(s.corners||{}).sort((a,b)=>Number(a)-Number(b)).map(n=>{const c=s.corners[n];return '<div class="row"><div><b>Curva '+n+'</b><div class="muted">'+esc(c.rating||'Sem classificação')+'</div></div><div>'+esc(c.comment||'Sem nota')+'</div></div>';}).join('');
 overlay('<h2>Resumo da sessão</h2><p class="muted">'+esc(driverName(s.driverId))+' · '+esc(trackName(s.trackId))+' · '+esc(s.date)+'</p><div class="list">'+(rows||'<div class="empty">Ainda não existem notas.</div>')+'</div><div class="modal-actions"><button class="btn" data-action="close">Fechar</button></div>');
}

render();
})();
</script>
</body>
</html>
